<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#879F87">
<title>N5 Easy — Learn Japanese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sage-50:#F2FAF5;--sage-100:#D9F2E6;--sage-200:#A8D5BA;--sage-400:#879F87;--sage-600:#526B59;--sage-900:#24352C;--cream:#FFFEFA;--muted:#708074;--bg:var(--sage-50);--card-bg:var(--cream);--text:var(--sage-900);--text-muted:var(--muted);--border:var(--sage-100);--shadow:0 2px 12px rgba(82,107,89,0.08);--shadow-card:0 4px 24px rgba(82,107,89,0.10);}
.dark{--bg:#0f1a14;--card-bg:#16241b;--text:#e8f3ed;--text-muted:#8fa898;--border:#233a2c;--shadow:0 2px 12px rgba(0,0,0,0.35);--shadow-card:0 4px 24px rgba(0,0,0,0.45);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans JP','Noto Sans Bengali','Noto Sans Devanagari',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh;transition:background .3s,color .3s}
@media(min-width:768px){body{padding-bottom:0}}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.5}
input,select{font:inherit}
h1,h2,h3{font-weight:600;line-height:1.3}
.jp{font-family:'Noto Sans JP',sans-serif}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}
#header{position:sticky;top:0;z-index:40;background:rgba(255,254,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.dark #header{background:rgba(15,26,20,.92)}
.header-inner{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.brand-logo{width:34px;height:34px;border-radius:50%;background:var(--sage-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-family:'Noto Sans JP',sans-serif}
.nav-desktop{display:none;flex:1;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav-desktop::-webkit-scrollbar{display:none}
@media(min-width:768px){.nav-desktop{display:flex}}
.nav-link{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--sage-600);transition:.2s}
.dark .nav-link{color:var(--sage-200)}
.nav-link.active{background:var(--sage-600);color:#fff}
.nav-link:hover:not(.active){background:var(--sage-100)}
.dark .nav-link:hover:not(.active){background:var(--border)}
.header-actions{display:flex;gap:4px;margin-left:auto}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sage-600);transition:.2s}
.dark .icon-btn{color:var(--sage-200)}
.icon-btn:hover{background:var(--sage-100)}
.dark .icon-btn:hover{background:var(--border)}
#mobile-menu{display:none;background:var(--card-bg);border-bottom:1px solid var(--border);padding:12px;grid-template-columns:1fr 1fr;gap:6px}
#mobile-menu.open{display:grid}
#mobile-menu a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--sage-50)}
.dark #mobile-menu a{background:var(--border)}
#mobile-menu a.active{background:var(--sage-600);color:#fff}
#bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,254,250,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.dark #bottomNav{background:rgba(15,26,20,.95)}
.bn-inner{display:flex;justify-content:space-around;align-items:center;height:60px;max-width:600px;margin:0 auto}
@media(min-width:768px){#bottomNav{display:none}}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-muted);font-size:10px;font-weight:500;padding:4px 8px;transition:.2s}
.bn-item.active{color:var(--sage-600)}
.dark .bn-item.active{color:var(--sage-200)}
.bn-item.active .bn-icon{background:var(--sage-100)}
.dark .bn-item.active .bn-icon{background:var(--border)}
.bn-icon{width:36px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:.2s}
main{max-width:1200px;margin:0 auto;padding:16px;min-height:calc(100vh - 200px)}
@media(min-width:768px){main{padding:24px}}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card.clickable{cursor:pointer;transition:.2s}
.card.clickable:hover{box-shadow:var(--shadow-card);transform:translateY(-2px)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr}
@media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr}}
.grid-3{grid-template-columns:1fr}
@media(min-width:640px){.grid-3{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid-3{grid-template-columns:1fr 1fr 1fr}}
.grid-4{grid-template-columns:repeat(2,1fr)}
@media(min-width:768px){.grid-4{grid-template-columns:repeat(4,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:500;font-size:14px;transition:.2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--sage-600);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--sage-900)}
.btn-soft{background:var(--sage-100);color:var(--sage-900)}
.dark .btn-soft{background:var(--border);color:var(--sage-100)}
.btn-soft:hover{background:var(--sage-200)}
.btn-ghost{background:transparent;color:var(--sage-600)}
.dark .btn-ghost{color:var(--sage-200)}
.btn-ghost:hover{background:var(--sage-100)}
.dark .btn-ghost:hover{background:var(--border)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--sage-100);color:var(--sage-600)}
.dark .pill{background:var(--border);color:var(--sage-200)}
.pill.mint{background:var(--sage-200);color:var(--sage-900)}
.pill.dark{background:var(--sage-600);color:#fff}
.input{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--border);background:var(--sage-50);color:var(--text);outline:none;font-size:14px}
.dark .input{background:var(--bg)}
.input:focus{border-color:var(--sage-400);box-shadow:0 0 0 3px rgba(135,159,135,.15)}
.pbar{width:100%;height:8px;border-radius:999px;background:var(--sage-100);overflow:hidden}
.dark .pbar{background:var(--border)}
.pbar-fill{height:100%;background:var(--sage-600);border-radius:999px;transition:width .6s ease}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring svg{position:absolute;inset:0}
.ring-label{position:relative;font-size:18px;font-weight:700}
.stitle{margin-bottom:16px}
.stitle h2{font-size:18px}
@media(min-width:768px){.stitle h2{font-size:20px}}
.stitle p{font-size:13px;color:var(--text-muted);margin-top:2px}
.lesson-box{margin:12px 0;padding:14px;border-radius:12px;background:var(--sage-50);border-left:3px solid var(--sage-400)}
.dark .lesson-box{background:var(--bg)}
.example{padding:14px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border);margin:10px 0}
.ex-ja{font-size:18px;margin-bottom:4px;line-height:1.8}
.ex-romaji{font-size:13px;color:var(--text-muted);font-style:italic}
.ex-trans{margin-top:8px;font-size:14px}
.ex-trans div{padding:2px 0}
.ex-trans b{color:var(--sage-600);font-weight:600;margin-right:4px}
.quiz-opt{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:12px;border:2px solid var(--border);background:var(--card-bg);margin:8px 0;font-size:15px;transition:.2s}
.quiz-opt:hover{border-color:var(--sage-400)}
.quiz-opt.correct{border-color:#4CAF50;background:rgba(76,175,80,.08)}
.quiz-opt.wrong{border-color:#e57373;background:rgba(229,115,115,.08)}
.quiz-opt.disabled{pointer-events:none;opacity:.75}
.flashcard{perspective:1200px;height:280px;margin:16px 0;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:var(--shadow-card);border:1px solid var(--border)}
.fc-front{background:var(--card-bg)}
.fc-back{background:var(--sage-100);transform:rotateY(180deg)}
.dark .fc-back{background:var(--border)}
.fc-ja{font-size:64px;font-family:'Noto Sans JP',sans-serif;line-height:1.2}
@media(min-width:640px){.fc-ja{font-size:80px}}
.kana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.kana-cell{aspect-ratio:1;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden;transition:.15s}
.kana-cell:hover{border-color:var(--sage-400);transform:translateY(-2px)}
.kana-cell.learned{background:var(--sage-100);border-color:var(--sage-200)}
.dark .kana-cell.learned{background:var(--border);border-color:var(--sage-600)}
.kana-main{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-family:'Noto Sans JP',sans-serif;background:none;border:none;color:inherit;cursor:pointer;padding:4px}
.kana-cell .kr{font-size:11px;color:var(--text-muted);font-family:'Inter',sans-serif;margin-top:2px}
.kana-mark{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;font-size:11px;padding:0;background:rgba(255,255,255,.85);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);line-height:1}
.dark .kana-mark{background:rgba(22,36,27,.85)}
.kana-cell.learned .kana-mark{background:var(--sage-600);color:#fff;border-color:var(--sage-600)}
.kanji-card{cursor:pointer}
.kanji-char{font-size:42px;font-family:'Noto Sans JP',sans-serif;line-height:1}
.kanji-label{font-size:12px;color:var(--text-muted);margin-top:4px}
#toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--sage-900);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:100;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stat-mini{display:flex;flex-direction:column;align-items:center;padding:14px 8px;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--sage-600)}
.stat-lbl{font-size:11px;color:var(--text-muted);margin-top:2px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mt{margin-top:16px}.mt-sm{margin-top:8px}.mb{margin-bottom:16px}.mb-sm{margin-bottom:8px}
.center{text-align:center}
.small{font-size:12px;color:var(--text-muted)}
.text-muted{color:var(--text-muted)}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;font-weight:500;transition:.2s}
.chip.active{background:var(--sage-600);color:#fff;border-color:var(--sage-600)}
.chip:hover:not(.active){border-color:var(--sage-400)}
.list-item{padding:14px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
.list-item:last-child{border-bottom:none}
.lesson-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card-bg);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:.15s}
.lesson-row:hover{border-color:var(--sage-400);transform:translateX(2px)}
.lesson-num{width:38px;height:38px;border-radius:12px;background:var(--sage-100);color:var(--sage-600);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.dark .lesson-num{background:var(--border);color:var(--sage-200)}
.lesson-num.done{background:var(--sage-600);color:#fff}
.lesson-title{flex:1;min-width:0}
.lesson-title h4{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-title p{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speak-btn{width:34px;height:34px;flex-shrink:0;background:var(--sage-100);color:var(--sage-600);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.speak-btn svg{width:16px;height:16px}
.dark .speak-btn{background:var(--border);color:var(--sage-200)}
.speak-btn:hover{background:var(--sage-200);transform:scale(1.05)}
.speak-btn.speaking{animation:pulse .6s ease}
@keyframes pulse{50%{transform:scale(1.25);background:var(--sage-400);color:#fff}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>

<header id="header">
  <div class="header-inner">
    <a href="#/" class="brand"><div class="brand-logo">あ</div><span data-ui="appName">N5 Easy</span></a>
    <nav class="nav-desktop" id="navDesktop"></nav>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu"></button>
    </div>
  </div>
  <nav id="mobile-menu"></nav>
</header>

<main id="app"></main>

<nav id="bottomNav"><div class="bn-inner" id="bnInner"></div></nav>

<div id="toast"></div>

<script>

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ============ SVG ICONS ============ */

  x:_s('<path d="M18 6 6 18M6 6l12 12"/>'),

  check:_s('<polyline points="20 6 9 17 4 12"/>'),
  play:_s('<polygon points="6 3 20 12 6 21 6 3"/>')
};

/* ============ UI TRANSLATIONS ============ */
const UI = {
  appName: T('N5 Easy','N5 Easy','N5 Easy'),
  home: T('Home','হোম','गृह'),
  lessons: T('Lessons','পাঠ','पाठ'),
  practice: T('Practice','অভ্যাস','अभ्यास'),
  flashcards: T('Flashcards','ফ্ল্যাশকার্ড','फ्ल्यासकार्ड'),
  profile: T('Profile','প্রোফাইল','प्रोफाइल'),
  particles: T('Particles','পার্টিকেল','कण'),
  vocabulary: T('Vocabulary','শব্দভান্ডার','शब्दावली'),

const CURATED_URLS_KEY = 'n5easy-curated-urls';
function loadCuratedUrls(){try{return JSON.parse(localStorage.getItem(CURATED_URLS_KEY)||'{}');}catch{return{};}}
let curatedUrls = loadCuratedUrls();
function saveCuratedUrls(){try{localStorage.setItem(CURATED_URLS_KEY,JSON.stringify(curatedUrls));}catch{}}
function getMaterialUrl(m){return curatedUrls[m.id]||m.url||'';}

const MATERIALS_DB='n5easy-materials-db'; let materialsDb=null;
function openMaterialsDB(){return new Promise((res,rej)=>{if(materialsDb)return res(materialsDb);if(!('indexedDB'in window))return rej(new Error('IndexedDB not supported'));const req=indexedDB.open(MATERIALS_DB,1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('pdfs'))db.createObjectStore('pdfs',{keyPath:'id'});};req.onsuccess=e=>{materialsDb=e.target.result;res(materialsDb);};req.onerror=e=>rej(e.target.error);});}
function listUploads(){return openMaterialsDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('pdfs','readonly');const req=tx.objectStore('pdfs').getAll();req.onsuccess=()=>res(req.result||[]);req.onerror=e=>rej(e.target.error);}));}
function saveUploadRecord(file){return openMaterialsDB().then(db=>new Promise((res,rej)=>{const r={id:'up-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:file.name,size:file.size,type:file.type||'application/pdf',uploadedAt:Date.now(),blob:file};const tx=db.transaction('pdfs','readwrite');const req=tx.objectStore('pdfs').add(r);req.onsuccess=()=>res(r);req.onerror=e=>rej(e.target.error);}));}
function getUploadRecord(id){return openMaterialsDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('pdfs','readonly');const req=tx.objectStore('pdfs').get(id);req.onsuccess=()=>res(req.result);req.onerror=e=>rej(e.target.error);}));}
function deleteUploadRecord(id){return openMaterialsDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('pdfs','readwrite');const req=tx.objectStore('pdfs').delete(id);req.onsuccess=()=>res();req.onerror=e=>rej(e.target.error);}));}

function formatBytes(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB';}
function formatDate(ts){try{return new Date(ts).toLocaleDateString(state.lang==='bn'?'bn-BD':state.lang==='ne'?'ne-NP':'en-US',{year:'numeric',month:'short',day:'numeric'});}catch{return new Date(ts).toLocaleDateString();}}

const SAVE_KEY='n5easy-state-v9';
const defaultState={lang:'en',theme:'light',lessonsCompleted:[],lessonsBookmarked:[],vocabLearned:{},vocabBookmarked:{},kanjiLearned:{},kanaMastered:{},quizHistory:[],flashcards:{},streak:{count:0,lastStudy:''},recentLessons:[],dailyGoal:20};
let state=loadState();
function loadState(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return{...defaultState};return{...defaultState,...JSON.parse(raw)};}catch{return{...defaultState};}}
function saveState(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch{}}
function t(obj){if(!obj)return '';if(typeof obj==='string')return obj;return obj[state.lang]||obj.en||'';}
function tUi(key){return t(UI[key]||key);}
function touchStreak(){const today=new Date().toISOString().slice(0,10);if(state.streak.lastStudy===today)return;const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);state.streak.count=state.streak.lastStudy===yesterday?state.streak.count+1:1;state.streak.lastStudy=today;saveState();}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400);}
function toggleArray(arr,id){return arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];}
function toggleMap(map,key){const next={...map};if(next[key])delete next[key];else next[key]=true;return next;}
function reviewSRS(card,quality){let{ease=2.5,interval=0,repetitions=0}=card||{};if(quality===0){repetitions=0;interval=1;}else{if(repetitions===0)interval=1;else if(repetitions===1)interval=3;else interval=Math.max(1,Math.round(interval*ease));repetitions+=1;}const adj=[-0.2,-0.05,0.05,0.15][quality];ease=Math.max(1.3,Math.min(3.0,ease+adj));const due=Date.now()+interval*86400000;return{ease,interval,repetitions,due};}
function isDue(card){return!card||card.due<=Date.now();}

const speakState={ja:null,warned:false};
function initVoices(){if(!('speechSynthesis'in window))return;const load=()=>{const voices=speechSynthesis.getVoices();speakState.ja=voices.find(v=>v.lang==='ja-JP')||voices.find(v=>v.lang.startsWith('ja'));};load();speechSynthesis.onvoiceschanged=load;}
function speak(text,btn){if(!('speechSynthesis'in window)){toast('Audio not supported');return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=0.85;if(!speakState.ja){const vs=speechSynthesis.getVoices();speakState.ja=vs.find(v=>v.lang==='ja-JP')||vs.find(v=>v.lang.startsWith('ja'));}if(speakState.ja)u.voice=speakState.ja;else if(!speakState.warned){speakState.warned=true;toast('No Japanese voice');}if(btn){btn.classList.add('speaking');setTimeout(()=>btn.classList.remove('speaking'),650);}speechSynthesis.speak(u);}catch(e){toast('Audio error');}}

let vocabFilter={q:'',cat:'',lesson:0};

let fcSession={queue:[],index:0,flipped:false,filter:'due'};
function renderFlashcards(){
  const allCards=[];
  GRAMMAR.forEach(l=>l.ex.forEach((ex,i)=>allCards.push({id:`g${l.id}-${i}`,ja:ex.ja,kanji:'',romaji:ex.r,meaning:t(ex.t),type:'grammar'})));
  VOCAB.forEach(v=>allCards.push({id:`v-${v.id}`,ja:v.ja,kanji:v.kanji||'',romaji:v.romaji,meaning:t(v.meaning),type:'vocab'}));
  KANJI.forEach(k=>allCards.push({id:`k-${k.c}`,ja:k.c,kanji:'',romaji:k.on[0]||k.kun[0]||'',meaning:t(k.m),type:'kanji'}));
  let pool=allCards;
  if(fcSession.filter==='due') pool=allCards.filter(c=>isDue(state.flashcards[c.id]));
  else if(fcSession.filter==='bookmarked') pool=allCards.filter(c=>c.type==='vocab'&&state.vocabBookmarked[c.id.replace('v-','')]);
  pool=pool.slice().sort(()=>Math.random()-0.5);
  if(fcSession.queue.length===0||fcSession.filter!==fcSession._lastFilter){fcSession.queue=pool;fcSession.index=0;fcSession.flipped=false;fcSession._lastFilter=fcSession.filter;}
  const dueCount=allCards.filter(c=>isDue(state.flashcards[c.id])).length;
  return `
    <h1 class="stitle"><span>${esc(tUi('flashcards'))}</span><p>${dueCount} ${esc(tUi('dueNow'))} · ${allCards.length} ${esc(tUi('total'))}</p></h1>
    <div class="flex mb" style="overflow-x:auto">
      <button class="chip ${fcSession.filter==='due'?'active':''}" data-action="fc-filter" data-filter="due">${esc(tUi('dueNow'))}</button>
      <button class="chip ${fcSession.filter==='all'?'active':''}" data-action="fc-filter" data-filter="all">${esc(tUi('total'))}</button>
      <button class="chip ${fcSession.filter==='bookmarked'?'active':''}" data-action="fc-filter" data-filter="bookmarked">${esc(tUi('bookmarks'))}</button>
    </div>
    ${fcSession.queue.length===0?`<div class="card center text-muted" style="padding:40px">${esc(tUi('noDue'))}</div>`
      :fcSession.index>=fcSession.queue.length?`<div class="card center" style="padding:40px"><h3>${ICONS.check} ${esc(tUi('completed'))}</h3><p class="small mt-sm">${fcSession.queue.length} cards</p><button class="btn btn-primary mt" data-action="fc-restart">${esc(tUi('again'))}</button></div>`
      :renderCard(fcSession.queue[fcSession.index])}
    <p class="small center mt">${fcSession.queue.length>0?(fcSession.index+1)+' / '+fcSession.queue.length:''}</p>
  `;
}
function renderCard(card){

function renderMaterialCard(m){
  const url=getMaterialUrl(m);
  return `<div class="card"><div style="display:flex;align-items:flex-start;gap:10px"><div class="jp" style="font-size:28px;line-height:1">${m.icon}</div><div style="min-width:0;flex:1"><div style="font-weight:600;font-size:14px">${esc(t(m.title))}</div><div class="small">${esc(t(m.desc))}</div></div></div><div class="flex mt-sm">${url?`<a class="btn btn-primary" style="width:100%" href="${esc(url)}" target="_blank" rel="noopener" download>${ICONS.download} ${state.lang==='bn'?'ডাউনলোড':state.lang==='ne'?'डाउनलोड':'Download'}</a>`:`<button class="btn btn-soft" style="width:100%" data-action="material-set-url" data-id="${m.id}">${ICONS.paperclip} ${state.lang==='bn'?'URL যোগ':state.lang==='ne'?'URL थप':'Add URL'}</button>`}</div></div>`;
}
function renderUploadsSection(uploads){
  if(uploads===null) return `<div class="card center text-muted">Loading…</div>`;
  if(!uploads||uploads.length===0) return `<div class="card center text-muted">${state.lang==='bn'?'এখনো কিছু নেই।':state.lang==='ne'?'अझै केही छैन।':'No uploads yet.'}</div>`;
  return `<div class="grid grid-2">${uploads.map(u=>`<div class="card"><div class="flex-between"><div style="min-width:0;flex:1;display:flex;gap:8px;align-items:center"><div style="color:var(--sage-600)">${ICONS.file}</div><div style="min-width:0"><div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.name)}</div><div class="small">${formatBytes(u.size)} · ${formatDate(u.uploadedAt)}</div></div></div><button class="icon-btn" data-action="material-delete" data-id="${esc(u.id)}">${ICONS.trash}</button></div><button class="btn btn-primary mt-sm" style="width:100%" data-action="material-download" data-id="${esc(u.id)}">${ICONS.download} ${state.lang==='bn'?'ডাউনলোড':state.lang==='ne'?'डाउनलोड':'Download'}</button></div>`).join('')}</div>`;
}
async function loadMaterialsUploads(){
  try{const uploads=await listUploads();uploads.sort((a,b)=>b.uploadedAt-a.uploadedAt);materialsCache.uploads=uploads;const el=document.getElementById('materialsUploads');if(el)el.innerHTML=renderUploadsSection(uploads);}
  catch(e){materialsCache.uploads=[];const el=document.getElementById('materialsUploads');if(el)el.innerHTML=`<div class="card center text-muted">IndexedDB unavailable</div>`;}
}
async function handleDownloadUpload(id){try{const r=await getUploadRecord(id);if(!r){toast('Not found');return;}const url=URL.createObjectURL(r.blob);const a=document.createElement('a');a.href=url;a.download=r.name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),5000);}catch(e){toast('Download failed');}}
async function handleDeleteUpload(id){if(!confirm('Delete?'))return;try{await deleteUploadRecord(id);toast('Deleted');await loadMaterialsUploads();}catch(e){toast('Delete failed');}}

/* ============ BOOKMARKS ============ */

  const bmL=GRAMMAR.filter(l=>state.lessonsBookmarked.includes(l.id));
  const bmV=VOCAB.filter(v=>state.vocabBookmarked[v.id]);
  return `<h1 class="stitle"><span>${esc(tUi('bookmarks'))}</span></h1><h2 class="stitle"><span>${esc(tUi('lessons'))} (${bmL.length})</span></h2>${bmL.length===0?`<div class="card center text-muted">${esc(tUi('noBookmarks'))}</div>`:bmL.map(l=>`<a href="#/lessons/${l.id}" class="lesson-row"><div class="lesson-num">${l.id}</div><div class="lesson-title"><h4>${esc(l.title)}</h4><p>${esc(t(l.meaning))}</p></div><span>${ICONS.arrowRight}</span></a>`).join('')}<h2 class="stitle mt"><span>${esc(tUi('vocabulary'))} (${bmV.length})</span></h2>${bmV.length===0?`<div class="card center text-muted">${esc(tUi('noBookmarks'))}</div>`:`<div class="grid grid-2">${bmV.map(v=>vocabCard(v)).join('')}</div>`}`;
}

    <div class="card mt"><h3>${esc(tUi('progress'))}</h3><p class="mt-sm">${esc(tUi('lessonsCompleted'))}: ${state.lessonsCompleted.length} / ${GRAMMAR.length}</p><p>${esc(tUi('vocabLearned'))}: ${Object.keys(state.vocabLearned).length}</p><p>${esc(tUi('kanjiMastered'))}: ${Object.keys(state.kanjiLearned).length}</p><p>${esc(tUi('flashcards'))}: ${Object.keys(state.flashcards).length}</p></div>
    <div class="card mt" style="border-color:rgba(229,115,115,.4)"><h3 style="color:#c0392b">${esc(tUi('reset'))}</h3><p class="small mt-sm">${esc(tUi('resetConfirm'))}</p><button class="btn mt-sm" style="background:#e57373;color:#fff" data-action="reset-all">${ICONS.trash} ${esc(tUi('reset'))}</button></div>

/* ============ INPUTS ============ */
function bindInputs(){
  const vs=$('#vocabSearch');
  if(vs) vs.oninput = e => {vocabFilter.q=e.target.value;render();setTimeout(()=>{const el=$('#vocabSearch');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0);};
  const gi=$('#goalInput');
  if(gi) gi.onchange = e => {state.dailyGoal=Math.max(5,Math.min(100,+e.target.value||20));saveState();toast('Saved');};
}

/* ============ CLICK HANDLER ============ */
function handleClick(e){
  if(e.target.closest('#mobile-menu a')){const menu=$('#mobile-menu');if(menu)menu.classList.remove('open');const btn=$('#menuBtn');if(btn)btn.innerHTML=ICONS.menu;}
  if(e.target.closest('#themeBtn')){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();render();return;}
  if(e.target.closest('#menuBtn')){const menu=$('#mobile-menu');const isOpen=menu.classList.toggle('open');const btn=$('#menuBtn');btn.innerHTML=isOpen?ICONS.x:ICONS.menu;return;}
  const speakEl=e.target.closest('[data-speak]');
  if(speakEl){e.preventDefault();e.stopPropagation();speak(speakEl.dataset.speak,speakEl);return;}
  const target=e.target.closest('[data-action]');
  if(!target) return;
  const action=target.dataset.action;

  if(action==='toggle-lesson'){const id=+target.dataset.id;state.lessonsCompleted=toggleArray(state.lessonsCompleted,id);state.recentLessons=[id,...state.recentLessons.filter(x=>x!==id)].slice(0,6);touchStreak();saveState();render();toast(state.lessonsCompleted.includes(id)?tUi('completed'):'Unmarked');return;}
  if(action==='bookmark-lesson'){state.lessonsBookmarked=toggleArray(state.lessonsBookmarked,+target.dataset.id);saveState();render();return;}
  if(action==='quiz-answer'){const wrap=target.closest('[data-quiz]');if(!wrap)return;const correct=+target.dataset.correct,chosen=+target.dataset.qi;wrap.querySelectorAll('.quiz-opt').forEach((b,i)=>{b.classList.add('disabled');if(i===correct)b.classList.add('correct');if(i===chosen&&chosen!==correct)b.classList.add('wrong');});const fb=wrap.querySelector('.quiz-feedback');fb.style.display='block';fb.innerHTML=chosen===correct?`<span style="color:#2e7d32">${ICONS.check} ${esc(tUi('correct'))}</span> — ${esc(target.dataset.explain)}`:`<span style="color:#c62828">${ICONS.x} ${esc(tUi('wrong'))}</span> — ${esc(target.dataset.explain)}`;return;}
  if(action==='kana-toggle'){state.kanaMastered=toggleMap(state.kanaMastered,target.dataset.kana);touchStreak();saveState();render();return;}
  if(action==='vocab-learn'){state.vocabLearned=toggleMap(state.vocabLearned,target.dataset.id);touchStreak();saveState();render();return;}
  if(action==='vocab-bm'){state.vocabBookmarked=toggleMap(state.vocabBookmarked,target.dataset.id);saveState();render();return;}
  if(action==='vocab-cat'){vocabFilter.cat=target.dataset.cat;render();return;}
  if(action==='vocab-lesson'){vocabFilter.lesson=+target.dataset.lesson;render();return;}
  if(action==='kanji-toggle'){state.kanjiLearned=toggleMap(state.kanjiLearned,target.dataset.char);touchStreak();saveState();render();return;}
  if(action==='fc-filter'){fcSession.filter=target.dataset.filter;fcSession.queue=[];fcSession.index=0;fcSession.flipped=false;render();return;}
  if(action==='fc-flip'){fcSession.flipped=!fcSession.flipped;render();return;}
  if(action==='fc-rate'){const q=+target.dataset.q;const card=fcSession.queue[fcSession.index];if(!card)return;state.flashcards[card.id]=reviewSRS(state.flashcards[card.id],q);touchStreak();saveState();fcSession.index++;fcSession.flipped=false;render();return;}
  if(action==='fc-restart'){fcSession.queue=[];fcSession.index=0;fcSession.flipped=false;render();return;}
  if(action==='quiz-start'){const lessonId=+($('#quizLesson')?.value||0);let pool=[];GRAMMAR.forEach(l=>{if(!lessonId||l.id===lessonId)pool.push(l.quiz);});PARTICLES.forEach(p=>{if(!lessonId)pool.push(p.quiz);});if(pool.length===0){toast('No questions');return;}pool=pool.sort(()=>Math.random()-0.5).slice(0,Math.min(8,pool.length));quizState={active:true,questions:pool,index:0,answers:[],filter:lessonId,timed:false,mockId:null};state._quizSaved=false;render();return;}
  if(action==='mock-start'){const testId=+target.dataset.id;const test=MOCK_TESTS.find(x=>x.id===testId);if(!test)return;quizState={active:true,questions:test.questions.slice(),index:0,answers:[],filter:0,timed:false,mockId:testId};state._quizSaved=false;location.hash='#/quiz';render();return;}
  if(action==='q-answer'){const idx=+target.dataset.idx;const q=quizState.questions[quizState.index];quizState.answers[quizState.index]={chosen:idx,correct:idx===q.a};render();return;}
  if(action==='q-next'){quizState.index++;render();return;}
  if(action==='quiz-quit'){const wasMock=quizState.mockId;quizState={active:false,questions:[],index:0,answers:[],filter:0,timed:false,mockId:null};if(wasMock)location.hash='#/mocktests';render();return;}
  if(action==='quiz-restart'){quizState={active:false,questions:[],index:0,answers:[],filter:0,timed:false,mockId:null};render();return;}
  if(action==='quiz-retry-wrong'){const wrong=quizState.questions.filter((q,i)=>!quizState.answers[i]?.correct);const mockId=quizState.mockId;quizState={active:true,questions:wrong,index:0,answers:[],filter:quizState.filter,timed:false,mockId};state._quizSaved=false;render();return;}
  if(action==='material-upload'){const input=document.createElement('input');input.type='file';input.accept='.pdf,application/pdf';input.onchange=async ev=>{const file=ev.target.files&&ev.target.files[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.pdf')&&file.type!=='application/pdf'){toast('Only PDF files');return;}if(file.size>100*1024*1024){toast('File too large');return;}try{await saveUploadRecord(file);toast('Uploaded');await loadMaterialsUploads();}catch(err){toast('Upload failed');}};input.click();return;}
  if(action==='material-download'){handleDownloadUpload(target.dataset.id);return;}
  if(action==='material-delete'){handleDeleteUpload(target.dataset.id);return;}
  if(action==='material-set-url'){const id=target.dataset.id;const url=prompt('Enter PDF URL:');if(url&&url.trim()){curatedUrls[id]=url.trim();saveCuratedUrls();render();toast('URL saved');}return;}
  if(action==='lang'){state.lang=target.dataset.lang;saveState();render();return;}
  if(action==='theme'){state.theme=target.dataset.theme;applyTheme();saveState();render();return;}
  if(action==='reset-all'){if(confirm(tUi('resetConfirm'))){const lang=state.lang,theme=state.theme;state={...defaultState,lang,theme};saveState();render();toast(tUi('reset'));}return;}
}
function applyTheme(){document.documentElement.classList.toggle('dark',state.theme==='dark');}

/* ============ INIT ============ */
let initialized=false;
function init(){
  if(initialized)return;
  initialized=true;
  applyTheme();
  if(!location.hash) location.hash='#/';
  document.body.addEventListener('click',handleClick);
  initVoices();
  render();
}
if(document.readyState!=='loading') init();
else document.addEventListener('DOMContentLoaded',init);
</script>
