  function progressRing(pct,size=96,stroke=8){const r=(size-stroke)/2;const c=2*Math.PI*r;const off=c-(Math.min(100,Math.max(0,pct))/100)*c;return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(82,107,89,0.15)" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--sage-600)" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .9s ease"/></svg><div class="ring-label">${Math.round(pct)}%</div></div>`;}

  /* ============ LESSONS ============ */
  function renderLessons(){return `
  <h1 class="stitle"><span>${esc(tUi('allLessons'))}</span><p>${GRAMMAR.length} ${esc(tUi('lessons'))} · JLPT N5</p></h1>
  <div style="margin-bottom:16px"><a href="#/quiz" class="btn btn-primary">${ICONS.target} ${esc(tUi('quiz'))}</a> <a href="#/mocktests" class="btn btn-soft" style="margin-left:6px">${ICONS.target} ${esc(tUi('mockTests'))}</a></div>
  ${GRAMMAR.map(l=>`<a href="#/lessons/${l.id}" class="lesson-row"><div class="lesson-num ${state.lessonsCompleted.includes(l.id)?'done':''}">${l.id}</div><div class="lesson-title"><h4>${esc(l.title)}</h4><p>${esc(t(l.meaning))}</p></div><div class="small">${state.lessonsBookmarked.includes(l.id)?ICONS.bookmark:''}</div></a>`).join('')}
`;}
  const LESSON_DETAIL={"1":{"why":{"en":"は is written with the hiragana “ha” but read “wa” here. It marks the topic: what the sentence is about. です makes the sentence polite and acts like “am / is / are”. Japanese has no separate words for am/is/are, and the verb-like word always comes at the end.","bn":"は হিরাগানায় “হা” লেখা হলেও এখানে “ওয়া” পড়া হয়। এটি টপিক বোঝায়, অর্থাৎ বাক্যে কী নিয়ে কথা হচ্ছে। です বাক্যকে ভদ্র করে এবং “am / is / are”-এর মতো কাজ করে। জাপানিতে am, is, are-এর আলাদা শব্দ নেই এবং ক্রিয়া-জাতীয় অংশ সবসময় শেষে বসে।","ne":"は हिरागानामा “हा” लेखिए पनि यहाँ “वा” पढिन्छ। यसले विषय जनाउँछ, अर्थात् वाक्य कुन कुराको बारेमा हो। です ले वाक्यलाई शिष्ट बनाउँछ र “हुँ / हो / छ” जस्तै काम गर्छ। जापानीमा am/is/are का लागि अलग शब्द हुँदैनन् र क्रिया जस्तो भाग सधैं अन्त्यमा आउँछ।"},"form":[{"en":"Positive: Topic + は + Noun + です.","bn":"ইতিবাচক: টপিক + は + বিশেষ্য + です।","ne":"सकारात्मक: विषय + は + नाम + です।"},{"en":"Negative: replace です with じゃ ありません. Question: add か at the end.","bn":"নেতিবাচক: です-এর জায়গায় じゃ ありません। প্রশ্ন: শেষে か যোগ করুন।","ne":"नकारात्मक: です को सट्टा じゃ ありません। प्रश्न: अन्त्यमा か थप्नुहोस्।"}],"use":[{"en":"Introducing yourself or other people.","bn":"নিজের বা অন্যের পরিচয় দিতে।","ne":"आफ्नो वा अरूको परिचय दिन।"},{"en":"Saying what something is: a name, job, nationality.","bn":"কিছু কী তা বলতে: নাম, পেশা, জাতীয়তা।","ne":"कुनै कुरा के हो भन्न: नाम, पेशा, राष्ट्रियता।"}],"cmp":{"en":"は vs が: は sets the topic (what we are talking about). が points out a new or specific subject. In self-introductions at N5 level, use は.","bn":"は বনাম が: は টপিক ঠিক করে (আমরা কী নিয়ে কথা বলছি)। が নতুন বা নির্দিষ্ট কর্তাকে দেখায়। N5 স্তরে পরিচয় দিতে は ব্যবহার করুন।","ne":"は बनाम が: は ले विषय तोक्छ (हामी के बारे कुरा गर्दैछौं)। が ले नयाँ वा निश्चित कर्तालाई देखाउँछ। N5 तहमा परिचयमा は प्रयोग गर्नुहोस्।"},"more":[{"ja":"あの ひとは せんせいです。","r":"Ano hito wa sensei desu.","t":{"en":"That person is a teacher.","bn":"ওই ব্যক্তি একজন শিক্ষক।","ne":"त्यो व्यक्ति शिक्षक हुनुहुन्छ।"},"p":[["あの ひと",{"en":"that person","bn":"ওই ব্যক্তি","ne":"त्यो व्यक्ति"}],["は",{"en":"topic marker","bn":"টপিক চিহ্ন","ne":"विषय चिन्ह"}],["せんせい",{"en":"teacher","bn":"শিক্ষক","ne":"शिक्षक"}],["です",{"en":"is (polite)","bn":"হয় (ভদ্র)","ne":"हो (शिष्ट)"}]]},{"ja":"マリアさんは にほんじん じゃ ありません。","r":"Maria-san wa nihonjin ja arimasen.","t":{"en":"Maria is not Japanese.","bn":"মারিয়া জাপানি নন।","ne":"मारिया जापानी होइनन्।"},"p":[["マリアさん",{"en":"Maria (polite)","bn":"মারিয়া (সম্মানসূচক)","ne":"मारिया (आदरसूचक)"}],["は",{"en":"topic marker","bn":"টপিক চিহ্ন","ne":"विषय चिन्ह"}],["にほんじん",{"en":"Japanese person","bn":"জাপানি মানুষ","ne":"जापानी मानिस"}],["じゃ ありません",{"en":"is not","bn":"নয়","ne":"होइन"}]]}],"drill":[{"q":{"en":"あなたは せんせい__。 (Are you a teacher?)","bn":"あなたは せんせい__。 (আপনি কি শিক্ষক?)","ne":"あなたは せんせい__。 (तपाईं शिक्षक हुनुहुन्छ?)"},"o":["です","ですか","じゃ","を"],"a":1,"e":{"en":"か at the end turns a sentence into a question.","bn":"শেষে か যোগ করলে বাক্য প্রশ্ন হয়।","ne":"अन्त्यमा か थप्दा वाक्य प्रश्न बन्छ।"}},{"q":{"en":"わたしは エンジニア __。 (I am not an engineer.)","bn":"わたしは エンジニア __。 (আমি ইঞ্জিনিয়ার নই।)","ne":"わたしは エンジニア __。 (म इन्जिनियर होइन।)"},"o":["じゃ ありません","です","ですか","でした"],"a":0,"e":{"en":"じゃ ありません is the polite negative of です.","bn":"じゃ ありません হলো です-এর ভদ্র নেতিবাচক রূপ।","ne":"じゃ ありません です को शिष्ट नकारात्मक रूप हो।"}}]},"2":{"why":{"en":"これ, それ, あれ point to things and change with distance. これ is near the speaker, それ is near the listener, あれ is far from both. どれ means “which one?”. These words stand alone: no noun comes right after them.","bn":"দূরত্ব অনুযায়ী জিনিস দেখাতে これ, それ, あれ ব্যবহার হয়। これ বক্তার কাছে, それ শ্রোতার কাছে, あれ দুজনের থেকেই দূরে। どれ মানে “কোনটি?”। এগুলো একা বসে, এদের ঠিক পরে কোনো বিশেষ্য আসে না।","ne":"दूरीअनुसार चिज देखाउन これ, それ, あれ प्रयोग हुन्छ। これ बोल्नेको नजिक, それ सुन्नेको नजिक, あれ दुवैबाट टाढा। どれ को अर्थ “कुन?” हो। यी शब्द एक्लै आउँछन्, यिनको ठीक पछि नाम आउँदैन।"},"form":[{"en":"Choose by distance: これ / それ / あれ.","bn":"দূরত্ব অনুযায়ী বেছে নিন: これ / それ / あれ।","ne":"दूरीअनुसार रोज्नुहोस्: これ / それ / あれ।"},{"en":"Then add は and a noun: これは ほんです。","bn":"তারপর は ও বিশেষ্য যোগ করুন: これは ほんです।","ne":"त्यसपछि は र नाम थप्नुहोस्: これは ほんです।"}],"use":[{"en":"Pointing at objects while talking.","bn":"কথা বলার সময় জিনিস দেখাতে।","ne":"कुरा गर्दा वस्तु देखाउन।"},{"en":"Asking what something is: これは なんですか。","bn":"কিছু কী জানতে: これは なんですか।","ne":"के हो भनेर सोध्न: これは なんですか।"}],"cmp":{"en":"これ vs この: これ stands alone (これは ほんです). この needs a noun right after it (この ほんは おもしろいです).","bn":"これ বনাম この: これ একা বসে (これは ほんです)। この-এর ঠিক পরে বিশেষ্য লাগে (この ほんは おもしろいです)।","ne":"これ बनाम この: これ एक्लै आउँछ (これは ほんです)। この पछि तुरुन्तै नाम चाहिन्छ (この ほんは おもしろいです)।"},"more":[{"ja":"これは なんですか。","r":"Kore wa nan desu ka.","t":{"en":"What is this?","bn":"এটি কী?","ne":"यो के हो?"},"p":[["これ",{"en":"this (thing)","bn":"এটি","ne":"यो"}],["は",{"en":"topic marker","bn":"টপিক চিহ্ন","ne":"विषय चिन्ह"}],["なん",{"en":"what","bn":"কী","ne":"के"}],["です",{"en":"is","bn":"হয়","ne":"हो"}],["か",{"en":"question marker","bn":"প্রশ্ন চিহ্ন","ne":"प्रश्न चिन्ह"}]]},{"ja":"それは わたしの かさです。","r":"Sore wa watashi no kasa desu.","t":{"en":"That (near you) is my umbrella.","bn":"ওটা (আপনার কাছে) আমার ছাতা।","ne":"त्यो (तपाईंको नजिक) मेरो छाता हो।"},"p":[["それ",{"en":"that (near you)","bn":"ওটা","ne":"त्यो"}],["は",{"en":"topic marker","bn":"টপিক চিহ্ন","ne":"विषय चिन्ह"}],["わたし",{"en":"I","bn":"আমি","ne":"म"}],["の",{"en":"'s (possessive)","bn":"-র (মালিকানা)","ne":"को (स्वामित्व)"}],["かさ",{"en":"umbrella","bn":"ছাতা","ne":"छाता"}],["です",{"en":"is","bn":"হয়","ne":"हो"}]]}],"drill":[{"q":{"en":"__ は あなたの かばんですか。 (the bag near the listener)","bn":"__ は あなたの かばんですか。 (শ্রোতার কাছের ব্যাগ)","ne":"__ は あなたの かばんですか。 (सुन्नेको नजिकको झोला)"},"o":["これ","それ","あれ","どれ"],"a":1,"e":{"en":"Near the listener = それ.","bn":"শ্রোতার কাছে = それ।","ne":"सुन्नेको नजिक = それ।"}},{"q":{"en":"__ ほんは おもしろいです。 (This book is interesting.)","bn":"__ ほんは おもしろいです。 (এই বইটি মজার।)","ne":"__ ほんは おもしろいです。 (यो किताब रमाइलो छ।)"},"o":["これ","この","ここ","それ"],"a":1,"e":{"en":"Before a noun you need この, not これ.","bn":"বিশেষ্যের আগে この লাগে, これ নয়।","ne":"नामअगाडि この चाहिन्छ, これ होइन।"}}]},"3":{"why":{"en":"ここ, そこ, あそこ name places. ここ is the place near the speaker, そこ is near the listener, あそこ is far from both. どこ means “where?”. They follow the same ko-so-a-do pattern as これ / それ / あれ.","bn":"ここ, そこ, あそこ স্থান বোঝায়। ここ বক্তার কাছের জায়গা, そこ শ্রোতার কাছের, あそこ দুজনের থেকেই দূরে। どこ মানে “কোথায়?”। এটি これ / それ / あれ-এর মতোই ko-so-a-do ছক মেনে চলে।","ne":"ここ, そこ, あそこ ठाउँ जनाउँछन्। ここ बोल्नेको नजिकको ठाउँ, そこ सुन्नेको नजिकको, あそこ दुवैबाट टाढा। どこ को अर्थ “कहाँ?” हो। यो これ / それ / あれ जस्तै ko-so-a-do ढाँचामा चल्छ।"},"form":[{"en":"Place word + は + thing + です, or thing + は + place word + です.","bn":"স্থান + は + বস্তু + です, অথবা বস্তু + は + স্থান + です।","ne":"ठाउँ + は + वस्तु + です, वा वस्तु + は + ठाउँ + です।"},{"en":"To ask: どこですか。","bn":"জিজ্ঞাসা করতে: どこですか।","ne":"सोध्न: どこですか。"}],"use":[{"en":"Saying where something is: トイレは あそこです。","bn":"কিছু কোথায় তা বলতে: トイレは あそこです।","ne":"कुनै कुरा कहाँ छ भन्न: トイレは あそこです।"},{"en":"Asking for directions in a simple way.","bn":"সহজভাবে পথ জানতে চাইতে।","ne":"सजिलै बाटो सोध्न।"}],"cmp":{"en":"ここ vs これ: ここ is a place (“here”), これ is a thing (“this”). Say ここは がっこうです for “This place is a school”.","bn":"ここ বনাম これ: ここ হলো জায়গা (“এখানে”), これ হলো জিনিস (“এটি”)। “এই জায়গাটি স্কুল” বলতে ここは がっこうです।","ne":"ここ बनाम これ: ここ ठाउँ हो (“यहाँ”), これ वस्तु हो (“यो”)। “यो ठाउँ विद्यालय हो” भन्न ここは がっこうです।"},"more":[{"ja":"トイレは あそこです。","r":"Toire wa asoko desu.","t":{"en":"The toilet is over there.","bn":"টয়লেট ওখানে।","ne":"शौचालय त्यहाँ टाढा छ।"},"p":[["トイレ",{"en":"toilet","bn":"টয়লেট","ne":"शौचालय"}],["は",{"en":"topic marker","bn":"টপিক চিহ্ন","ne":"विषय चिन्ह"}],["あそこ",{"en":"over there","bn":"ওখানে","ne":"त्यहाँ टाढा"}],["です",{"en":"is","bn":"হয়","ne":"हो"}]]},{"ja":"ここは わたしの がっこうです。","r":"Koko wa watashi no gakkou desu.","t":{"en":"This is my school.","bn":"এটি আমার স্কুল।","ne":"यो मेरो विद्यालय हो।"},"p":[["ここ",{"en":"this place","bn":"এই জায়গা","ne":"यो ठाउँ"}],["は",{"en":"topic marker","bn":"টপিক চিহ্ন","ne":"विषय चिन्ह"}],["わたし",{"en":"I","bn":"আমি","ne":"म"}],["の",{"en":"'s","bn":"-র","ne":"को"}],["がっこう",{"en":"school","bn":"স্কুল","ne":"विद्यालय"}],["です",{"en":"is","bn":"হয়","ne":"हो"}]]}],"drill":[{"q":{"en":"ぎんこうは __ ですか。 (Where is the bank?)","bn":"ぎんこうは __ ですか。 (ব্যাংক কোথায়?)","ne":"ぎんこうは __ ですか。 (बैंक कहाँ छ?)"},"o":["どこ","だれ","なに","いつ"],"a":0,"e":{"en":"どこ asks about a place.","bn":"どこ স্থান জিজ্ঞাসা করে।","ne":"どこ ठाउँ सोध्छ।"}},{"q":{"en":"__ は えきです。 (a station far from both of us)","bn":"__ は えきです。 (আমাদের দুজনের থেকেই দূরের স্টেশন)","ne":"__ は えきです。 (हामी दुवैबाट टाढाको स्टेशन)"},"o":["ここ","そこ","あそこ","これ"],"a":2,"e":{"en":"Far from both speaker and listener = あそこ.","bn":"বক্তা ও শ্রোতা দুজনের থেকেই দূরে = あそこ।","ne":"बोल्ने र सुन्ने दुवैबाट टाढा = あそこ।"}}]},"4":{"why":{"en":"も means “also / too”. It takes the place of は (or が, を) when the new sentence says the same thing about a new topic. Both sentences must say something alike, otherwise も sounds wrong.","bn":"も মানে “ও / ও-ও”। নতুন বাক্যে নতুন টপিক সম্পর্কে একই কথা বললে は (বা が, を)-এর জায়গায় も বসে। দুটি বাক্যে একই ধরনের কথা থাকতে হবে, নইলে も অদ্ভুত শোনায়।","ne":"も को अर्थ “पनि” हो। नयाँ विषयको बारेमा उही कुरा भन्दा は (वा が, を) को ठाउँमा も आउँछ। दुवै वाक्यमा मिल्दो कुरा हुनुपर्छ, होइन भने も अनौठो सुनिन्छ।"},"form":[{"en":"Take the sentence with は and replace は with も.","bn":"は-যুক্ত বাক্যে は বাদ দিয়ে も বসান।","ne":"は भएको वाक्यमा は हटाएर も राख्नुहोस्।"},{"en":"Never use は and も together on the same word.","bn":"একই শব্দে は ও も একসাথে ব্যবহার করবেন না।","ne":"एउटै शब्दमा は र も सँगै नराख्नुहोस्।"}],"use":[{"en":"Saying someone or something shares a feature.","bn":"কারও বা কিছুর একই বৈশিষ্ট্য আছে বলতে।","ne":"कसैमा वा कुनै कुरामा उस्तै विशेषता छ भन्न।"},{"en":"Replying “me too”: わたしも です。","bn":"“আমিও” বলতে: わたしも です।","ne":"“म पनि” भन्न: わたしも です।"}],"cmp":{"en":"も vs と: も means “also” and links two separate statements. と means “and” and joins nouns inside one statement.","bn":"も বনাম と: も মানে “ও” এবং দুটি আলাদা বাক্য যোগ করে। と মানে “এবং” এবং এক বাক্যের ভেতরে বিশেষ্য যোগ করে।","ne":"も बनाम と: も को अर्थ “पनि” हो र दुई अलग वाक्य जोड्छ। と को अर्थ “र” हो र एउटै वाक्यभित्र नाम जोड्छ।"},"more":[{"ja":"ケンさんも にほんじんです。","r":"Ken-san mo nihonjin desu.","t":{"en":"Ken is Japanese too.","bn":"কেনও জাপানি।","ne":"केन पनि जापानी हुन्।"},"p":[["ケンさん",{"en":"Ken (polite)","bn":"কেন (সম্মানসূচক)","ne":"केन (आदरसूचक)"}],["も",{"en":"also","bn":"ও","ne":"पनि"}],["にほんじん",{"en":"Japanese person","bn":"জাপানি মানুষ","ne":"जापानी मानिस"}],["です",{"en":"is","bn":"হয়","ne":"हो"}]]},{"ja":"これも ほんです。","r":"Kore mo hon desu.","t":{"en":"This is also a book.","bn":"এটিও একটি বই।","ne":"यो पनि किताब हो।"},"p":[["これ",{"en":"this","bn":"এটি","ne":"यो"}],["も",{"en":"also","bn":"ও","ne":"पनि"}],["ほん",{"en":"book","bn":"বই","ne":"किताब"}],["です",{"en":"is","bn":"হয়","ne":"हो"}]]}],"drill":[{"q":{"en":"A: わたしは がくせいです。 B: わたし__ がくせいです。 (Me too.)","bn":"A: わたしは がくせいです。 B: わたし__ がくせいです。 (আমিও।)","ne":"A: わたしは がくせいです。 B: わたし__ がくせいです。 (म पनि।)"},"o":["は","も","の","を"],"a":1,"e":{"en":"も means “also”, so B says “I am also a student”.","bn":"も মানে “ও”, তাই B বলছে “আমিও ছাত্র”।","ne":"も को अर्थ “पनि” हो, त्यसैले B भन्छ “म पनि विद्यार्थी हुँ”।"}},{"q":{"en":"Which sentence means “This is also a pen”?","bn":"কোন বাক্যের অর্থ “এটিও একটি কলম”?","ne":"कुन वाक्यको अर्थ “यो पनि कलम हो” हो?"},"o":["これは ペンです。","これも ペンです。","これと ペンです。","これの ペンです。"],"a":1,"e":{"en":"これも = “this too”.","bn":"これも = “এটিও”।","ne":"これも = “यो पनि”।"}}]},"5":{"why":{"en":"の connects two nouns. The first noun describes or owns the second: わたしの ほん = my book. The main noun comes last, and the describing noun comes first. It is used for possession, type, place and group.","bn":"の দুটি বিশেষ্য যুক্ত করে। প্রথম বিশেষ্য দ্বিতীয়টির বর্ণনা দেয় বা মালিক হয়: わたしの ほん = আমার বই। মূল বিশেষ্য শেষে বসে, বর্ণনাকারী আগে। মালিকানা, ধরন, স্থান ও দলের ক্ষেত্রে এটি চলে।","ne":"の ले दुई नामलाई जोड्छ। पहिलो नामले दोस्रोको वर्णन गर्छ वा मालिक हुन्छ: わたしの ほん = मेरो किताब। मुख्य नाम अन्त्यमा र वर्णन गर्ने नाम अगाडि आउँछ। स्वामित्व, प्रकार, स्थान र समूहमा यो प्रयोग हुन्छ।"},"form":[{"en":"N1 の N2: N1 describes N2.","bn":"N1 の N2: N1 হলো N2-এর বর্ণনা।","ne":"N1 の N2: N1 ले N2 को वर्णन गर्छ।"},{"en":"Read it backwards in English: “N2 of N1”.","bn":"ইংরেজিতে উল্টো করে পড়ুন: “N1-এর N2”।","ne":"अंग्रेजीमा उल्टो पढ्नुहोस्: “N1 को N2”।"}],"use":[{"en":"Possession: わたしの かばん (my bag).","bn":"মালিকানা: わたしの かばん (আমার ব্যাগ)।","ne":"स्वामित्व: わたしの かばん (मेरो झोला)।"},{"en":"Type or field: にほんごの せんせい (Japanese-language teacher).","bn":"ধরন বা বিষয়: にほんごの せんせい (জাপানি ভাষার শিক্ষক)।","ne":"प्रकार वा विषय: にほんごの せんせい (जापानी भाषाका शिक्षक)।"}],"cmp":{"en":"の vs は: の links two nouns inside a phrase. は marks the topic of the whole sentence. わたしの ほんは あれです = “My book is that one”.","bn":"の বনাম は: の বাক্যাংশের ভেতরে দুটি বিশেষ্য জোড়ে। は পুরো বাক্যের টপিক ঠিক করে। わたしの ほんは あれです = “আমার বইটি ওটা”।","ne":"の बनाम は: の ले वाक्यांशभित्र दुई नाम जोड्छ। は ले पूरा वाक्यको विषय तोक्छ। わたしの ほんは あれです = “मेरो किताब त्यो हो”।"},"more":[{"ja":"これは にほんごの ほんです。","r":"Kore wa nihongo no hon desu.","t":{"en":"This is a Japanese-language book.","bn":"এটি জাপানি ভাষার বই।","ne":"यो जापानी भाषाको किताब हो।"},"p":[["これ",{"en":"this","bn":"এটি","ne":"यो"}],["は",{"en":"topic marker","bn":"টপিক চিহ্ন","ne":"विषय चिन्ह"}],["にほんご",{"en":"Japanese language","bn":"জাপানি ভাষা","ne":"जापानी भाषा"}],["の",{"en":"of","bn":"-র","ne":"को"}],["ほん",{"en":"book","bn":"বই","ne":"किताब"}],["です",{"en":"is","bn":"হয়","ne":"हो"}]]},{"ja":"あれは ケンさんの くるまです。","r":"Are wa Ken-san no kuruma desu.","t":{"en":"That over there is Ken's car.","bn":"ওটা কেনের গাড়ি।","ne":"त्यो केनको गाडी हो।"},"p":[["あれ",{"en":"that over there","bn":"ওটা","ne":"त्यो टाढाको"}],["は",{"en":"topic marker","bn":"টপিক চিহ্ন","ne":"विषय चिन्ह"}],["ケンさん",{"en":"Ken","bn":"কেন","ne":"केन"}],["の",{"en":"'s","bn":"-র","ne":"को"}],["くるま",{"en":"car","bn":"গাড়ি","ne":"गाडी"}],["です",{"en":"is","bn":"হয়","ne":"हो"}]]}],"drill":[{"q":{"en":"これは わたし__ かばんです。 (my bag)","bn":"これは わたし__ かばんです。 (আমার ব্যাগ)","ne":"これは わたし__ かばんです。 (मेरो झोला)"},"o":["の","は","を","に"],"a":0,"e":{"en":"の joins わたし and かばん.","bn":"の わたし ও かばん-কে যুক্ত করে।","ne":"の ले わたし र かばん जोड्छ।"}},{"q":{"en":"Which means “a teacher of Japanese”?","bn":"কোনটির অর্থ “জাপানি ভাষার শিক্ষক”?","ne":"कुनको अर्थ “जापानी भाषाका शिक्षक” हो?"},"o":["にほんごの せんせい","せんせいの にほんご","にほんごを せんせい","にほんごが せんせい"],"a":0,"e":{"en":"The describing noun (にほんご) comes first, then の, then the main noun.","bn":"বর্ণনাকারী বিশেষ্য (にほんご) আগে, তারপর の, তারপর মূল বিশেষ্য।","ne":"वर्णन गर्ने नाम (にほんご) पहिले, त्यसपछि の, अनि मुख्य नाम।"}}]},"6":{"why":{"en":"を marks the direct object: the thing the verb acts on. It is written “wo” but pronounced “o”. The verb in ます-form always comes at the end, so the order is Object を Verb.","bn":"を হলো কর্ম চিহ্ন: ক্রিয়া যার ওপর কাজ করে। লেখা হয় “wo”, উচ্চারণ হয় “ও”। ক্রিয়া ます-রূপে সবসময় শেষে বসে, তাই ক্রম হলো কর্ম を ক্রিয়া।","ne":"を कर्म चिन्ह हो: क्रियाले जसमाथि काम गर्छ। “wo” लेखिन्छ तर “ओ” उच्चारण हुन्छ। क्रिया ます-रूपमा सधैं अन्त्यमा आउँछ, त्यसैले क्रम कर्म を क्रिया हो।"},"form":[{"en":"Noun + を + verb (ます-form).","bn":"বিশেষ্য + を + ক্রিয়া (ます-রূপ)।","ne":"नाम + を + क्रिया (ます-रूप)।"},{"en":"Negative: change ます to ません.","bn":"নেতিবাচক: ます-কে ません করুন।","ne":"नकारात्मक: ます लाई ません बनाउनुहोस्।"}],"use":[{"en":"Eating, drinking, reading, watching, buying.","bn":"খাওয়া, পান করা, পড়া, দেখা, কেনা।","ne":"खाने, पिउने, पढ्ने, हेर्ने, किन्ने।"},{"en":"Any action that happens to a thing.","bn":"কোনো জিনিসের ওপর ঘটা যেকোনো কাজ।","ne":"कुनै वस्तुमाथि हुने जुनसुकै काम।"}],"cmp":{"en":"を vs が: を marks the object of an action verb (たべます). が marks the thing in feeling or state words like すき, ほしい, わかります.","bn":"を বনাম が: を কাজের ক্রিয়ার কর্ম বোঝায় (たべます)। が অনুভূতি বা অবস্থার শব্দে (すき, ほしい, わかります) বিষয় বোঝায়।","ne":"を बनाम が: を ले कामको क्रिया (たべます) को कर्म जनाउँछ। が ले भावना वा अवस्थाका शब्द (すき, ほしい, わかります) मा वस्तु जनाउँछ।"},"more":[{"ja":"コーヒーを のみます。","r":"Koohii o nomimasu.","t":{"en":"I drink coffee.","bn":"আমি কফি খাই।","ne":"म कफी पिउँछु।"},"p":[["コーヒー",{"en":"coffee","bn":"কফি","ne":"कफी"}],["を",{"en":"object marker","bn":"কর্ম চিহ্ন","ne":"कर्म चिन्ह"}],["のみます",{"en":"drink","bn":"পান করি","ne":"पिउँछु"}]]},{"ja":"あさ ほんを よみます。","r":"Asa hon o yomimasu.","t":{"en":"I read a book in the morning.","bn":"আমি সকালে বই পড়ি।","ne":"म बिहान किताब पढ्छु।"},"p":[["あさ",{"en":"morning","bn":"সকাল","ne":"बिहान"}],["ほん",{"en":"book","bn":"বই","ne":"किताब"}],["を",{"en":"object marker","bn":"কর্ম চিহ্ন","ne":"कर्म चिन्ह"}],["よみます",{"en":"read","bn":"পড়ি","ne":"पढ्छु"}]]}],"drill":[{"q":{"en":"テレビ__ みます。 (I watch TV.)","bn":"テレビ__ みます。 (আমি টিভি দেখি।)","ne":"テレビ__ みます。 (म टिभी हेर्छु।)"},"o":["を","で","に","が"],"a":0,"e":{"en":"テレビ is the thing being watched, so it takes を.","bn":"テレビ দেখা হচ্ছে, তাই এটি を নেয়।","ne":"テレビ हेरिने कुरा हो, त्यसैले を आउँछ।"}},{"q":{"en":"Which sentence is correct for “I eat bread”?","bn":"“আমি রুটি খাই” বলতে কোন বাক্য ঠিক?","ne":"“म रोटी खान्छु” भन्न कुन वाक्य सही हो?"},"o":["パンを たべます。","パンで たべます。","パンの たべます。","パンと たべます。"],"a":0,"e":{"en":"を marks what you eat.","bn":"を বলে আপনি কী খান।","ne":"を ले के खाइन्छ भन्ने जनाउँछ।"}}]},"7":{"why":{"en":"で marks the place where an action happens: がっこうで べんきょうします. It can also mark the tool or means: ペンで かきます (write with a pen). The verb is an action verb, not いきます or あります.","bn":"で কাজ ঘটার স্থান বোঝায়: がっこうで べんきょうします। এটি উপায় বা যন্ত্রও বোঝায়: ペンで かきます (কলম দিয়ে লিখি)। ক্রিয়া হবে কাজের ক্রিয়া, いきます বা あります নয়।","ne":"で ले काम हुने ठाउँ जनाउँछ: がっこうで べんきょうします। यसले साधन वा माध्यम पनि जनाउँछ: ペンで かきます (कलमले लेख्छु)। क्रिया कामको हुनुपर्छ, いきます वा あります होइन।"},"form":[{"en":"Place + で + (object を) + verb.","bn":"স্থান + で + (কর্ম を) + ক্রিয়া।","ne":"ठाउँ + で + (कर्म を) + क्रिया।"},{"en":"Means: tool + で + verb.","bn":"উপায়: যন্ত্র + で + ক্রিয়া।","ne":"साधन: औजार + で + क्रिया।"}],"use":[{"en":"Where you study, work, eat, shop.","bn":"কোথায় পড়ি, কাজ করি, খাই, কেনাকাটা করি।","ne":"कहाँ पढ्ने, काम गर्ने, खाने, किनमेल गर्ने।"},{"en":"How you do it: by bus (バスで), with chopsticks (はしで).","bn":"কীভাবে করি: বাসে (バスで), চপস্টিক দিয়ে (はしで)।","ne":"कसरी गर्ने: बसबाट (バスで), चपस्टिकले (はしで)।"}],"cmp":{"en":"で vs に: で is where an action takes place. に is where something exists (あります / います) or where you arrive.","bn":"で বনাম に: で হলো যেখানে কাজ ঘটে। に হলো যেখানে কিছু থাকে (あります / います) বা যেখানে পৌঁছান।","ne":"で बनाम に: で काम हुने ठाउँ हो। に कुनै कुरा रहेको (あります / います) वा पुगिने ठाउँ हो।"},"more":[{"ja":"としょかんで べんきょうします。","r":"Toshokan de benkyou shimasu.","t":{"en":"I study at the library.","bn":"আমি লাইব্রেরিতে পড়াশোনা করি।","ne":"म पुस्तकालयमा पढ्छु।"},"p":[["としょかん",{"en":"library","bn":"লাইব্রেরি","ne":"पुस्तकालय"}],["で",{"en":"at (action place)","bn":"-তে (কাজের স্থান)","ne":"मा (काम हुने ठाउँ)"}],["べんきょうします",{"en":"study","bn":"পড়াশোনা করি","ne":"पढ्छु"}]]},{"ja":"レストランで ひるごはんを たべます。","r":"Resutoran de hirugohan o tabemasu.","t":{"en":"I eat lunch at a restaurant.","bn":"আমি রেস্তোরাঁয় দুপুরের খাবার খাই।","ne":"म रेस्टुरेन्टमा दिउँसोको खाना खान्छु।"},"p":[["レストラン",{"en":"restaurant","bn":"রেস্তোরাঁ","ne":"रेस्टुरेन्ट"}],["で",{"en":"at (action place)","bn":"-তে (কাজের স্থান)","ne":"मा (काम हुने ठाउँ)"}],["ひるごはん",{"en":"lunch","bn":"দুপুরের খাবার","ne":"दिउँसोको खाना"}],["を",{"en":"object marker","bn":"কর্ম চিহ্ন","ne":"कर्म चिन्ह"}],["たべます",{"en":"eat","bn":"খাই","ne":"खान्छु"}]]}],"drill":[{"q":{"en":"デパート__ かいものを します。 (I shop at a department store.)","bn":"デパート__ かいものを します。 (আমি ডিপার্টমেন্ট স্টোরে কেনাকাটা করি।)","ne":"デパート__ かいものを します。 (म डिपार्टमेन्ट स्टोरमा किनमेल गर्छु।)"},"o":["で","に","を","の"],"a":0,"e":{"en":"Shopping is an action, so the place takes で.","bn":"কেনাকাটা একটি কাজ, তাই স্থানে で বসে।","ne":"किनमेल एउटा काम हो, त्यसैले ठाउँमा で आउँछ।"}},{"q":{"en":"Which means “I watch TV at home”?","bn":"কোনটির অর্থ “আমি বাড়িতে টিভি দেখি”?","ne":"कुनको अर्थ “म घरमा टिभी हेर्छु” हो?"},"o":["うちで テレビを みます。","うちに テレビを みます。","うちを テレビで みます。","うちが テレビを みます。"],"a":0,"e":{"en":"うちで = at home (where the action happens).","bn":"うちで = বাড়িতে (যেখানে কাজ ঘটে)।","ne":"うちで = घरमा (जहाँ काम हुन्छ)।"}}]},"8":{"why":{"en":"に marks an exact point in time: a clock time, a day of the week or a date. Words like きょう (today), あした (tomorrow), きのう (yesterday), まいにち (every day) and いま (now) do not take に.","bn":"に একটি নির্দিষ্ট সময়বিন্দু বোঝায়: ঘড়ির সময়, সপ্তাহের দিন বা তারিখ। きょう (আজ), あした (আগামীকাল), きのう (গতকাল), まいにち (প্রতিদিন), いま (এখন)-এর সঙ্গে に বসে না।","ne":"に ले निश्चित समय-बिन्दु जनाउँछ: घडीको समय, हप्ताको दिन वा मिति। きょう (आज), あした (भोलि), きのう (हिजो), まいにち (हरेक दिन), いま (अहिले) सँग に आउँदैन।"},"form":[{"en":"Time + に + verb: ７じに おきます。","bn":"সময় + に + ক্রিয়া: ７じに おきます।","ne":"समय + に + क्रिया: ７じに おきます।"},{"en":"No に with relative time words such as あした.","bn":"あした-এর মতো আপেক্ষিক সময়ের শব্দে に নয়।","ne":"あした जस्ता सापेक्ष समयका शब्दमा に हुँदैन।"}],"use":[{"en":"Daily schedules: wake up, eat, leave, sleep.","bn":"দৈনন্দিন সময়সূচি: ওঠা, খাওয়া, বের হওয়া, ঘুমানো।","ne":"दैनिक तालिका: उठ्ने, खाने, निस्कने, सुत्ने।"},{"en":"Days and dates: にちようびに, ３がつ５にちに.","bn":"দিন ও তারিখ: にちようびに, ３がつ５にちに।","ne":"दिन र मिति: にちようびに, ３がつ５にちに।"}],"cmp":{"en":"に vs から: に marks one point in time. から marks the start of a range (９じから = from 9 o’clock).","bn":"に বনাম から: に একটি সময়বিন্দু বোঝায়। から একটি সময়সীমার শুরু বোঝায় (９じから = ৯টা থেকে)।","ne":"に बनाम から: に ले एउटा समय-बिन्दु जनाउँछ। から ले अवधिको सुरु जनाउँछ (９じから = ९ बजेदेखि)।"},"more":[{"ja":"にちようびに えいがを みます。","r":"Nichiyoubi ni eiga o mimasu.","t":{"en":"I watch a movie on Sunday.","bn":"আমি রবিবার সিনেমা দেখি।","ne":"म आइतबार चलचित्र हेर्छु।"},"p":[["にちようび",{"en":"Sunday","bn":"রবিবার","ne":"आइतबार"}],["に",{"en":"at (time)","bn":"-তে (সময়)","ne":"मा (समय)"}],["えいが",{"en":"movie","bn":"সিনেমা","ne":"चलचित्र"}],["を",{"en":"object marker","bn":"কর্ম চিহ্ন","ne":"कर्म चिन्ह"}],["みます",{"en":"watch","bn":"দেখি","ne":"हेर्छु"}]]},{"ja":"６じはんに あさごはんを たべます。","r":"Rokuji han ni asagohan o tabemasu.","t":{"en":"I eat breakfast at 6:30.","bn":"আমি সাড়ে ছয়টায় সকালের নাস্তা খাই।","ne":"म साढे छ बजे बिहानको खाना खान्छु।"},"p":[["６じはん",{"en":"6:30","bn":"সাড়ে ছয়টা","ne":"साढे छ बजे"}],["に",{"en":"at (time)","bn":"-তে (সময়)","ne":"मा (समय)"}],["あさごはん",{"en":"breakfast","bn":"সকালের নাস্তা","ne":"बिहानको खाना"}],["を",{"en":"object marker","bn":"কর্ম চিহ্ন","ne":"कर्म चिन्ह"}],["たべます",{"en":"eat","bn":"খাই","ne":"खान्छु"}]]}],"drill":[{"q":{"en":"あした __ がっこうへ いきます。 (Which particle goes here?)","bn":"あした __ がっこうへ いきます。 (এখানে কোন পার্টিকেল বসবে?)","ne":"あした __ がっこうへ いきます。 (यहाँ कुन कण (particle) आउँछ?)"},"o":["なし","に","で","を"],"a":0,"e":{"en":"あした is a relative time word, so no に.","bn":"あした আপেক্ষিক সময়ের শব্দ, তাই に নেই।","ne":"あした सापेक्ष समयको शब्द हो, त्यसैले に हुँदैन।"}},{"q":{"en":"８じ__ おきます。 (I get up at 8.)","bn":"８じ__ おきます。 (আমি ৮টায় উঠি।)","ne":"８じ__ おきます。 (म ८ बजे उठ्छु।)"},"o":["に","を","で","の"],"a":0,"e":{"en":"A clock time takes に.","bn":"ঘড়ির সময়ে に বসে।","ne":"घडीको समयमा に आउँछ।"}}]},"9":{"why":{"en":"へ marks the direction or destination of movement verbs such as いきます (go), きます (come) and かえります (return). It is written “he” but pronounced “e”. に can replace へ in these sentences with almost the same meaning.","bn":"へ গমনের ক্রিয়া যেমন いきます (যাই), きます (আসি), かえります (ফিরি)-এর দিক বা গন্তব্য বোঝায়। লেখা হয় “he”, উচ্চারণ “এ”। এই বাক্যে へ-এর জায়গায় に বসালে অর্থ প্রায় একই থাকে।","ne":"へ ले いきます (जान्छु), きます (आउँछु), かえります (फर्कन्छु) जस्ता चल्ने क्रियाको दिशा वा गन्तव्य जनाउँछ। “he” लेखिन्छ तर “ए” उच्चारण हुन्छ। यस्ता वाक्यमा へ को ठाउँमा に राख्दा अर्थ लगभग उही रहन्छ।"},"form":[{"en":"Place + へ + いきます / きます / かえります.","bn":"স্থান + へ + いきます / きます / かえります।","ne":"ठाउँ + へ + いきます / きます / かえります।"},{"en":"Ask “where to?” with どこへ いきますか。","bn":"“কোথায়?” জানতে どこへ いきますか।","ne":"“कहाँ?” सोध्न どこへ いきますか。"}],"use":[{"en":"Saying where you go, come or return to.","bn":"কোথায় যাই, আসি বা ফিরি তা বলতে।","ne":"कहाँ जाने, आउने वा फर्कने भन्न।"},{"en":"Talking about trips and daily movement.","bn":"ভ্রমণ ও দৈনন্দিন চলাচলের কথা বলতে।","ne":"यात्रा र दैनिक आवतजावतको कुरा गर्न।"}],"cmp":{"en":"へ vs で: へ is movement toward a place. で is where an action happens. がっこうへ いきます (go to school) but がっこうで べんきょうします (study at school).","bn":"へ বনাম で: へ কোনো স্থানের দিকে চলাচল। で হলো যেখানে কাজ ঘটে। がっこうへ いきます (স্কুলে যাই) কিন্তু がっこうで べんきょうします (স্কুলে পড়ি)।","ne":"へ बनाम で: へ कुनै ठाउँतर्फको गति हो। で काम हुने ठाउँ हो। がっこうへ いきます (विद्यालय जान्छु) तर がっこうで べんきょうします (विद्यालयमा पढ्छु)।"},"more":[{"ja":"うちへ かえります。","r":"Uchi e kaerimasu.","t":{"en":"I go home.","bn":"আমি বাড়ি ফিরি।","ne":"म घर फर्कन्छु।"},"p":[["うち",{"en":"home","bn":"বাড়ি","ne":"घर"}],["へ",{"en":"toward (read “e”)","bn":"-র দিকে (উচ্চারণ “এ”)","ne":"तर्फ (उच्चारण “ए”)"}],["かえります",{"en":"return","bn":"ফিরি","ne":"फर्कन्छु"}]]},{"ja":"らいねん にほんへ いきます。","r":"Rainen Nihon e ikimasu.","t":{"en":"I will go to Japan next year.","bn":"আমি আগামী বছর জাপানে যাব।","ne":"म आउँदो वर्ष जापान जान्छु।"},"p":[["らいねん",{"en":"next year","bn":"আগামী বছর","ne":"आउँदो वर्ष"}],["にほん",{"en":"Japan","bn":"জাপান","ne":"जापान"}],["へ",{"en":"toward (read “e”)","bn":"-র দিকে (উচ্চারণ “এ”)","ne":"तर्फ (उच्चारण “ए”)"}],["いきます",{"en":"go","bn":"যাই","ne":"जान्छु"}]]}],"drill":[{"q":{"en":"にほん__ きました。 (I came to Japan.)","bn":"にほん__ きました。 (আমি জাপানে এসেছি।)","ne":"にほん__ きました。 (म जापान आएँ।)"},"o":["へ","で","を","が"],"a":0,"e":{"en":"へ marks the destination of きます.","bn":"きます-এর গন্তব্য বোঝাতে へ।","ne":"きます को गन्तव्य जनाउन へ।"}},{"q":{"en":"In this sentence the particle へ is pronounced:","bn":"এই বাক্যে পার্টিকেল へ উচ্চারণ হয়:","ne":"यो वाक्यमा कण へ उच्चारण हुन्छ:"},"o":["he","e","ha","wa"],"a":1,"e":{"en":"As a particle, へ is read “e”.","bn":"পার্টিকেল হিসেবে へ পড়া হয় “এ”।","ne":"कण (particle) का रूपमा へ “ए” पढिन्छ।"}}]},"10":{"why":{"en":"と has two jobs. It joins nouns in a complete list (A と B = A and B), and it marks a companion (ともだちと = with a friend). It can join only nouns, never sentences or adjectives.","bn":"と-এর দুটি কাজ। এটি পূর্ণ তালিকায় বিশেষ্য যোগ করে (A と B = A এবং B) এবং সঙ্গী বোঝায় (ともだちと = বন্ধুর সঙ্গে)। এটি শুধু বিশেষ্য যোগ করে, বাক্য বা বিশেষণ নয়।","ne":"と का दुई काम छन्। यसले पूर्ण सूचीमा नाम जोड्छ (A と B = A र B) र साथी जनाउँछ (ともだちと = साथीसँग)। यसले नाम मात्र जोड्छ, वाक्य वा विशेषण होइन।"},"form":[{"en":"List: Noun と Noun (を verb).","bn":"তালিকা: বিশেষ্য と বিশেষ্য (を ক্রিয়া)।","ne":"सूची: नाम と नाम (を क्रिया)।"},{"en":"Companion: Person と verb.","bn":"সঙ্গী: ব্যক্তি と ক্রিয়া।","ne":"साथी: व्यक्ति と क्रिया।"}],"use":[{"en":"Naming two things: パンと たまご (bread and eggs).","bn":"দুটি জিনিস বলতে: パンと たまご (রুটি ও ডিম)।","ne":"दुई चिज भन्न: パンと たまご (रोटी र अण्डा)।"},{"en":"Doing something together: ははと いきます。","bn":"একসঙ্গে কিছু করতে: ははと いきます।","ne":"सँगै केही गर्न: ははと いきます।"}],"cmp":{"en":"と vs か: と means “and” (both). か means “or” (one of them). と vs も: も means “also” and joins two statements.","bn":"と বনাম か: と মানে “এবং” (দুটোই)। か মানে “অথবা” (একটি)। と বনাম も: も মানে “ও” এবং দুটি বাক্য জোড়ে।","ne":"と बनाम か: と को अर्थ “र” (दुवै)। か को अर्थ “वा” (एउटा)। と बनाम も: も को अर्थ “पनि” र यसले दुई वाक्य जोड्छ।"},"more":[{"ja":"パンと たまごを たべます。","r":"Pan to tamago o tabemasu.","t":{"en":"I eat bread and eggs.","bn":"আমি রুটি ও ডিম খাই।","ne":"म रोटी र अण्डा खान्छु।"},"p":[["パン",{"en":"bread","bn":"রুটি","ne":"रोटी"}],["と",{"en":"and","bn":"এবং","ne":"र"}],["たまご",{"en":"egg","bn":"ডিম","ne":"अण्डा"}],["を",{"en":"object marker","bn":"কর্ম চিহ্ন","ne":"कर्म चिन्ह"}],["たべます",{"en":"eat","bn":"খাই","ne":"खान्छु"}]]},{"ja":"ははと デパートへ いきます。","r":"Haha to depaato e ikimasu.","t":{"en":"I go to the department store with my mother.","bn":"আমি মায়ের সঙ্গে ডিপার্টমেন্ট স্টোরে যাই।","ne":"म आमासँग डिपार्टमेन्ट स्टोर जान्छु।"},"p":[["はは",{"en":"my mother","bn":"আমার মা","ne":"मेरी आमा"}],["と",{"en":"with","bn":"সঙ্গে","ne":"सँग"}],["デパート",{"en":"department store","bn":"ডিপার্টমেন্ট স্টোর","ne":"डिपार्टमेन्ट स्टोर"}],["へ",{"en":"toward","bn":"-র দিকে","ne":"तर्फ"}],["いきます",{"en":"go","bn":"যাই","ne":"जान्छु"}]]}],"drill":[{"q":{"en":"ともだち__ えいがを みます。 (with a friend)","bn":"ともだち__ えいがを みます。 (বন্ধুর সঙ্গে)","ne":"ともだち__ えいがを みます。 (साथीसँग)"},"o":["と","を","で","が"],"a":0,"e":{"en":"と marks a companion.","bn":"と সঙ্গী বোঝায়।","ne":"と ले साथी जनाउँछ।"}},{"q":{"en":"りんご__ みかんを かいます。 (apples and mandarins)","bn":"りんご__ みかんを かいます。 (আপেল ও কমলা)","ne":"りんご__ みかんを かいます。 (स्याउ र सुन्तला)"},"o":["と","も","で","に"],"a":0,"e":{"en":"と joins two nouns in a list.","bn":"と তালিকায় দুটি বিশেষ্য যোগ করে।","ne":"と ले सूचीमा दुई नाम जोड्छ।"}}]},"11":{"why":{"en":"から marks the starting point (time or place) and まで marks the end or limit. They are often used together: ９じから ５じまで = from 9 to 5. Each can also be used alone.","bn":"から শুরুর বিন্দু (সময় বা স্থান) এবং まで শেষ বা সীমা বোঝায়। প্রায়ই একসঙ্গে ব্যবহার হয়: ９じから ５じまで = ৯টা থেকে ৫টা। আলাদাভাবেও ব্যবহার করা যায়।","ne":"から सुरुको बिन्दु (समय वा ठाउँ) र まで अन्त्य वा सीमा जनाउँछ। प्रायः सँगै प्रयोग हुन्छन्: ９じから ５じまで = ९ बजेदेखि ५ बजेसम्म। एक्लै पनि प्रयोग गर्न सकिन्छ।"},"form":[{"en":"Start + から + End + まで + verb / です.","bn":"শুরু + から + শেষ + まで + ক্রিয়া / です।","ne":"सुरु + から + अन्त्य + まで + क्रिया / です।"},{"en":"Keep the order: から first, まで second.","bn":"ক্রম ঠিক রাখুন: আগে から, পরে まで।","ne":"क्रम नबिगार्नुहोस्: पहिले から, पछि まで।"}],"use":[{"en":"Work, school and shop hours.","bn":"কাজ, স্কুল ও দোকানের সময়সূচি।","ne":"काम, विद्यालय र पसलको समय।"},{"en":"Distance: うちから えきまで あるきます。","bn":"দূরত্ব: うちから えきまで あるきます।","ne":"दूरी: うちから えきまで あるきます।"}],"cmp":{"en":"に vs から/まで: に marks one point in time (３じに). から/まで marks a range (１じから ３じまで).","bn":"に বনাম から/まで: に একটি সময়বিন্দু বোঝায় (３じに)। から/まで একটি সময়সীমা বোঝায় (１じから ３じまで)।","ne":"に बनाम から/まで: に ले एउटा समय-बिन्दु जनाउँछ (３じに)। から/まで ले अवधि जनाउँछ (１じから ３じまで)।"},"more":[{"ja":"げつようびから きんようびまで しごとです。","r":"Getsuyoubi kara kinyoubi made shigoto desu.","t":{"en":"I work from Monday to Friday.","bn":"আমি সোমবার থেকে শুক্রবার পর্যন্ত কাজ করি।","ne":"म सोमबारदेखि शुक्रबारसम्म काम गर्छु।"},"p":[["げつようび",{"en":"Monday","bn":"সোমবার","ne":"सोमबार"}],["から",{"en":"from","bn":"থেকে","ne":"देखि"}],["きんようび",{"en":"Friday","bn":"শুক্রবার","ne":"शुक्रबार"}],["まで",{"en":"until","bn":"পর্যন্ত","ne":"सम्म"}],["しごと",{"en":"work","bn":"কাজ","ne":"काम"}],["です",{"en":"is","bn":"হয়","ne":"हो"}]]},{"ja":"うちから がっこうまで あるきます。","r":"Uchi kara gakkou made arukimasu.","t":{"en":"I walk from home to school.","bn":"আমি বাড়ি থেকে স্কুল পর্যন্ত হেঁটে যাই।","ne":"म घरबाट विद्यालयसम्म हिँड्छु।"},"p":[["うち",{"en":"home","bn":"বাড়ি","ne":"घर"}],["から",{"en":"from","bn":"থেকে","ne":"बाट"}],["がっこう",{"en":"school","bn":"স্কুল","ne":"विद्यालय"}],["まで",{"en":"as far as","bn":"পর্যন্ত","ne":"सम्म"}],["あるきます",{"en":"walk","bn":"হাঁটি","ne":"हिँड्छु"}]]}],"drill":[{"q":{"en":"１じ__ ３じまで ひるやすみです。 (from 1 to 3)","bn":"１じ__ ３じまで ひるやすみです。 (১টা থেকে ৩টা)","ne":"１じ__ ３じまで ひるやすみです。 (१ बजेदेखि ३ बजेसम्म)"},"o":["から","まで","に","を"],"a":0,"e":{"en":"から marks the start.","bn":"から শুরু বোঝায়।","ne":"から सुरु जनाउँछ।"}},{"q":{"en":"Which particle marks the END point?","bn":"কোন পার্টিকেল শেষ বিন্দু বোঝায়?","ne":"कुन कणले अन्त्य बिन्दु जनाउँछ?"},"o":["から","まで","と","へ"],"a":1,"e":{"en":"まで = until / up to.","bn":"まで = পর্যন্ত।","ne":"まで = सम्म।"}}]},"12":{"why":{"en":"い-adjectives end in い (おおきい, あたらしい, おいしい). Polite present: adjective + です. Negative: drop い and add くないです. Past: drop い and add かったです. Before a noun, use the adjective directly: おおきい いえ.","bn":"い-বিশেষণ い-তে শেষ হয় (おおきい, あたらしい, おいしい)। ভদ্র বর্তমান: বিশেষণ + です। নেতিবাচক: い বাদ দিয়ে くないです। অতীত: い বাদ দিয়ে かったです। বিশেষ্যের আগে সরাসরি বসে: おおきい いえ।","ne":"い-विशेषण い मा टुंगिन्छ (おおきい, あたらしい, おいしい)। शिष्ट वर्तमान: विशेषण + です। नकारात्मक: い हटाएर くないです। भूत: い हटाएर かったです। नामअगाडि सिधै आउँछ: おおきい いえ।"},"form":[{"en":"Present: おいしいです  ·  Negative: おいしくないです。","bn":"বর্তমান: おいしいです  ·  নেতিবাচক: おいしくないです।","ne":"वर्तमान: おいしいです  ·  नकारात्मक: おいしくないです।"},{"en":"Past: おいしかったです  ·  Past negative: おいしくなかったです。","bn":"অতীত: おいしかったです  ·  অতীত নেতিবাচক: おいしくなかったです।","ne":"भूत: おいしかったです  ·  भूत नकारात्मक: おいしくなかったです。"}],"use":[{"en":"Describing size, price, taste, temperature, feelings.","bn":"আকার, দাম, স্বাদ, তাপমাত্রা, অনুভূতি বর্ণনা করতে।","ne":"आकार, मूल्य, स्वाद, तापक्रम, भावना वर्णन गर्न।"},{"en":"Special case: いい (good) becomes よくないです / よかったです.","bn":"বিশেষ ক্ষেত্র: いい (ভালো) হয় よくないです / よかったです।","ne":"विशेष अवस्था: いい (राम्रो) बन्छ よくないです / よかったです।"}],"cmp":{"en":"い-adj vs な-adj: い-adjectives go straight before a noun (あたらしい くるま). な-adjectives need な (しずかな まち). きれい and ゆうめい end in い but are な-adjectives.","bn":"い-বিশেষণ বনাম な-বিশেষণ: い-বিশেষণ সরাসরি বিশেষ্যের আগে বসে (あたらしい くるま)। な-বিশেষণে な লাগে (しずかな まち)। きれい ও ゆうめい い-তে শেষ হলেও な-বিশেষণ।","ne":"い-विशेषण बनाम な-विशेषण: い-विशेषण सिधै नामअगाडि आउँछ (あたらしい くるま)। な-विशेषणलाई な चाहिन्छ (しずかな まち)। きれい र ゆうめい い मा टुंगिए पनि な-विशेषण हुन्।"},"more":[{"ja":"この ケーキは おいしいです。","r":"Kono keeki wa oishii desu.","t":{"en":"This cake is delicious.","bn":"এই কেকটি সুস্বাদু।","ne":"यो केक मिठो छ।"},"p":[["この",{"en":"this (+ noun)","bn":"এই","ne":"यो (+ नाम)"}],["ケーキ",{"en":"cake","bn":"কেক","ne":"केक"}],["は",{"en":"topic marker","bn":"টপিক চিহ্ন","ne":"विषय चिन्ह"}],["おいしい",{"en":"delicious","bn":"সুস্বাদু","ne":"मिठो"}],["です",{"en":"is","bn":"হয়","ne":"हो"}]]},{"ja":"きのうは さむくなかったです。","r":"Kinou wa samukunakatta desu.","t":{"en":"Yesterday was not cold.","bn":"গতকাল ঠান্ডা ছিল না।","ne":"हिजो चिसो थिएन।"},"p":[["きのう",{"en":"yesterday","bn":"গতকাল","ne":"हिजो"}],["は",{"en":"topic marker","bn":"টপিক চিহ্ন","ne":"विषय चिन्ह"}],["さむくなかった",{"en":"was not cold","bn":"ঠান্ডা ছিল না","ne":"चिसो थिएन"}],["です",{"en":" ा (ています, てもいいです, てはいけません) को आधार हो।"},"form":[{"en":"Group 1: う/つ/る → って, む/ぶ/ぬ → んで, く → いて, ぐ → いで, す → して.","bn":"গোষ্ঠী ১: う/つ/る → って, む/ぶ/ぬ → んで, く → いて, ぐ → いで, す → して।","ne":"समूह १: う/つ/る → って, む/ぶ/ぬ → んで, く → いて, ぐ → いで, す → して।"},{"en":"Group 2: drop る and add て (たべる → たべて). Irregular: する → して, くる → きて.","bn":"গোষ্ঠী ২: る বাদ দিয়ে て (たべる → たべて)। অনিয়মিত: する → して, くる → きて।","ne":"समूह २: る हटाएर て (たべる → たべて)। अनियमित: する → して, くる → きて।"}],"use":[{"en":"Asking someone politely to do something.","bn":"কাউকে ভদ্রভাবে কিছু করতে বলতে।","ne":"कसैलाई शिष्ट रूपमा केही गर्न भन्न।"},{"en":"Giving simple instructions at class, work or shops.","bn":"ক্লাস, কাজ বা দোকানে সহজ নির্দেশ দিতে।","ne":"कक्षा, काम वा पसलमा सजिलो निर्देशन दिन।"}],"cmp":{"en":"N を ください means “Please give me N” (みずを ください). V-て ください means “Please do V”. Do not use the ます-form: たべますください is wrong.","bn":"N を ください মানে “আমাকে N দিন” (みずを ください)। V-て ください মানে “V করুন”। ます-রূপ ব্যবহার করবেন না: たべますください ভুল।","ne":"N を ください को अर्थ “मलाई N दिनुहोस्” (みずを ください)। V-て ください को अर्थ “V गर्नुहोस्”। ます-रूप नलगाउनुहोस्: たべますください गलत।"},"more":[{"ja":"ゆっくり はなして ください。","r":"Yukkuri hanashite kudasai.","t":{"en":"Please speak slowly.","bn":"দয়া করে ধীরে বলুন।","ne":"कृपया बिस्तारै बोल्नुहोस्।"},"p":[["ゆっくり",{"en":"slowly","bn":"ধীরে","ne":"बिस्तारै"}],["はなして",{"en":"speak (て-form)","bn":"বলুন (て-রূপ)","ne":"बोल्नु (て-रूप)"}],["ください",{"en":"please","bn":"দয়া করে","ne":"कृपया"}]]},{"ja":"ここに なまえを かいて ください。","r":"Koko ni namae o kaite kudasai.","t":{"en":"Please write your name here.","bn":"দয়া করে এখানে আপনার নাম লিখুন।","ne":"कृपया यहाँ आफ्नो नाम लेख्नुहोस्।"},"p":[["ここ",{"en":"here","bn":"এখানে","ne":"यहाँ"}],["に",{"en":"at / on","bn":"-তে","ne":"मा"}],["なまえ",{"en":"name","bn":"নাম","ne":"नाम"}],["を",{"en":"object marker","bn":"কর্ম চিহ্ন","ne":"कर्म चिन्ह"}],["かいて",{"en":"write (て-form)","bn":"লিখুন (て-রূপ)","ne":"लेख्नु (て-रूप)"}],["ください",{"en":"please","bn":"দয়া করে","ne":"कृपया"}]]}],"drill":[{"q":{"e  → いかないで ください।","ne":"いく → いかない → いかないで ください।"}},{"q":{"en":"たべる → たべ__ ください。 (Please don’t eat.)","bn":"たべる → たべ__ ください。 (দয়া করে খাবেন না।)","ne":"たべる → たべ__ ください。 (कृपया नखानुहोस्।)"},"o":["ないで","なくて","ないに","ません"],"a":0,"e":{"en":"Group 2: たべる → たべない → たべないで.","bn":"গোষ্ঠী ২: たべる → たべない → たべないで।","ne":"समूह २: たべる → たべない → たべないで।"}}]},"19":{"why":{"en":"V-た ことが あります says you have had that experience at least once in your life. Use the plain past (た-form) of the verb, then ことが あります. For never: ことが ありません.","bn":"V-た ことが あります মানে জীবনে অন্তত একবার সেই অভিজ্ঞতা হয়েছে। ক্রিয়ার সাধারণ অতীত (た-রূপ) + ことが あります। কখনো না হলে: ことが ありません।","ne":"V-た ことが あります को अर्थ जीवनमा कम्तीमा एक पटक त्यो अनुभव भएको छ। क्रियाको सादा भूत (た-रूप) + ことが あります। कहिल्यै नगरेको भए: ことが ありません।"},"form":[{"en":"Make the た-form: て → た, で → だ (かって → かった, のんで → のんだ).","bn":"た-রূপ বানান: て → た, で → だ (かって → かった, のんで → のんだ)।","ne":"た-रूप बनाउनुहोस्: て → た, で → だ (かって → かった, のんで → のんだ)।"},{"en":"Then add ことが あります / ありません.","bn":"তারপর ことが あります / ありません।","ne":"त्यसपछि ことが あります / ありません।"}],"use":[{"en":"Life experiences: trips, food, activities.","bn":"জীবনের অভিজ্ঞতা: ভ্রমণ, খাবার, কাজ।","ne":"जीवनका अनुभव: यात्रा, खाना, गतिविधि।"},{"en":"Asking: ふじさんに のぼった ことが ありますか。","bn":"জিজ্ঞাসা: ふじさんに のぼった ことが ありますか।","ne":"सोध्न: ふじさんに のぼった ことが ありますか।"}],"cmp":{"en":"V-た ことが あります is a life experience (no exact time). V-ました is one specific past event (きのう, せんしゅう).","bn":"V-た ことが あります হলো জীবনের অভিজ্ঞতা (নির্দিষ্ট সময় নেই)। V-ました হলো নির্দিষ্ট অতীত ঘটনা (きのう, せんしゅう)।","ne":"V-た ことが あります जीवनको अनुभव हो (निश्चित समय छैन)। V-ました एउटा निश्चित भूत घटना हो (きのう, せんしゅう)।"},"more":[{"ja":"すしを たべた ことが あります。","r":"Sushi o tabeta koto ga arimasu.","t":{"en":"I have eaten sushi.","bn":"আমি সুশি খেয়েছি।","ne":"मैले सुशी खाएको छु।"},"p":[["すし",{"en":"sushi","bn":"সুশি","ne":"सुशी"}],["を",{"en":"object marker","bn":"কর্ম চিহ্ন","ne":"कर्म चिन्ह"}],["たべた",{"en":"ate (た-form)","bn":"খেয়েছি (た-রূপ)","ne":"खाएँ (た-रूप)"}],["  पैसा, समय।"},{"en":"“When it’s done…”: おわったら、でんわして ください。","bn":"“শেষ হলে…”: おわったら、でんわして ください।","ne":"“सकिएपछि…”: おわったら、でんわして ください।"}],"cmp":{"en":"たら (if / once it happens) vs ても (even if): あめが ふったら いきません (if it rains, I won’t go) vs あめが ふっても いきます (even if it rains, I’ll go).","bn":"たら (যদি / ঘটলে) বনাম ても (হলেও): あめが ふったら いきません (বৃষ্টি হলে যাব না) বনাম あめが ふっても いきます (বৃষ্টি হলেও যাব)।","ne":"たら (यदि / भएपछि) बनाम ても (भए पनि): あめが ふったら いきません (पानी परे जान्नँ) बनाम あめが ふっても いきます (पानी परे पनि जान्छु)।"},"more":[{"ja":"あめが ふったら、いきません。","r":"Ame ga futtara, ikimasen.","t":{"en":"If it rains, I won’t go.","bn":"বৃষ্টি হলে আমি যাব না।","ne":"पानी परे म जान्नँ।"},"p":[["あめ",{"en":"rain","bn":"বৃষ্টি","ne":"पानी"}],["が",{"en":"subject marker","bn":"কর্তা চিহ্ন","ne":"कर्ता चिन्ह"}],["ふったら",{"en":"if it falls","bn":"পড়লে","ne":"परे"}],["いきません",{"en":"won’t go","bn":"যাব না","ne":"जान्नँ"}]]},{"ja":"おかねが あったら、くるまを かいます。","r":"Okane ga attara, kuruma o kaimasu.","t":{"en":"If I have money, I will buy a car.","bn":"টাকা থাকলে আমি গাড়ি কিনব।","ne":"पैसा भए म गाडी किन्छु।"},"p":[["おかね",{"en":"money","bn":"টাকা","ne":"पैसा"}],["が",{"en":"subject marker","bn":"কর্তা চিহ্ন","ne":"कर्ता चिन्ह"}],["あったら",{"en":"if there is","bn":"থাকলে","ne":"भए"}],["くるま",{"en":"car","bn":"গাড়ি","ne":"गाडी"}],["を",{"en":"object marker","bn":"কর্ম চিহ্ন","ne":"कर्म चिन्ह"}],["かいます",{"en":"buy","bn":"কিনি","ne":"किन्छु"}]]}],"drill":[{"q":{"en":"のむ (drink) → のん__、ねます。 (If I drink, I sleep.)","bn":"のむ (drink) → のん__、ねます。 (আমি পান করলে ঘুমাই।)","ne":"のむ (drink) → のん__、ねます。 (म पिएमा सुत्छु।)"},"o":["だら","たら","って","だ"],"a":0,"e":{"en":"む → んだ, so the たら-form is のんだら.","bn":"む → んだ, তাই たら-রূপ のんだら।","ne":"む → んだ, त्यसैले たら-रूप のんだら।"}},{"q":{"en":"やすい (cheap): やす__、かいます。 (If it’s cheap, I’ll buy it.)","bn":"やすい (cheap): やす__、かいます。 (সস্তা হলে আমি কিনব।)","ne":"やすい (cheap): やす__、かいます。 (सस्तो भए म किन्छु।)"},"o":["かったら","いたら","だったら","くたら"],"a":0,"e":{"en":"い-adj: やすい → やすかったら.","bn":"い-বিশেষণ: やすい → やすかったら।","ne":"い-विशेषण: やすい → やすかったら।"}}]},"25":{"why":{"en":"あります and います both say that something exists. います is for living things that move (people, animals). あります is for everything else (things, plants, events). Pattern: Place に Thing が あります / います.","bn":"あります ও います দুটোই কিছুর অস্তিত্ব বোঝায়। います চলনক্ষম প্রাণী (মানুষ, পশু)-র জন্য। あります বাকি সবকিছুর জন্য (জিনিস, গাছ, অনুষ্ঠান)। ছক: স্থান に বস্তু が あります / います।","ne":"あります र います दुवैले कुनै कुराको अस्तित्व जनाउँछन्। います चल्ने जीव (मानिस, जनावर) का लागि हो। あります अरू सबै (वस्तु, बिरुवा, कार्यक्रम) का लागि। ढाँचा: ठाउँ に वस्तु が あります / います।"},"form":[{"en":"Place に + subject が + あります / います。","bn":"স্থান に + বিষয় が + あります / います।","ne":"ठाउँ に + विषय が + あります / います।"},{"en":"Negative: ありません / いません. Ask: なにが ありますか / だれが いますか。","bn":"নেতিবাচক: ありません / いません। জিজ্ঞাসা: なにが ありますか / だれが いますか।","ne":"नकारात्मक: ありません / いません। सोध्न: なにが ありますか / だれが いますか。"}],"use":[{"en":"Describing a room, a street or a city.","bn":"ঘর, রাস্তা বা শহরের বর্ণনা দিতে।","ne":"कोठा, सडक वा सहरको वर्णन गर्न।"},{"en":"Saying what you have around you: こうえんに ねこが います。","bn":"আশপাশে কী আছে বলতে: こうえんに ねこが います।","ne":"वरिपरि के छ भन्न: こうえんに ねこが います।"}],"cmp":{"en":"に vs で: に shows where something exists (あります / います). で shows where an action happens (べんきょうします). Compare: へやに ほんが あります / へやで ほんを よみます。","bn":"に বনাম で: に কিছু কোথায় আছে বোঝায় (あります / います)। で কাজ কোথায় ঘটে বোঝায় (べんきょうします)। তুলনা: へやに ほんが あります / へやで ほんを よみます।","ne":"に बनाम で: に कुनै कुरा कहाँ छ जनाउँछ (あります / います)। で काम कहाँ हुन्छ जनाउँछ (べんきょうします)। तुलना: へやに ほんが あります / へやで ほんを よみます।"},"more":[{"ja":"つくえの うえに ほんが あります。","r":"Tsukue no ue ni hon ga arimasu.","t":{"en":"There is a book on the desk.","bn":"ডেস্কের ওপর একটি বই আছে।","ne":"डेस्कमाथि एउटा किताब छ।"},"p":[["つくえ",{"en":"desk","bn":"ডেস্ক","ne":"डेस्क"}],["の",{"en":"of","bn":"-র","ne":"को"}],["うえ",{"en":"top / above","bn":"ওপর","ne":"माथि"}],["に",{"en":"at (existence)","bn":"-তে (অস্তিত্ব)","ne":"मा (अस्तित्व)"}],["ほん",{"en":"book","bn":"বই","ne":"किताब"}],["が",{"en":"subject marker","bn":"কর্তা চিহ্ন","ne":"कर्ता चिन्ह"}],["あります",{"en":"there is","bn":"আছে","ne":"छ"}]]},{"ja":"こうえんに ねこが います。","r":"Kouen ni neko ga imasu.","t":{"en":"There is a cat in the park.","bn":"পার্কে একটি বিড়াল আছে।","ne":"पार्कमा एउटा बिरालो छ।"},"p":[["こうえん",{"en":"park","bn":"পার্ক","ne":"पार्क"}],["に",{"en":"at (existence)","bn":"-তে (অস্তিত্ব)","ne":"मा (अस्तित्व)"}],["ねこ",{"en":"cat","bn":"বিড়াল","ne":"बिरालो"}],["が",{"en":"subject marker","bn":"কর্তা চিহ্ন","ne":"कर्ता चिन्ह"}],["います",{"en":"there is (living)","bn":"আছে (প্রাণী)","ne":"छ (जीव)"}]]}],"drill":[{"q":{"en":"こうえんに こどもが __。 (There are children in the park.)","bn":"こうえんに こどもが __。 (পার্কে শিশুরা আছে।)","ne":"こうえんに こどもが __。 (पार्कमा बालबालिका छन्।)"},"o":["います","あります","です","します"],"a":0,"e":{"en":"Children are living, so use います.","bn":"শিশুরা প্রাণী, তাই います।","ne":"बालबालिका जीव हुन्, त्यसैले います।"}},{"q":{"en":"つくえの うえに かばんが __。 (There is a bag on the desk.)","bn":"つくえの うえに かばんが __。 (ডেস্কের ওপর একটি ব্যাগ আছে।)","ne":"つくえの うえに かばんが __。 (डेस्कमाथि एउटा झोला छ।)"},"o":["あります","います","きます","です"],"a":0,"e":{"en":"A bag is not alive, so use あります.","bn":"ব্যাগ প্রাণী নয়, তাই あります।","ne":"झोला जीव होइन, त्यसैले あります।"}}]}};
  function tr3(en,bn,ne){return t({en,bn,ne});}
  function wbwExample(e){
    return `<div class="example"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="flex:1;min-width:0"><div class="ex-ja jp">${esc(e.ja)}</div><div class="ex-romaji">${esc(e.r)}</div></div>${speakBtn(e.ja)}</div><div class="ex-trans"><div><b>${state.lang==='bn'?'বাংলা':state.lang==='ne'?'नेपाली':'EN'}:</b> ${esc(t(e.t))}</div></div><div class="wbw" role="list">${e.p.map(([w,m])=>`<span class="wbw-chip" role="listitem"><b class="jp">${esc(w)}</b><small>${esc(t(m))}</small></span>`).join('')}</div></div>`;
  }
  function detailTop(id){
    const d=LESSON_DETAIL[id]; if(!d) return '';
    return `
      <div class="lesson-box"><div class="pill">${esc(tr3('Explained in detail','বিস্তারিত ব্যাখ্যা','विस्तृत व्याख्या'))}</div><p class="mt-sm ld-text">${esc(t(d.why))}</p></div>
      <div class="lesson-box"><div class="pill">${esc(tr3('How to build it','কীভাবে গঠন করবেন','कसरी बनाउने'))}</div><ol class="ld-steps">${d.form.map(x=>`<li>${esc(t(x))}</li>`).join('')}</ol></div>
      <div class="lesson-box"><div class="pill">${esc(tr3('When to use it','কখন ব্যবহার করবেন','कहिले प्रयोग गर्ने'))}</div><ul class="ld-list">${d.use.map(x=>`<li>${esc(t(x))}</li>`).join('')}</ul></div>`;
  }
  function detailMore(id){
    const d=LESSON_DETAIL[id]; if(!d) return '';
    return `<h3 class="mt">${esc(tr3('More examples · word by word','আরও উদাহরণ · শব্দে শব্দে','थप उदाहरण · शब्द-शब्द'))}</h3>${d.more.map(wbwExample).join('')}`;
  }
  function detailCompare(id){
    const d=LESSON_DETAIL[id]; if(!d) return '';
    return `<div class="lesson-box mt"><div class="pill">${esc(tr3('Compare with similar grammar','একই রকম ব্যাকরণের সঙ্গে তুলনা','मिल्दोजुल्दो व्याकरणसँग तुलना'))}</div><p class="mt-sm ld-text">${esc(t(d.cmp))}</p></div>`;
  }
  function detailDrills(id){
    const d=LESSON_DETAIL[id]; if(!d) return '';
    return `<h3 class="mt">${ICONS.pencil} ${esc(tr3('More practice','আরও অনুশীলন','थप अभ्यास'))}</h3><p class="small">${esc(tr3('Tap an answer to see the explanation.','উত্তরে ট্যাপ করে ব্যাখ্যা দেখুন।','उत्तरमा थिचेर व्याख्या हेर्नुहोस्।'))}</p>${d.drill.map((q,i)=>renderInlineQuiz(q,'ld-'+id+'-'+i)).join('')}`;
  }
  function renderLesson(id){
    const l=GRAMMAR.find(x=>x.id===id);
    if(!l) return `<div class="card center"><h2>Lesson not found</h2><p class="mt"><a href="#/lessons" class="btn btn-primary">${ICONS.arrowLeft} ${esc(tUi('back'))}</a></p></div>`;
    const isDone=state.lessonsCompleted.includes(id), isBm=state.lessonsBookmarked.includes(id);
    const prev=GRAMMAR.find(x=>x.id===id-1), next=GRAMMAR.find(x=>x.id===id+1);
    return `
    <div class="flex mb"><a href="#/lessons" class="btn btn-ghost">${ICONS.arrowLeft} ${esc(tUi('back'))}</a><span class="pill">${esc(tUi('lesson'))} ${l.id} ${esc(tUi('of'))} ${GRAMMAR.length}</span></div>
    <div class="card">
      <h1 class="jp" style="font-size:22px">${esc(l.title)}</h1>
      <p class="mt-sm" style="font-size:15px">${esc(t(l.meaning))}</p>
      <div class="lesson-box"><div class="pill">${esc(tUi('structure'))}</div><div class="jp mt-sm" style="font-size:16px">${esc(l.struct)}</div></div>
      <div class="lesson-box"><div class="pill">${esc(tUi('explanation'))}</div><p class="mt-sm" style="font-size:14px">${esc(t(l.expl))}</p></div>
      ${detailTop(l.id)}
      <h3 class="mt">${esc(tUi('example'))}</h3>
      ${l.ex.map(e=>exampleBlock(e)).join('')}
      ${l.neg?`<div class="pill mt">${state.lang==='bn'?'নেতিবাচক':state.lang==='ne'?'नकारात्मक':'Negative'}</div>${exampleBlock(l.neg)}`:''}
      ${l.q?`<div class="pill mt">${state.lang==='bn'?'প্রশ্ন':state.lang==='ne'?'प्रश्न':'Question'}</div>${exampleBlock(l.q)}`:''}
      ${detailMore(l.id)}
      <h3 class="mt">${ICONS.alert} ${esc(tUi('mistakes'))}</h3>
      <ul style="padding-left:20px;margin-top:6px">${l.mistakes.map(m=>`<li style="margin-bottom:4px;font-size:14px">${esc(t(m))}</li>`).join('')}</ul>
      ${detailCompare(l.id)}
      <div class="lesson-box mt"><div class="pill">${esc(tUi('memoryTrick'))}</div><p class="mt-sm" style="font-size:14px">${ICONS.lightbulb} ${esc(t(l.trick))}</p></div>
      <h3 class="mt">${ICONS.pencil} ${esc(tUi('quiz'))}</h3>
      ${renderInlineQuiz(l.quiz,'l-'+l.id)}
      ${detailDrills(l.id)}
    </div>
    <div class="flex-between mt">
      <div>${prev?`<a href="#/lessons/${prev.id}" class="btn btn-soft">${ICONS.arrowLeft} ${esc(tUi('prev'))}</a>`:''}</div>
      <div class="flex">
        <button class="btn btn-ghost" data-action="bookmark-lesson" data-id="${l.id}">${isBm?ICONS.bookmark:ICONS.paperclip} ${esc(tUi('bookmark'))}</button>
        <button class="btn ${isDone?'btn-soft':'btn-primary'}" data-action="toggle-lesson" data-id="${l.id}">${isDone?ICONS.check+' '+esc(tUi('completed')):esc(tUi('markComplete'))}</button>
      </div>
      <div>${next?`<a href="#/lessons/${next.id}" class="btn btn-soft">${esc(tUi('next'))} ${ICONS.arrowRight}</a>`:''}</div>
    </div>
  `;
  }
  function exampleBlock(e){return `<div class="example"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="flex:1;min-width:0"><div class="ex-ja jp">${esc(e.ja)}</div><div class="ex-romaji">${esc(e.r)}</div></div>${speakBtn(e.ja)}</div><div class="ex-trans"><div><b>${state.lang==='bn'?'বাংলা':state.lang==='ne'?'नेपाली':'EN'}:</b>${esc(t(e.t))}</div></div></div>`;}
  function renderInlineQuiz(q,key){return `<div class="mt-sm" data-quiz="${key}"><div class="jp" style="font-size:16px;margin-bottom:8px">${esc(t(q.q))}</div>${q.o.map((opt,i)=>`<button class="quiz-opt" data-action="quiz-answer" data-qi="${i}" data-correct="${q.a}" data-explain="${esc(t(q.e))}">${esc(opt)}</button>`).join('')}<div class="quiz-feedback small mt-sm" style="display:none"></div></div>`;}

  /* ============ PARTICLES ============ */
  function renderParticles(){return `
  <h1 class="stitle"><span>${esc(tUi('particles'))}</span><p>${PARTICLES.length} particles · JLPT N5</p></h1>
  <p class="small mb">${esc(tUi('audioHint'))}</p>
  <div class="grid grid-2">${PARTICLES.map(p=>`<a href="#/particles/${p.r}" class="card clickable"><div style="display:flex;align-items:center;gap:12px"><div class="jp" style="font-size:32px">${esc(p.s)}</div><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(p.r)}</div><div class="small">${esc(t(p.f))}</div></div><span style="color:var(--text-muted)">${ICONS.arrowRight}</span></div></a>`).join('')}</div>
  <h2 class="stitle mt"><span>${state.lang==='bn'?'পার্থক্য':state.lang==='ne'?'भिन्नता':'Comparisons'}</span></h2>
  <div class="card">
    <p style="font-size:14px"><b>は vs が:</b> は topic; が new info/subject.</p>
    <p style="font-size:14px;margin-top:6px"><b>に vs で:</b> に existence/time; で action location.</p>
    <p style="font-size:14px;margin-top:6px"><b>に vs へ:</b> both destination; へ emphasizes direction.</p>
    <p style="font-size:14px;margin-top:6px"><b>から vs まで:</b> から = from; まで = until.</p>
    <p style="font-size:14px;margin-top:6px"><b>と vs や:</b> と = complete list; や = partial.</p>
  </div>
`;}
  function renderParticle(id){
    const p = PARTICLES.find(x=>x.r===id) || PARTICLES.find(x=>x.s===id);
    if(!p) return `<div class="card center"><h2>Particle not found</h2><p class="mt"><a href="#/particles" class="btn btn-primary">${ICONS.arrowLeft} ${esc(tUi('back'))}</a></p></div>`;
    const breakdownHtml = (bd) => bd ? `
    <div class="lesson-box" style="background:var(--sage-50);border-left-color:var(--sage-200);margin-top:8px">
      <div class="small" style="font-weight:600;margin-bottom:6px">${state.lang==='bn'?'শব্দে শব্দে ব্যাখ্যা':state.lang==='ne'?'शब्द-शब्द व्याख्या':'Word-by-word breakdown'}</div>
      <div style="display:flex;flex-direction:column;gap:4px;font-size:13px">
        ${bd.map(b=>`<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
          <span class="jp" style="font-weight:600;min-width:80px">${esc(b.word)}</span>
          <span class="small">—</span>
          <span style="flex:1;min-width:120px">${esc(t(b.meaning))}</span>
        </div>`).join('')}
      </div>
    </div>` : '';
    const usesHtml = (p.uses||[]).map(u => `
    <div class="example" style="border-left:3px solid var(--sage-400)">
      <div class="pill mint" style="margin-bottom:6px">${esc(t(u.label))}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div class="ex-ja jp">${esc(u.example.ja)}</div>
          <div class="ex-romaji">${esc(u.example.romaji)}</div>
        </div>
        ${speakBtn(u.example.ja)}
      </div>
      <div class="ex-trans"><div>${esc(t(u.example.translation))}</div></div>
      ${breakdownHtml(u.example.breakdown)}
    </div>
  `).join('');
    const moreHtml = (p.moreExamples && p.moreExamples.length) ? `
    <h3 class="mt">${state.lang==='bn'?'আরও উদাহরণ':state.lang==='ne'?'अझै उदाहरणहरू':'More Examples'}</h3>
    ${p.moreExamples.map(e=>`<div class="example">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div class="ex-ja jp">${esc(e.ja)}</div>
          <div class="ex-romaji">${esc(e.romaji)}</div>
        </div>
        ${speakBtn(e.ja)}
      </div>
      <div class="ex-trans"><div>${esc(t(e.translation))}</div></div>
    </div>`).join('')}
  ` : '';
    const compHtml = p.comparison ? `
    <h3 class="mt">${state.lang==='bn'?'তুলনা':state.lang==='ne'?'तुलना':'Comparison'} — ${esc(t(p.comparison.title))}</h3>
    <div class="card" style="box-shadow:none">
      ${p.comparison.items.map(it=>`<div style="padding:10px 0;border-bottom:1px solid var(--border)">
        <div class="pill" style="margin-bottom:4px">${esc(it.label)}</div>
        <div class="jp" style="font-size:16px">${esc(it.example)}</div>
        <div class="small mt-sm">${esc(t(it.note))}</div>
      </div>`).join('')}
      ${p.comparison.footer ? `<p class="mt-sm" style="font-size:13px;color:var(--text-muted)">${esc(t(p.comparison.footer))}</p>` : ''}
    </div>
  ` : '';
    return `
    <div class="flex mb"><a href="#/particles" class="btn btn-ghost">${ICONS.arrowLeft} ${esc(tUi('back'))}</a></div>
    <div class="card">
      <div class="center">
        <div class="jp" style="font-size:72px;line-height:1">${esc(p.s)}</div>
        <div class="mt-sm">${speakBtn(p.s)}</div>
        <div class="text-muted">${esc(p.r)}</div>
      </div>
      <div class="lesson-box"><div class="pill">${esc(tUi('function'))}</div><p class="mt-sm" style="font-weight:600">${esc(t(p.f))}</p><p class="mt-sm" style="font-size:14px">${esc(t(p.mainDesc))}</p></div>
      <div class="lesson-box"><div class="pill">${esc(tUi('whenToUse'))}</div><p class="mt-sm" style="font-size:14px">${esc(t(p.use))}</p></div>
      ${(p.uses&&p.uses.length) ? `<h3 class="mt">${state.lang==='bn'?'ব্যবহার ও উদাহরণ':state.lang==='ne'?'प्रयोग र उदाहरणहरू':'Uses & Examples'}</h3>${usesHtml}` : ''}
      ${moreHtml}
      ${compHtml}
      <h3 class="mt">${esc(tUi('confusions'))}</h3>
      <div class="lesson-box"><p style="font-size:14px">${esc(t(p.confusions))}</p></div>
      <div class="lesson-box mt"><div class="pill">${esc(tUi('memoryTrick'))}</div><p class="mt-sm" style="font-size:14px">${ICONS.lightbulb} ${esc(t(p.trick))}</p></div>
      <h3 class="mt">${ICONS.pencil} ${esc(tUi('quiz'))}</h3>
      ${renderInlineQuiz(p.quiz, 'p-'+p.r)}
    </div>
  `;
  }

  /* ============ VOCABULARY ============ */
  let vocabFilter={q:'',cat:'',lesson:0};
  function renderVocab(){
    const cats=[...new Set(VOCAB.map(v=>v.cat))];
    const lessons=[...new Set(VOCAB.map(v=>v.lesson))].sort((a,b)=>a-b);
    const filtered=VOCAB.filter(v=>{
      if(vocabFilter.cat&&v.cat!==vocabFilter.cat)return false;
      if(vocabFilter.lesson&&v.lesson!==vocabFilter.lesson)return false;
      if(vocabFilter.q){const q=vocabFilter.q.toLowerCase();return v.ja.toLowerCase().includes(q)||v.romaji.toLowerCase().includes(q)||(v.kanji&&v.kanji.includes(q))||t(v.meaning).toLowerCase().includes(q);}
      return true;
    });
    return `
    <h1 class="stitle"><span>${esc(tUi('vocabulary'))}</span><p>${VOCAB.length} words · Minna no Nihongo N5</p></h1>
    <p class="small mb">${esc(tUi('audioHint'))}</p>
    <div style="margin-bottom:12px"><input class="input" id="vocabSearch" placeholder="${esc(tUi('search'))}" value="${esc(vocabFilter.q)}"></div>
    <div class="flex mb" style="overflow-x:auto;padding-bottom:4px">
      <button class="chip ${!vocabFilter.cat?'active':''}" data-action="vocab-cat" data-cat="">${state.lang==='bn'?'সব':state.lang==='ne'?'सबै':'All'}</button>
      ${cats.map(c=>`<button class="chip ${vocabFilter.cat===c?'active':''}" data-action="vocab-cat" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>
    <div class="flex mb" style="overflow-x:auto;padding-bottom:4px">
      <button class="chip ${!vocabFilter.lesson?'active':''}" data-action="vocab-lesson" data-lesson="0">${state.lang==='bn'?'সব পাঠ':state.lang==='ne'?'सबै पाठ':'All Lessons'}</button>
      ${lessons.map(l=>`<button class="chip ${vocabFilter.lesson===l?'active':''}" data-action="vocab-lesson" data-lesson="${l}">L${l}</button>`).join('')}
    </div>
    <p class="small mb">${filtered.length} ${state.lang==='bn'?'শব্দ':state.lang==='ne'?'शब्द':'words'}</p>
    <div class="grid grid-2">${filtered.map(v=>vocabCard(v)).join('')}</div>
    ${filtered.length===0?`<div class="card center text-muted">${esc(tUi('empty'))}</div>`:''}
  `;
  }
  function vocabCard(v){
    const learned=!!state.vocabLearned[v.id], bm=!!state.vocabBookmarked[v.id];
    return `<div class="card">
    <div class="flex-between">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px"><div class="jp" style="font-size:22px">${esc(v.ja)}</div>${speakBtn(v.ja)}</div>
        ${v.kanji?`<div class="jp" style="font-size:14px;color:var(--text-muted);margin-top:2px">${esc(v.kanji)}</div>`:''}
        <div class="small">${esc(v.romaji)}</div>
      </div>
      <button class="icon-btn" data-action="vocab-bm" data-id="${v.id}" aria-label="Bookmark">${bm?ICONS.bookmark:ICONS.paperclip}</button>
    </div>
    <p style="font-size:14px;margin-top:6px">${esc(t(v.meaning))}</p>
    <div class="flex mt-sm"><span class="pill">${esc(v.cat)}</span><span class="pill mint">${esc(v.pos)}</span><span class="pill">L${v.lesson}</span></div>
    <button class="btn ${learned?'btn-soft':'btn-primary'} mt-sm" style="width:100%" data-action="vocab-learn" data-id="${v.id}">${learned?ICONS.check+' '+esc(tUi('known')):esc(tUi('mark'))}</button>
  </div>`;
  }

  /* ============ KANA ============ */
  function renderKana(type){
    const isHira=type==='hiragana';
    const basic=isHira?KANA_ROWS:KATAKANA_BASIC;
    const dakuten=isHira?DAKUTEN:DAKUTEN.map(([h,r])=>[katakanaOf(h),r]);
    const yoon=isHira?YOON:YOON.map(([h,r])=>[katakanaOf(h),r]);
    const prefix=isHira?'h:':'k:';
    return `
    <h1 class="stitle"><span>${esc(isHira?tUi('hiragana'):tUi('katakana'))}</span><p>${basic.length} basic · dakuten · yōon</p></h1>
    <p class="small mb">${esc(tUi('audioHint'))}</p>
    <div class="flex mb"><a href="#/${isHira?'katakana':'hiragana'}" class="btn btn-soft">${esc(isHira?tUi('katakana'):tUi('hiragana'))} ${ICONS.arrowRight}</a><span class="pill">${Object.keys(state.kanaMastered).filter(k=>k.startsWith(prefix)).length} / ${basic.length+dakuten.length+yoon.length} ${esc(tUi('known'))}</span></div>
    <h2 class="stitle"><span>${state.lang==='bn'?'মৌলিক':state.lang==='ne'?'आधारभूत':'Basic'}</span></h2>
    <div class="kana-grid">${basic.map(([ch,r])=>kanaCell(ch,r,prefix)).join('')}</div>
    <h2 class="stitle mt"><span>Dakuten · Handakuten</span></h2>
    <div class="kana-grid">${dakuten.map(([ch,r])=>kanaCell(ch,r,prefix)).join('')}</div>
    <h2 class="stitle mt"><span>Yōon</span></h2>
    <div class="kana-grid">${yoon.map(([ch,r])=>kanaCell(ch,r,prefix)).join('')}</div>
  `;
  }
  function kanaCell(ch,r,prefix){const learned=!!state.kanaMastered[prefix+ch];return `<div class="kana-cell ${learned?'learned':''}"><button class="kana-main" data-speak="${esc(ch)}"><span>${esc(ch)}</span><span class="kr">${esc(r)}</span></button><button class="kana-mark" data-action="kana-toggle" data-kana="${esc(prefix+ch)}">${learned?ICONS.check:'○'}</button></div>`;}

  /* ============ KANJI ============ */
  function kanjiCatName(c){return t(KANJI_CAT[c]||{en:c,bn:c,ne:c});}
  function kanjiCats(){
    const present=[...new Set(KANJI.map(k=>k.cat))];
    return KANJI_CAT_ORDER.filter(c=>present.includes(c)).concat(present.filter(c=>!KANJI_CAT_ORDER.includes(c)));
  }
  function kanjiSequence(){const out=[];kanjiCats().forEach(c=>KANJI.filter(k=>k.cat===c).forEach(k=>out.push(k)));return out;}
  function renderKanji(){
    const known=Object.keys(state.kanjiLearned).filter(c=>KANJI.some(k=>k.c===c)).length, pct=Math.round(known/KANJI.length*100);
    return `<h1 class="stitle"><span>${esc(tUi('kanji'))}</span><p>${KANJI.length} ${esc(tr3('characters','অক্ষর','अक्षर'))} · JLPT N5</p></h1>
    <div class="card mb kanji-progress"><div class="flex-between small"><span>${known} / ${KANJI.length} ${esc(tUi('known'))}</span><b>${pct}%</b></div><div class="pbar mt-sm" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><p class="small mt-sm">${esc(tr3('Tap a kanji to see readings, an explanation, example words and a memory trick.','কাঞ্জিতে ট্যাপ করে পাঠ, ব্যাখ্যা, উদাহরণ শব্দ ও স্মরণ কৌশল দেখুন।','कान्जीमा थिचेर पाठ, व्याख्या, उदाहरण शब्द र सम्झने तरिका हेर्नुहोस्।'))}</p></div>
    ${kanjiCats().map(cat=>{const list=KANJI.filter(k=>k.cat===cat);const kn=list.filter(k=>state.kanjiLearned[k.c]).length;return `<h2 class="stitle"><span>${esc(kanjiCatName(cat))}</span><p>${kn} / ${list.length}</p></h2><div class="kanji-grid">${list.map(k=>`<a href="#/kanji/${encodeURIComponent(k.c)}" class="card clickable kanji-card" style="display:block;text-decoration:none"><div class="kanji-char jp">${esc(k.c)}</div><div class="kanji-label">${esc(t(k.m))}</div>${state.kanjiLearned[k.c]?'<div class="pill mt-sm">'+ICONS.check+'</div>':''}</a>`).join('')}</div>`;}).join('')}`;
  }
  function renderKanjiDetail(char){
    const k=KANJI.find(x=>x.c===char);
    if(!k) return `<div class="card center"><h2>Kanji not found</h2><p class="mt"><a href="#/kanji" class="btn btn-primary">${ICONS.arrowLeft} ${esc(tUi('back'))}</a></p></div>`;
    const learned=!!state.kanjiLearned[k.c];
    const seq=kanjiSequence(), idx=seq.findIndex(x=>x.c===k.c), prev=seq[idx-1], next=seq[idx+1];
    const none='—', on=k.on&&k.on.length?k.on.join('、'):none, kun=k.kun&&k.kun.length?k.kun.join('、'):none;
    const exp=KANJI_EXP[k.c];
    return `
    <div class="flex mb"><a href="#/kanji" class="btn btn-ghost">${ICONS.arrowLeft} ${esc(tUi('back'))}</a><span class="pill">${idx+1} / ${seq.length}</span></div>
    <div class="card center"><div class="jp" style="font-size:96px;line-height:1">${esc(k.c)}</div><div class="mt-sm">${speakBtn(k.c)}</div><p class="mt-sm" style="font-size:16px;font-weight:600">${esc(t(k.m))}</p></div>
    <div class="card mt"><div class="grid grid-2"><div><b>${esc(tUi('onyomi'))}:</b> <span class="jp">${esc(on)}</span></div><div><b>${esc(tUi('kunyomi'))}:</b> <span class="jp">${esc(kun)}</span></div><div><b>${esc(tUi('strokes'))}:</b> ${k.strokes}</div><div><b>${esc(tr3('Category','বিভাগ','वर्ग'))}:</b> ${esc(kanjiCatName(k.cat))}</div></div></div>
    ${exp?`<div class="card mt"><div class="pill">${esc(tr3('Explanation','ব্যাখ্যা','व्याख्या'))}</div><p class="mt-sm ld-text">${esc(t(exp))}</p></div>`:''}
    <div class="card mt"><div class="pill">${esc(tUi('vocab'))}</div>${k.vocab.map(v=>`<div class="list-item"><div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0"><span class="jp">${esc(v.w)}</span><span class="small">(${esc(v.r)})</span></div><div class="flex"><span class="small">${esc(t(v.m))}</span>${speakBtn(v.w)}</div></div>`).join('')}</div>
    <div class="card mt"><div class="pill">${esc(tUi('memoryTrick'))}</div><p class="mt-sm">${ICONS.lightbulb} ${esc(t(k.mem))}</p></div>
    <button class="btn ${learned?'btn-soft':'btn-primary'} mt" style="width:100%" data-action="kanji-toggle" data-char="${esc(k.c)}">${learned?ICONS.check+' '+esc(tUi('known')):esc(tUi('mark'))}</button>
    <div class="flex-between mt"><div>${prev?`<a href="#/kanji/${encodeURIComponent(prev.c)}" class="btn btn-soft">${ICONS.arrowLeft} <span class="jp">${esc(prev.c)}</span></a>`:''}</div><div>${next?`<a href="#/kanji/${encodeURIComponent(next.c)}" class="btn btn-soft"><span class="jp">${esc(next.c)}</span> ${ICONS.arrowRight}</a>`:''}</div></div>
  `;
  }

  /* ============ FLASHCARDS ============ */
  let fcSession={queue:[],index:0,flipped:false,filter:'due'};
  function renderFlashcards(){
    const allCards=[];
    GRAMMAR.forEach(l=>l.ex.forEach((ex,i)=>allCards.push({id:`g${l.id}-${i}`,ja:ex.ja,kanji:'',romaji:ex.r,meaning:t(ex.t),type:'grammar'})));
    VOCAB.forEach(v=>allCards.push({id:`v-${v.id}`,ja:v.ja,kanji:v.kanji||'',romaji:v.romaji,meaning:t(v.meaning),type:'vocab'}));
    KANJI.forEach(k=>allCards.push({id:`k-${k.c}`,ja:k.c,kanji:'',romaji:k.on[0]||k.kun[0]||'',meaning:t(k.m),type:'kanji'}));
    let pool=allCards;
    if(fcSession.filter==='due') pool=allCards.filter(c=>isDue(state.flashcards[c.id]));
    else if(fcSession.filter==='bookmarked') pool=allCards.filter(c=>c.type==='vocab'&&state.vocabBookmarked[c.id.replace('v-','')]);
    pool=pool.slice().sort(()=>Math.random()-0.5);
    if(fcSession.queue.length===0||fcSession.filter!==fcSession._lastFilter){fcSession.queue=pool;fcSession.index=0;fcSession.flipped=false;fcSession._lastFilter=fcSession.filter;}
    const dueCount=allCards.filter(c=>isDue(state.flashcards[c.id])).length;
    return `
    <h1 class="stitle"><span>${esc(tUi('flashcards'))}</span><p>${dueCount} ${esc(tUi('dueNow'))} · ${allCards.length} ${esc(tUi('total'))}</p></h1>
    <div class="flex mb" style="overflow-x:auto">
      <button class="chip ${fcSession.filter==='due'?'active':''}" data-action="fc-filter" data-filter="due">${esc(tUi('dueNow'))}</button>
      <button class="chip ${fcSession.filter==='all'?'active':''}" data-action="fc-filter" data-filter="all">${esc(tUi('total'))}</button>
      <button class="chip ${fcSession.filter==='bookmarked'?'active':''}" data-action="fc-filter" data-filter="bookmarked">${esc(tUi('bookmarks'))}</button>
    </div>
    ${fcSession.queue.length===0?`<div class="card center text-muted" style="padding:40px">${esc(tUi('noDue'))}</div>`
            :fcSession.index>=fcSession.queue.length?`<div class="card center" style="padding:40px"><h3>${ICONS.check} ${esc(tUi('completed'))}</h3><p class="small mt-sm">${fcSession.queue.length} cards</p><button class="btn btn-primary mt" data-action="fc-restart">${esc(tUi('again'))}</button></div>`
                    :renderCard(fcSession.queue[fcSession.index])}
    <p class="small center mt">${fcSession.queue.length>0?(fcSession.index+1)+' / '+fcSession.queue.length:''}</p>
  `;
  }
  function renderCard(card){
    return `
    <div class="flashcard ${fcSession.flipped?'flipped':''}" data-action="fc-flip">
      <div class="fc-inner">
        <div class="fc-face fc-front">
          <div class="fc-ja">${esc(card.ja)}</div>
          ${card.kanji?`<div class="jp small mt-sm" style="color:var(--text-muted)">${esc(card.kanji)}</div>`:''}
          <div class="small mt-sm">${esc(card.romaji)}</div>
          <div class="mt-sm">${speakBtn(card.ja)}</div>
          <div class="pill mt-sm">${esc(tUi('flip'))}</div>
        </div>
        <div class="fc-face fc-back"><div style="font-size:28px">${esc(card.meaning)}</div><div class="small mt-sm">${esc(card.ja)} · ${esc(card.romaji)}</div></div>
      </div>
    </div>
    <div class="grid grid-4 mt">
      <button class="btn btn-ghost" data-action="fc-rate" data-q="0">${esc(tUi('again'))}</button>
      <button class="btn btn-ghost" data-action="fc-rate" data-q="1">${esc(tUi('hard'))}</button>
      <button class="btn btn-primary" data-action="fc-rate" data-q="2">${esc(tUi('good'))}</button>
      <button class="btn btn-soft" data-action="fc-rate" data-q="3">${esc(tUi('easy'))}</button>
    </div>
  `;
  }

  /* ============ QUIZ ============ */
  let quizState={active:false,questions:[],index:0,answers:[],filter:0,timed:false,mockId:null};
  function renderQuiz(){
    if(!quizState.active){
      return `
      <h1 class="stitle"><span>${esc(tUi('quiz'))}</span></h1>
      <div class="card">
        <label class="small">${esc(tUi('selectLesson'))}</label>
        <select id="quizLesson" class="input mt-sm"><option value="0">${esc(tUi('allLessons'))}</option>${GRAMMAR.map(l=>`<option value="${l.id}">${esc(tUi('lesson'))} ${l.id} — ${esc(l.title)}</option>`).join('')}</select>
        <label class="small mt">${esc(tUi('timeMode'))}</label>

  /* ============ CLICK HANDLER ============ */
  function handleClick(e){
    if(e.target.closest('#mobile-menu a')){const menu=$('#mobile-menu');if(menu)menu.classList.remove('open');const btn=$('#menuBtn');if(btn)btn.innerHTML=ICONS.menu;}
    if(e.target.closest('#themeBtn')){state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveState();render();return;}
    if(e.target.closest('#menuBtn')){const menu=$('#mobile-menu');const isOpen=menu.classList.toggle('open');const btn=$('#menuBtn');btn.innerHTML=isOpen?ICONS.x:ICONS.menu;return;}
    const speakEl=e.target.closest('[data-speak]');
    if(speakEl){e.preventDefault();e.stopPropagation();speak(speakEl.dataset.speak,speakEl);return;}
    const target=e.target.closest('[data-action]');
    if(!target) return;
    const action=target.dataset.action;

    if(action==='toggle-lesson'){const id=+target.dataset.id;state.lessonsCompleted=toggleArray(state.lessonsCompleted,id);state.recentLessons=[id,...state.recentLessons.filter(x=>x!==id)].slice(0,6);touchStreak();saveState();render();toast(state.lessonsCompleted.includes(id)?tUi('completed'):'Unmarked');return;}
    if(action==='bookmark-lesson'){state.lessonsBookmarked=toggleArray(state.lessonsBookmarked,+target.dataset.id);saveState();render();return;}
    if(action==='quiz-answer'){const wrap=target.closest('[data-quiz]');if(!wrap)return;const correct=+target.dataset.correct,chosen=+target.dataset.qi;wrap.querySelectorAll('.quiz-opt').forEach((b,i)=>{b.classList.add('disabled');if(i===correct)b.classList.add('correct');if(i===chosen&&chosen!==correct)b.classList.add('wrong');});const fb=wrap.querySelector('.quiz-feedback');fb.style.display='block';fb.innerHTML=chosen===correct?`<span style="color:#2e7d32">${ICONS.check} ${esc(tUi('correct'))}</span> — ${esc(target.dataset.explain)}`:`<span style="color:#c62828">${ICONS.x} ${esc(tUi('wrong'))}</span> — ${esc(target.dataset.explain)}`;return;}
    if(action==='kana-toggle'){state.kanaMastered=toggleMap(state.kanaMastered,target.dataset.kana);touchStreak();saveState();render();return;}
    if(action==='vocab-learn'){state.vocabLearned=toggleMap(state.vocabLearned,target.dataset.id);touchStreak();saveState();render();return;}
    if(action==='vocab-bm'){state.vocabBookmarked=toggleMap(state.vocabBookmarked,target.dataset.id);saveState();render();return;}
    if(action==='vocab-cat'){vocabFilter.cat=target.dataset.cat;render();return;}
    if(action==='vocab-lesson'){vocabFilter.lesson=+target.dataset.lesson;render();return;}
    if(action==='kanji-toggle'){state.kanjiLearned=toggleMap(state.kanjiLearned,target.dataset.char);touchStreak();saveState();render();return;}
    if(action==='fc-filter'){fcSession.filter=target.dataset.filter;fcSession.queue=[];fcSession.index=0;fcSession.flipped=false;render();return;}
    if(action==='fc-flip'){fcSession.flipped=!fcSession.flipped;render();return;}
    if(action==='fc-rate'){const q=+target.dataset.q;const card=fcSession.queue[fcSession.index];if(!card)return;state.flashcards[card.id]=reviewSRS(state.flashcards[card.id],q);touchStreak();saveState();fcSession.index++;fcSession.flipped=false;render();return;}
    if(action==='fc-restart'){fcSession.queue=[];fcSession.index=0;fcSession.flipped=false;render();return;}
    if(action==='quiz-start'){const lessonId=+($('#quizLesson')?.value||0);let pool=[];GRAMMAR.forEach(l=>{if(!lessonId||l.id===lessonId)pool.push(l.quiz);});PARTICLES.forEach(p=>{if(!lessonId)pool.push(p.quiz);});if(pool.length===0){toast('No questions');return;}pool=pool.sort(()=>Math.random()-0.5).slice(0,Math.min(8,pool.length));quizState={active:true,questions:pool,index:0,answers:[],filter:lessonId,timed:false,mockId:null};state._quizSaved=false;render();return;}
    if(action==='mock-start'){const testId=+target.dataset.id;const test=MOCK_TESTS.find(x=>x.id===testId);if(!test)return;quizState={active:true,questions:test.questions.slice(),index:0,answers:[],filter:0,timed:false,mockId:testId};state._quizSaved=false;location.hash='#/quiz';render();return;}
    if(action==='q-answer'){const idx=+target.dataset.idx;const q=quizState.questions[quizState.index];quizState.answers[quizState.index]={chosen:idx,correct:idx===q.a};render();return;}
    if(action==='q-next'){quizState.index++;render();return;}
    if(action==='quiz-quit'){const wasMock=quizState.mockId;quizState={active:false,questions:[],index:0,answers:[],filter:0,timed:false,mockId:null};if(wasMock)location.hash='#/mocktests';render();return;}
    if(action==='quiz-restart'){quizState={active:false,questions:[],index:0,answers:[],filter:0,timed:false,mockId:null};render();return;}
    if(action==='quiz-retry-wrong'){const wrong=quizState.questions.filter((q,i)=>!quizState.answers[i]?.correct);const mockId=quizState.mockId;quizState={active:true,questions:wrong,index:0,answers:[],filter:quizState.filter,timed:false,mockId};state._quizSaved=false;render();return;}
    if(action==='admin-login'){const pw=($('#adminPw')||{}).value;if(adminLogin(pw)){toast('Admin login OK');render();}else toast('Wrong password');return;}
    if(action==='admin-logout'){adminLogout();toast('Logged out');render();return;}
    if((action==='material-upload'||action==='material-delete'||action==='material-set-url')&&!isAdmin()){toast('Admin only');return;}
    if(action==='material-upload'){const input=document.createElement('input');input.type='file';input.accept='.pdf,application/pdf';input.onchange=async ev=>{const file=ev.target.files&&ev.target.files[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.pdf')&&file.type!=='application/pdf'){toast('Only PDF files');return;}if(file.size>100*1024*1024){toast('File too large');return;}try{await saveUploadRecord(file);toast('Uploaded');await loadMaterialsUploads();}catch(err){toast('Upload failed');}};input.click();return;}
    if(action==='material-download'){handleDownloadUpload(target.dataset.id);return;}
    if(action==='material-delete'){handleDeleteUpload(target.dataset.id);return;}
    if(action==='material-set-url'){const id=target.dataset.id;const url=prompt('Enter PDF URL:');if(url&&url.trim()){curatedUrls[id]=url.trim();saveCuratedUrls();render();toast('URL saved');}return;}
    if(action==='lang'){state.lang=target.dataset.lang;saveState();render();return;}
    if(action==='theme'){state.theme=target.dataset.theme;applyTheme();saveState();render();return;}
    if(action==='reset-all'){if(confirm(tUi('resetConfirm'))){const lang=state.lang,theme=state.theme;state={...defaultState,lang,theme};saveState();render();toast(tUi('reset'));}return;}
  }
  function applyTheme(){document.documentElement.classList.toggle('dark',state.theme==='dark');}

  /* ============ INIT ============ */
  let initialized=false;
  function init(){
    if(initialized)return;
    initialized=true;
    applyTheme();
    if(!location.hash) location.hash='#/';
    document.body.addEventListener('click',handleClick);
    initVoices();
    const sh=document.getElementById('sakuraHeader');if(sh)sh.innerHTML=sakuraPetals(10,6,10,5,9);
    render();
    trackView();
  }
  if(document.readyState!=='loading') init();
  else document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
