<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#879F87">
  <title>N5 Easy — Learn Japanese</title>
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/mrs31N8h/Gemini-Generated-Image-j0m4s4j0m4s4j0m4.jpg">
  <link rel="apple-touch-icon" href="https://i.ibb.co/mrs31N8h/Gemini-Generated-Image-j0m4s4j0m4s4j0m4.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--sage-50:#F2FAF5;--sage-100:#D9F2E6;--sage-200:#A8D5BA;--sage-400:#879F87;--sage-600:#526B59;--sage-900:#24352C;--cream:#FFFEFA;--muted:#708074;--bg:var(--sage-50);--card-bg:var(--cream);--text:var(--sage-900);--text-muted:var(--muted);--border:var(--sage-100);--shadow:0 2px 12px rgba(82,107,89,0.08);--shadow-card:0 4px 24px rgba(82,107,89,0.10);}
    .dark{--bg:#0f1a14;--card-bg:#16241b;--text:#e8f3ed;--text-muted:#8fa898;--border:#233a2c;--shadow:0 2px 12px rgba(0,0,0,0.35);--shadow-card:0 4px 24px rgba(0,0,0,0.45);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans JP','Noto Sans Bengali','Noto Sans Devanagari',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
    body{padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh;transition:background .3s,color .3s}
    @media(min-width:768px){body{padding-bottom:0}}
    a{color:inherit;text-decoration:none}
    button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
    button:disabled{cursor:not-allowed;opacity:.5}
    input,select{font:inherit}
    h1,h2,h3{font-weight:600;line-height:1.3}
    .jp{font-family:'Noto Sans JP',sans-serif}
    svg{display:inline-block;vertical-align:middle;flex-shrink:0}
    #header{position:sticky;top:0;z-index:40;background:rgba(255,254,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .dark #header{background:rgba(15,26,20,.92)}
    .header-inner{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
    .brand-logo{width:34px;height:34px;border-radius:50%;background:var(--sage-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-family:'Noto Sans JP',sans-serif}
    .nav-desktop{display:none;flex:1;gap:4px;overflow-x:auto;scrollbar-width:none}
    .nav-desktop::-webkit-scrollbar{display:none}
    @media(min-width:768px){.nav-desktop{display:flex}}
    .nav-link{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--sage-600);transition:.2s}
    .dark .nav-link{color:var(--sage-200)}
    .nav-link.active{background:var(--sage-600);color:#fff}
    .nav-link:hover:not(.active){background:var(--sage-100)}
    .dark .nav-link:hover:not(.active){background:var(--border)}
    .header-actions{display:flex;gap:4px;margin-left:auto}
    .icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sage-600);transition:.2s}
    .dark .icon-btn{color:var(--sage-200)}
    .icon-btn:hover{background:var(--sage-100)}
    .dark .icon-btn:hover{background:var(--border)}
    #mobile-menu{display:none;background:var(--card-bg);border-bottom:1px solid var(--border);padding:12px;grid-template-columns:1fr 1fr;gap:6px}
    #mobile-menu.open{display:grid}
    #mobile-menu a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--sage-50)}
    .dark #mobile-menu a{background:var(--border)}
    #mobile-menu a.active{background:var(--sage-600);color:#fff}
    #bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,254,250,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
    .dark #bottomNav{background:rgba(15,26,20,.95)}
    .bn-inner{display:flex;justify-content:space-around;align-items:center;height:60px;max-width:600px;margin:0 auto}
    @media(min-width:768px){#bottomNav{display:none}}
    .bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-muted);font-size:10px;font-weight:500;padding:4px 8px;transition:.2s}
    .bn-item.active{color:var(--sage-600)}
    .dark .bn-item.active{color:var(--sage-200)}
    .bn-item.active .bn-icon{background:var(--sage-100)}
    .dark .bn-item.active .bn-icon{background:var(--border)}
    .bn-icon{width:36px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:.2s}
    main{max-width:1200px;margin:0 auto;padding:16px;min-height:calc(100vh - 200px)}
    @media(min-width:768px){main{padding:24px}}
    .card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
    .card.clickable{cursor:pointer;transition:.2s}
    .card.clickable:hover{box-shadow:var(--shadow-card);transform:translateY(-2px)}
    .grid{display:grid;gap:16px}
    .grid-2{grid-template-columns:1fr}
    @media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr}}
    .grid-3{grid-template-columns:1fr}
    @media(min-width:640px){.grid-3{grid-template-columns:1fr 1fr}}
    @media(min-width:1024px){.grid-3{grid-template-columns:1fr 1fr 1fr}}
    .grid-4{grid-template-columns:repeat(2,1fr)}
    @media(min-width:768px){.grid-4{grid-template-columns:repeat(4,1fr)}}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:500;font-size:14px;transition:.2s}
    .btn:active{transform:scale(.98)}
    .btn-primary{background:var(--sage-600);color:#fff;box-shadow:var(--shadow)}
    .btn-primary:hover{background:var(--sage-900)}
    .btn-soft{background:var(--sage-100);color:var(--sage-900)}
    .dark .btn-soft{background:var(--border);color:var(--sage-100)}
    .btn-soft:hover{background:var(--sage-200)}
    .btn-ghost{background:transparent;color:var(--sage-600)}
    .dark .btn-ghost{color:var(--sage-200)}
    .btn-ghost:hover{background:var(--sage-100)}
    .dark .btn-ghost:hover{background:var(--border)}
    .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--sage-100);color:var(--sage-600)}
    .dark .pill{background:var(--border);color:var(--sage-200)}
    .pill.mint{background:var(--sage-200);color:var(--sage-900)}
    .pill.dark{background:var(--sage-600);color:#fff}
    .input{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--border);background:var(--sage-50);color:var(--text);outline:none;font-size:14px}
    .dark .input{background:var(--bg)}
    .input:focus{border-color:var(--sage-400);box-shadow:0 0 0 3px rgba(135,159,135,.15)}
    .pbar{width:100%;height:8px;border-radius:999px;background:var(--sage-100);overflow:hidden}
    .dark .pbar{background:var(--border)}
    .pbar-fill{height:100%;background:var(--sage-600);border-radius:999px;transition:width .6s ease}
    .ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
    .ring svg{position:absolute;inset:0}
    .ring-label{position:relative;font-size:18px;font-weight:700}
    .stitle{margin-bottom:16px}
    .stitle h2{font-size:18px}
    @media(min-width:768px){.stitle h2{font-size:20px}}
    .stitle p{font-size:13px;color:var(--text-muted);margin-top:2px}
    .lesson-box{margin:12px 0;padding:14px;border-radius:12px;background:var(--sage-50);border-left:3px solid var(--sage-400)}
    .dark .lesson-box{background:var(--bg)}
    .example{padding:14px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border);margin:10px 0}
    .ex-ja{font-size:18px;margin-bottom:4px;line-height:1.8}
    .ex-romaji{font-size:13px;color:var(--text-muted);font-style:italic}
    .ex-trans{margin-top:8px;font-size:14px}
    .ex-trans div{padding:2px 0}
    .ex-trans b{color:var(--sage-600);font-weight:600;margin-right:4px}
    .quiz-opt{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:12px;border:2px solid var(--border);background:var(--card-bg);margin:8px 0;font-size:15px;transition:.2s}
    .quiz-opt:hover{border-color:var(--sage-400)}
    .quiz-opt.correct{border-color:#4CAF50;background:rgba(76,175,80,.08)}
    .quiz-opt.wrong{border-color:#e57373;background:rgba(229,115,115,.08)}
    .quiz-opt.disabled{pointer-events:none;opacity:.75}
    .flashcard{perspective:1200px;height:280px;margin:16px 0;cursor:pointer}
    .fc-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
    .flashcard.flipped .fc-inner{transform:rotateY(180deg)}
    .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:var(--shadow-card);border:1px solid var(--border)}
    .fc-front{background:var(--card-bg)}
    .fc-back{background:var(--sage-100);transform:rotateY(180deg)}
    .dark .fc-back{background:var(--border)}
    .fc-ja{font-size:64px;font-family:'Noto Sans JP',sans-serif;line-height:1.2}
    @media(min-width:640px){.fc-ja{font-size:80px}}
    .kana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
    .kana-cell{aspect-ratio:1;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden;transition:.15s}
    .kana-cell:hover{border-color:var(--sage-400);transform:translateY(-2px)}
    .kana-cell.learned{background:var(--sage-100);border-color:var(--sage-200)}
    .dark .kana-cell.learned{background:var(--border);border-color:var(--sage-600)}
    .kana-main{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-family:'Noto Sans JP',sans-serif;background:none;border:none;color:inherit;cursor:pointer;padding:4px}
    .kana-cell .kr{font-size:11px;color:var(--text-muted);font-family:'Inter',sans-serif;margin-top:2px}
    .kana-mark{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;font-size:11px;padding:0;background:rgba(255,255,255,.85);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);line-height:1}
    .dark .kana-mark{background:rgba(22,36,27,.85)}
    .kana-cell.learned .kana-mark{background:var(--sage-600);color:#fff;border-color:var(--sage-600)}
    .kanji-card{cursor:pointer}
    .kanji-char{font-size:42px;font-family:'Noto Sans JP',sans-serif;line-height:1}
    .kanji-label{font-size:12px;color:var(--text-muted);margin-top:4px}
    #toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--sage-900);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:100;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .stat-mini{display:flex;flex-direction:column;align-items:center;padding:14px 8px;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;text-align:center}
    .stat-num{font-size:22px;font-weight:700;color:var(--sage-600)}
    .stat-lbl{font-size:11px;color:var(--text-muted);margin-top:2px}
    .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .flex-between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    .mt{margin-top:16px}.mt-sm{margin-top:8px}.mb{margin-bottom:16px}.mb-sm{margin-bottom:8px}
    .center{text-align:center}
    .small{font-size:12px;color:var(--text-muted)}
    .text-muted{color:var(--text-muted)}
    .chip{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;font-weight:500;transition:.2s}
    .chip.active{background:var(--sage-600);color:#fff;border-color:var(--sage-600)}
    .chip:hover:not(.active){border-color:var(--sage-400)}
    .list-item{padding:14px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
    .list-item:last-child{border-bottom:none}
    .lesson-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card-bg);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:.15s}
    .lesson-row:hover{border-color:var(--sage-400);transform:translateX(2px)}
    .lesson-num{width:38px;height:38px;border-radius:12px;background:var(--sage-100);color:var(--sage-600);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
    .dark .lesson-num{background:var(--border);color:var(--sage-200)}
    .lesson-num.done{background:var(--sage-600);color:#fff}
    .lesson-title{flex:1;min-width:0}
    .lesson-title h4{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lesson-title p{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .speak-btn{width:34px;height:34px;flex-shrink:0;background:var(--sage-100);color:var(--sage-600);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
    .speak-btn svg{width:16px;height:16px}
    .dark .speak-btn{background:var(--border);color:var(--sage-200)}
    .speak-btn:hover{background:var(--sage-200);transform:scale(1.05)}
    .speak-btn.speaking{animation:pulse .6s ease}
    @keyframes pulse{50%{transform:scale(1.25);background:var(--sage-400);color:#fff}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}
    /* brand text */
    .brand span{position:relative;display:inline-block;font-weight:800;font-size:17px;letter-spacing:.6px;padding-right:14px;
      background:linear-gradient(100deg,#3f5a48 0%,#526B59 35%,#E8A0AE 50%,#526B59 65%,#3f5a48 100%);background-size:250% 100%;
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
      animation:brandShine 4.5s ease-in-out infinite,brandIn .9s cubic-bezier(.2,.8,.2,1) both;transition:letter-spacing .35s}
    .dark .brand span{background-image:linear-gradient(100deg,#A8D5BA 0%,#D9F2E6 35%,#F4A9BC 50%,#D9F2E6 65%,#A8D5BA 100%)}
    .brand span::after{content:"";position:absolute;left:0;right:14px;bottom:-3px;height:2px;border-radius:2px;background:linear-gradient(90deg,#526B59,#E8A0AE,#526B59);transform-origin:left;animation:brandLine 4.5s ease-in-out infinite}
    .dark .brand span::after{background:linear-gradient(90deg,#A8D5BA,#F4A9BC,#A8D5BA)}
    .brand span::before{content:"";position:absolute;right:0;top:1px;width:9px;height:7px;background:linear-gradient(135deg,#FFE9EF,#E8A0AE);border-radius:150% 0 150% 0;-webkit-text-fill-color:initial;animation:brandPetal 3.2s ease-in-out infinite}
    .brand:hover span{letter-spacing:1.6px}
    @keyframes brandShine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
    @keyframes brandIn{from{opacity:0;transform:translateY(-8px) scale(.94);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
    @keyframes brandLine{0%{transform:scaleX(0)}45%,80%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
    @keyframes brandPetal{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-2px,5px) rotate(40deg)}}
    /* sakura petals */
    .sakura-layer{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;pointer-events:none;--h:400px}
    .sakura-layer i{position:absolute;top:-20px;display:block;background:linear-gradient(135deg,#FFE9EF 0%,#F4A9BC 100%);border-radius:150% 0 150% 0;opacity:0;animation:sakuraFall linear infinite;will-change:transform,opacity}
    #sakuraHeader{bottom:auto;height:58px;--h:58px}
    .header-inner{position:relative;z-index:1}
    @keyframes sakuraFall{
      0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}
      10%{opacity:var(--o,.85)}
      30%{transform:translate3d(var(--sway),calc(var(--h)*.3),0) rotate(110deg)}
      60%{transform:translate3d(calc(var(--sway)*-.6),calc(var(--h)*.65),0) rotate(230deg)}
      90%{opacity:var(--o,.85)}
      100%{transform:translate3d(var(--drift),calc(var(--h) + 30px),0) rotate(360deg);opacity:0}}
    @media(prefers-reduced-motion:reduce){.sakura-layer{display:none}}

    /* Universities: photo + info */
    .uni-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
    .uni-card{display:flex;flex-direction:column}
    .uni-photo{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--sage-600),var(--sage-400))}
    .uni-photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:700;padding:8px;text-align:center;opacity:.9}
    .uni-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .uni-note{padding:8px 10px;border-radius:10px;background:var(--sage-100);color:var(--sage-900)}
    .dark .uni-note{background:var(--border);color:var(--text)}
    .uni-more summary{cursor:pointer;font-weight:600;color:var(--sage-600);padding:6px 0;list-style-position:inside}
    .dark .uni-more summary{color:var(--sage-200)}
    .uni-more summary:focus-visible{outline:2px solid var(--sage-600);outline-offset:2px;border-radius:6px}
    .uni-more dl{margin:6px 0 12px}
    .uni-more dt{font-weight:700;margin-top:6px}
    .uni-more dd{margin:0;color:var(--text-muted)}
    .uni-more .btn{display:inline-flex}
    .uni-credit{position:absolute;left:6px;bottom:6px;right:6px;font-size:10px;line-height:1.3;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px}
    .back-bar{margin-bottom:12px}
    .back-bar .btn{min-height:44px}

    /* Lesson detail */
    .ld-text{font-size:14px;line-height:1.75}
    .ld-steps,.ld-list{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.7}
    .ld-steps li,.ld-list li{margin-bottom:6px}
    .wbw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .wbw-chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:12px;background:var(--sage-50);border:1px solid var(--border);min-width:56px;max-width:140px}
    .wbw-chip b{font-size:16px;font-weight:500}
    .wbw-chip small{font-size:11px;line-height:1.3;color:var(--text-muted);text-align:center}
    .dark .wbw-chip{background:var(--bg)}

    /* Home */
    :root{--ac1:#D9F2E6;--ac2:#FFF1D6;--ac3:#DDEBFB;--ac4:#FBE3E3;--ac5:#EADFF7;--ac6:#E4F1D0;--acfg:#24352C}
    .dark{--ac1:#1f3a2c;--ac2:#3a3220;--ac3:#1f3045;--ac4:#3d2626;--ac5:#30263f;--ac6:#2c3a1d;--acfg:#e8f3ed}
    .hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,#3f5a48 0%,#526B59 45%,#7aa68a 100%);box-shadow:var(--shadow-card)}
    @media(min-width:768px){.hero{padding:32px 36px}}
    .hero-deco{position:absolute;inset:0;pointer-events:none}
    .hero-deco span{position:absolute;font-family:'Noto Sans JP',sans-serif;font-weight:700;color:rgba(255,255,255,.10);animation:heroFloat 9s ease-in-out infinite}
    .hero-deco span:nth-child(1){font-size:90px;right:34%;top:-18px}
    .hero-deco span:nth-child(2){font-size:60px;right:26%;bottom:-10px;animation-delay:-2s}
    .hero-deco span:nth-child(3){font-size:70px;left:42%;top:8%;animation-delay:-4s}
    .hero-deco span:nth-child(4){font-size:50px;right:3%;bottom:18%;animation-delay:-6s}

  const KANJI_EXP={"日":{"en":"A picture of the sun. It means “day” and “sun”. Read にち / じつ in many compounds (日曜日, 毎日) and ひ / び alone. Dates have special readings, such as 一日 (ついたち) and 二日 (ふつか).","bn":"সূর্যের ছবি থেকে এসেছে। অর্থ “দিন” ও “সূর্য”। অনেক যৌগ শব্দে にち / じつ (日曜日, 毎日) এবং একা ひ / び পড়া হয়। তারিখে বিশেষ পাঠ আছে, যেমন 一日 (ついたち), 二日 (ふつか)।","ne":"सूर्यको चित्रबाट बनेको। अर्थ “दिन” र “सूर्य”। धेरै यौगिक शब्दमा にち / じつ (日曜日, 毎日) र एक्लै ひ / び पढिन्छ। मितिमा विशेष पाठ हुन्छन्, जस्तै 一日 (ついたち), 二日 (ふつか)।"},"月":{"en":"A picture of the crescent moon. It also means “month”. Read げつ / がつ in compounds: 月曜日 (Monday), 三月 (March). Alone it is つき (moon).","bn":"অর্ধচন্দ্রের ছবি। এর অর্থ “মাস”-ও। যৌগে げつ / がつ: 月曜日 (সোমবার), 三月 (মার্চ)। একা পড়লে つき (চাঁদ)।","ne":"अर्धचन्द्रको चित्र। अर्थ “महिना” पनि हो। यौगिकमा げつ / がつ: 月曜日 (सोमबार), 三月 (मार्च)। एक्लै つき (चन्द्रमा)।"},"火":{"en":"A picture of flames. Used in 火曜日 (Tuesday) and 火事 (fire). Alone it is ひ; it changes to び in 花火 (fireworks).","bn":"শিখার ছবি। 火曜日 (মঙ্গলবার) ও 火事 (অগ্নিকাণ্ড)-এ ব্যবহার হয়। একা ひ; 花火 (আতশবাজি)-তে び হয়।","ne":"ज्वालाको चित्र। 火曜日 (मंगलबार) र 火事 (आगलागी) मा प्रयोग हुन्छ। एक्लै ひ; 花火 (आतिशबाजी) मा び हुन्छ।"},"水":{"en":"A picture of flowing water. Used in 水曜日 (Wednesday). Alone it is みず; お水 (おみず) is polite “water”.","bn":"বহমান জলের ছবি। 水曜日 (বুধবার)-এ ব্যবহার হয়। একা みず; お水 মানে ভদ্র “জল”।","ne":"बग्ने पानीको चित्र। 水曜日 (बुधबार) मा प्रयोग हुन्छ। एक्लै みず; お水 शिष्ट “पानी” हो।"},"木":{"en":"A picture of a tree with branches and roots. Used in 木曜日 (Thursday). Alone it is き (tree, wood).","bn":"শাখা ও শিকড়সহ গাছের ছবি। 木曜日 (বৃহস্পতিবার)-এ ব্যবহার হয়। একা き (গাছ, কাঠ)।","ne":"हाँगा र जरासहितको रूखको चित्र। 木曜日 (बिहीबार) मा प्रयोग हुन्छ। एक्लै き (रूख, काठ)।"},"金":{"en":"Originally “metal / gold”, now also “money”. 金曜日 is Friday and お金 (おかね) is money. It is かね alone and きん in compounds.","bn":"মূলত “ধাতু / সোনা”, এখন “টাকা”-ও। 金曜日 শুক্রবার এবং お金 (おかね) টাকা। একা かね, যৌগে きん।","ne":"मूल रूपमा “धातु / सुन”, अहिले “पैसा” पनि। 金曜日 शुक्रबार र お金 (おかね) पैसा। एक्लै かね, यौगिकमा きん।"},"土":{"en":"A picture of a mound of earth. Used in 土曜日 (Saturday). Alone it is つち (soil).","bn":"মাটির স্তূপের ছবি। 土曜日 (শনিবার)-এ ব্যবহার হয়। একা つち (মাটি)।","ne":"माटोको थुप्राको चित्र। 土曜日 (शनिबार) मा प्रयोग हुन्छ। एक्लै つち (माटो)।"},"人":{"en":"A picture of a person walking. Read にん in counting (三人 = 3 people, but 一人 ひとり and 二人 ふたり are special) and じん for nationality (日本人). Alone it is ひと.","bn":"হেঁটে চলা মানুষের ছবি। গণনায় にん (三人 = ৩ জন; তবে 一人 ひとり ও 二人 ふたり বিশেষ) এবং জাতীয়তায় じん (日本人)। একা ひと।","ne":"हिँडिरहेको मानिसको चित्र। गनतीमा にん (三人 = ३ जना; तर 一人 ひとり र 二人 ふたり विशेष) र राष्ट्रियतामा じん (日本人)। एक्लै ひと।"},"口":{"en":"A picture of an open mouth. It also means “opening”: 入口 (entrance), 出口 (exit). Alone it is くち; in compounds it can become ぐち.","bn":"খোলা মুখের ছবি। এটি “প্রবেশপথ”-ও বোঝায়: 入口 (প্রবেশ), 出口 (প্রস্থান)। একা くち; যৌগে ぐち হতে পারে।","ne":"खुला मुखको चित्र। यसले “प्रवेशद्वार” पनि जनाउँछ: 入口 (प्रवेश), 出口 (निकास)। एक्लै くち; यौगिकमा ぐち हुन सक्छ।"},"目":{"en":"An eye turned on its side. Alone it is め. It is also a suffix for order, as in 二番目 (the second).","bn":"পাশ ফিরে থাকা চোখের ছবি। একা め। ক্রম বোঝাতেও ব্যবহার হয়, যেমন 二番目 (দ্বিতীয়)।","ne":"छेउ फर्किएको आँखाको चित्र। एक्लै め। क्रम जनाउन पनि प्रयोग हुन्छ, जस्तै 二番目 (दोस्रो)।"},"耳":{"en":"A picture of an ear. Alone it is みみ. It is rare in compounds at N5 level.","bn":"কানের ছবি। একা みみ। N5 স্তরে যৌগে কম দেখা যায়।","ne":"कानको चित्र। एक्लै みみ। N5 तहमा यौगिकमा कम देखिन्छ।"},"手":{"en":"A picture of a hand with fingers. Alone it is て. In 上手 (じょうず, skilled) and 下手 (へた, unskilled) it has special readings.","bn":"আঙুলসহ হাতের ছবি। একা て। 上手 (じょうず, দক্ষ) ও 下手 (へた, অদক্ষ)-এ বিশেষ পাঠ আছে।","ne":"औँलासहितको हातको चित्र। एक्लै て। 上手 (じょうず, दक्ष) र 下手 (へた, कमजोर) मा विशेष पाठ छ।"},"足":{"en":"A picture of a leg and foot. Alone it is あし. It also means “to be enough”: 足りる (たりる).","bn":"পা ও পায়ের পাতার ছবি। একা あし। “যথেষ্ট হওয়া” অর্থেও: 足りる (たりる)।","ne":"खुट्टाको चित्र। एक्लै あし। “पुग्नु” अर्थमा पनि: 足りる (たりる)।"},"山":{"en":"A picture of three peaks. Alone it is やま; in names it is さん, as in 富士山 (ふじさん).","bn":"তিনটি চূড়ার ছবি। একা やま; নামে さん, যেমন 富士山 (ふじさん)।","ne":"तीन चुचुराको चित्र। एक्लै やま; नाममा さん, जस्तै 富士山 (ふじさん)।"},"川":{"en":"A picture of water flowing between banks. Alone it is かわ; it becomes がわ in names such as 小川 (おがわ).","bn":"দুই তীরের মাঝে বয়ে চলা জলের ছবি। একা かわ; নামে がわ হতে পারে, যেমন 小川।","ne":"दुई किनारबीच बग्ने पानीको चित्र। एक्लै かわ; नाममा がわ हुन सक्छ, जस्तै 小川।"},"天":{"en":"“Sky / heaven”: the line “one” above the person “大”. Read てん. It appears in 天気 (てんき, weather).","bn":"“আকাশ / স্বর্গ”: “大” মানুষের ওপরে এক রেখা। পাঠ てん। 天気 (てんき, আবহাওয়া)-তে দেখা যায়।","ne":"“आकाश / स्वर्ग”: “大” मानिसमाथि एउटा रेखा। पाठ てん। 天気 (てんき, मौसम) मा देखिन्छ।"},"気":{"en":"“Spirit, energy, mood”. Read き / け. It is in many everyday words: 元気 (げんき), 天気 (てんき), 病気 (びょうき).","bn":"“আত্মা, শক্তি, মেজাজ”। পাঠ き / け। প্রতিদিনের অনেক শব্দে আছে: 元気 (げんき), 天気 (てんき), 病気 (びょうき)।","ne":"“आत्मा, ऊर्जा, मन”। पाठ き / け। दैनिक धेरै शब्दमा छ: 元気 (げんき), 天気 (てんき), 病気 (びょうき)।"},"生":{"en":"One of the most flexible kanji: life, birth, raw. Read せい / しょう in 先生 and 学生, and いきる, うまれる, なま alone.","bn":"সবচেয়ে বহুমুখী কাঞ্জির একটি: জীবন, জন্ম, কাঁচা। 先生 ও 学生-এ せい / しょう; একা いきる, うまれる, なま।","ne":"सबैभन्दा बहुमुखी कान्जी मध्ये एक: जीवन, जन्म, काँचो। 先生 र 学生 मा せい / しょう; एक्लै いきる, うまれる, なま।"},"学":{"en":"“Study / learn”. Read がく in 学校 (school) and 学生 (student). The verb is 学ぶ (まなぶ).","bn":"“পড়াশোনা / শেখা”। 学校 (স্কুল) ও 学生 (ছাত্র)-এ がく। ক্রিয়া 学ぶ (まなぶ)।","ne":"“अध्ययन / सिक्नु”। 学校 (विद्यालय) र 学生 (विद्यार्थी) मा がく। क्रिया 学ぶ (まなぶ)।"},"校":{"en":"“School”. It appears in 学校 (がっこう), 高校 (こうこう, high school) and 校長 (こうちょう, principal). Read こう.","bn":"“স্কুল”। 学校 (がっこう), 高校 (こうこう, হাইস্কুল) ও 校長 (こうちょう, অধ্যক্ষ)-এ আছে। পাঠ こう।","ne":"“विद्यालय”। 学校 (がっこう), 高校 (こうこう, उच्च माध्यमिक) र 校長 (こうちょう, प्रधानाध्यापक) मा छ। पाठ こう।"},"本":{"en":"Originally “root”, now “book” and “origin”. 日本 (にほん) means “origin of the sun”. It also counts long objects: 一本, 二本, 三本 (いっぽん, にほん, さんぼん).","bn":"মূল অর্থ “মূল”, এখন “বই” ও “উৎস”। 日本 (にほん) মানে “সূর্যের উৎস”। লম্বা জিনিস গুনতেও ব্যবহার: 一本, 二本, 三本 (いっぽん, にほん, さんぼん)।","ne":"मूल अर्थ “जरा”, अहिले “किताब” र “उत्पत्ति”। 日本 (にほん) को अर्थ “सूर्यको उत्पत्ति”। लामा वस्तु गन्न पनि प्रयोग: 一本, 二本, 三本 (いっぽん, にほん, さんぼん)।"},"語":{"en":"“Language / word”. Read ご. Used in 日本語 (にほんご), 英語 (えいご) and 単語 (たんご). It is always a language when after a country name.","bn":"“ভাষা / শব্দ”। পাঠ ご। 日本語 (にほんご), 英語 (えいご) ও 単語 (たんご)-তে। দেশের নামের পরে বসলে ভাষা বোঝায়।","ne":"“भाषा / शब्द”। पाठ ご। 日本語 (にほんご), 英語 (えいご) र 単語 (たんご) मा। देशको नामपछि आए भाषा जनाउँछ।"},"大":{"en":"A person with arms spread wide: “big”. 大きい (おおきい) is “big”; 大学 (だいがく) is “university”. 大丈夫 (だいじょうぶ) means “OK”.","bn":"দুই হাত ছড়ানো মানুষ: “বড়”। 大きい (おおきい) মানে “বড়”; 大学 (だいがく) মানে “বিশ্ববিদ্যালয়”। 大丈夫 (だいじょうぶ) মানে “ঠিক আছে”।","ne":"दुवै हात फैलाएको मानिस: “ठूलो”। 大きい (おおきい) “ठूलो”; 大学 (だいがく) “विश्वविद्यालय”। 大丈夫 (だいじょうぶ) को अर्थ “ठीक छ”।"},"小":{"en":"Three small dots or pieces: “small”. 小さい (ちいさい) is “small”. Read しょう in 小学校 (しょうがっこう, elementary school).","bn":"তিনটি ছোট বিন্দু বা টুকরো: “ছোট”। 小さい (ちいさい) মানে “ছোট”। 小学校 (しょうがっこう, প্রাথমিক স্কুল)-এ しょう।","ne":"तीन साना थोपा वा टुक्रा: “सानो”। 小さい (ちいさい) “सानो”। 小学校 (しょうがっこう, प्राथमिक विद्यालय) मा しょう।"},"中":{"en":"A line through the middle of a box: “middle / inside”. 中 (なか) is “inside”; 中国 (ちゅうごく) is China. After a time word it means “during”: 一日中.","bn":"বাক্সের মাঝ দিয়ে রেখা: “মাঝে / ভেতরে”। 中 (なか) মানে “ভেতরে”; 中国 (ちゅうごく) চীন। সময়ের শব্দের পরে “সারাক্ষণ”: 一日中।","ne":"बाकसको बीचबाट रेखा: “बीच / भित्र”। 中 (なか) “भित्र”; 中国 (ちゅうごく) चीन। समयसूचक शब्दपछि “भरि”: 一日中।"},"上":{"en":"A mark above a line: “up / above”. 上 (うえ) is “above”; 上手 (じょうず) is “skilled”. The verb 上がる (あがる) is “to go up”.","bn":"রেখার ওপরে চিহ্ন: “ওপর”। 上 (うえ) মানে “ওপরে”; 上手 (じょうず) “দক্ষ”। ক্রিয়া 上がる (あがる) মানে “ওপরে ওঠা”।","ne":"रेखामाथि चिह्न: “माथि”। 上 (うえ) “माथि”; 上手 (じょうず) “दक्ष”। क्रिया 上がる (あがる) “माथि जानु”।"},"下":{"en":"A mark below a line: “down / below”. 下 (した) is “below”; 下手 (へた) is “unskilled”. 下さい (ください) is often written in kana.","bn":"রেখার নিচে চিহ্ন: “নিচ”। 下 (した) মানে “নিচে”; 下手 (へた) “অদক্ষ”। 下さい (ください) প্রায়ই কানায় লেখা হয়।","ne":"रेखामुनि चिह्न: “तल”। 下 (した) “तल”; 下手 (へた) “कमजोर”। 下さい (ください) प्रायः कानामा लेखिन्छ।"},"左":{"en":"“Left”. Alone it is ひだり. It is paired with 右 (みぎ). Think: the left hand holds the ruler (工).","bn":"“বাম”। একা ひだり। 右 (みぎ)-এর জোড়া। মনে রাখুন: বাম হাতে ফিতা (工) ধরা।","ne":"“देब्रे”। एक्लै ひだり। 右 (みぎ) को जोडी। सम्झनुहोस्: देब्रे हातले नापको सामग्री (工) समात्छ।"},"右":{"en":"“Right”. Alone it is みぎ. The part 口 (mouth) is a hint: you eat with the right hand.","bn":"“ডান”। একা みぎ। 口 (মুখ) অংশটি ইঙ্গিত: ডান হাতে খাওয়া হয়।","ne":"“दायाँ”। एक्लै みぎ। 口 (मुख) भागले संकेत दिन्छ: दायाँ हातले खाइन्छ।"},"前":{"en":"“Before / in front”. 前 (まえ) is “front / before”. In 午前 (ごぜん, a.m.) and 名前 (なまえ, name) it is read ぜん / まえ.","bn":"“আগে / সামনে”। 前 (まえ) মানে “সামনে / আগে”। 午前 (ごぜん, সকাল) ও 名前 (なまえ, নাম)-এ ぜん / まえ।","ne":"“अघि / अगाडि”। 前 (まえ) “अगाडि / अघि”। 午前 (ごぜん, बिहान) र 名前 (なまえ, नाम) मा ぜん / まえ।"},"後":{"en":"“After / behind”. 後ろ (うしろ) is “behind”; あと is “after”. In 午後 (ごご, p.m.) it is ご.","bn":"“পরে / পেছনে”। 後ろ (うしろ) মানে “পেছনে”; あと মানে “পরে”। 午後 (ごご, বিকাল)-এ ご।","ne":"“पछि / पछाडि”। 後ろ (うしろ) “पछाडि”; あと “पछि”। 午後 (ごご, दिउँसो) मा ご।"},"午":{"en":"“Noon”. It is almost always seen in 午前 (a.m.) and 午後 (p.m.). Read ご.","bn":"“দুপুর”। প্রায় সবসময় 午前 (সকাল) ও 午後 (বিকাল)-এ দেখা যায়। পাঠ ご।","ne":"“मध्यदिन”। प्रायः 午前 (बिहान) र 午後 (दिउँसो) मा देखिन्छ। पाठ ご।"},"今":{"en":"“Now”. 今 (いま) is “now”. 今日 (きょう, today) and 今年 (ことし, this year) have special readings. 今月 is こんげつ.","bn":"“এখন”। 今 (いま) মানে “এখন”। 今日 (きょう, আজ) ও 今年 (ことし, এ বছর)-এর বিশেষ পাঠ আছে। 今月 こんげつ।","ne":"“अहिले”। 今 (いま) “अहिले”। 今日 (きょう, आज) र 今年 (ことし, यो वर्ष) को विशेष पाठ छ। 今月 こんげつ।"},"時":{"en":"“Time / hour”. Read じ for o’clock: 三時 (さんじ). Alone it is とき (when). 時間 (じかん) is “time (amount)”.","bn":"“সময় / ঘণ্টা”। ঘড়ির সময়ে じ: 三時 (さんじ)। একা とき (যখন)। 時間 (じかん) মানে “সময়ের পরিমাণ”।","ne":"“समय / घण्टा”। घडीको समयमा じ: 三時 (さんじ)। एक्लै とき (जब)। 時間 (じかん) “समयको मात्रा”।"},"分":{"en":"“Minute / part / understand”. Read ふん / ぷん for minutes (五分 ごふん, 十分 じゅっぷん). 分かる (わかる) means “to understand”.","bn":"“মিনিট / অংশ / বোঝা”। মিনিটে ふん / ぷん (五分 ごふん, 十分 じゅっぷん)। 分かる (わかる) মানে “বোঝা”।","ne":"“मिनेट / भाग / बुझ्नु”। मिनेटमा ふん / ぷん (五分 ごふん, 十分 じゅっぷん)। 分かる (わかる) “बुझ्नु”।"},"年":{"en":"“Year”. Read ねん: 一年 (いちねん). Alone it is とし. Special: 今年 (ことし, this year).","bn":"“বছর”। পাঠ ねん: 一年 (いちねん)। একা とし। বিশেষ: 今年 (ことし, এ বছর)।","ne":"“वर्ष”। पाठ ねん: 一年 (いちねん)। एक्लै とし। विशेष: 今年 (ことし, यो वर्ष)।"},"毎":{"en":"“Every”. It goes before a time word: 毎日 (まいにち, every day), 毎週 (まいしゅう, every week), 毎朝 (まいあさ, every morning).","bn":"“প্রতি”। সময়ের শব্দের আগে বসে: 毎日 (まいにち, প্রতিদিন), 毎週 (まいしゅう, প্রতি সপ্তাহ), 毎朝 (まいあさ, প্রতি সকাল)।","ne":"“हरेक”। समयसूचक शब्दअघि आउँछ: 毎日 (まいにち, हरेक दिन), 毎週 (まいしゅう, हरेक हप्ता), 毎朝 (まいあさ, हरेक बिहान)।"},"何":{"en":"“What”. Read なに or なん (before ‘d’, ‘t’, ‘n’ sounds or counters): 何 (なに), 何時 (なんじ, what time), 何人 (なんにん, how many people).","bn":"“কী”। なに বা なん পড়া হয় (d, t, n ধ্বনি বা গণনা-শব্দের আগে なん): 何 (なに), 何時 (なんじ, কটা বাজে), 何人 (なんにん, কতজন)।","ne":"“के”। なに वा なん पढिन्छ (d, t, n ध्वनि वा गन्ती-शब्दअघि なん): 何 (なに), 何時 (なんじ, कति बजे), 何人 (なんにん, कतिजना)।"},"私":{"en":"“I / me / private”. 私 (わたし) is the standard polite “I”. 私立 (しりつ) means “private (school)”.","bn":"“আমি / ব্যক্তিগত”। 私 (わたし) হলো ভদ্র “আমি”। 私立 (しりつ) মানে “বেসরকারি”।","ne":"“म / निजी”। 私 (わたし) शिष्ट “म” हो। 私立 (しりつ) को अर्थ “निजी”।"},"一":{"en":"The simplest kanji, a single stroke. 一つ counts objects. 一人 (ひとり, one person) and 一日 (ついたち, the 1st) have special readings.","bn":"সবচেয়ে সহজ কাঞ্জি, একটিমাত্র রেখা। 一つ জিনিস গোনে। 一人 (ひとり, একজন) ও 一日 (ついたち, ১ তারিখ)-এর বিশেষ পাঠ আছে।","ne":"सबैभन्दा सरल कान्जी, एउटै रेखा। 一つ वस्तु गन्छ। 一人 (ひとり, एक जना) र 一日 (ついたち, १ गते) को विशेष पाठ छ।"},"二":{"en":"Two strokes. 二人 (ふたり) and 二日 (ふつか, the 2nd) are special readings. Month: 二月 (にがつ).","bn":"দুটি রেখা। 二人 (ふたり) ও 二日 (ふつか, ২ তারিখ) বিশেষ পাঠ। মাস: 二月 (にがつ)।","ne":"दुई रेखा। 二人 (ふたり) र 二日 (ふつか, २ गते) विशेष पाठ। महिना: 二月 (にがつ)।"},"三":{"en":"Three strokes. Read さん in most compounds. 三人 is さんにん; 三日 (みっか) is the 3rd.","bn":"তিনটি রেখা। বেশিরভাগ যৌগে さん। 三人 さんにん; 三日 (みっか) ৩ তারিখ।","ne":"तीन रेखा। धेरैजसो यौगिकमा さん। 三人 さんにん; 三日 (みっか) ३ गते।"},"四":{"en":"Readings し, よん and よ. In counting, よん is common because し sounds like 死 (death). 四月 is しがつ; 四時 is よじ.","bn":"পাঠ し, よん ও よ। গণনায় よん বেশি চলে, কারণ し শুনতে 死 (মৃত্যু)-র মতো। 四月 しがつ; 四時 よじ।","ne":"पाठ し, よん र よ। गन्तीमा よん बढी चल्छ, किनकि し 死 (मृत्यु) जस्तो सुनिन्छ। 四月 しがつ; 四時 よじ।"},"五":{"en":"Read ご in compounds: 五時 (ごじ), 五月 (ごがつ). 五日 (いつか) is the 5th.","bn":"যৌগে ご: 五時 (ごじ), 五月 (ごがつ)। 五日 (いつか) ৫ তারিখ।","ne":"यौगिकमा ご: 五時 (ごじ), 五月 (ごがつ)। 五日 (いつか) ५ गते।"},"六":{"en":"Read ろく in compounds: 六時 (ろくじ). 六日 (むいか) is the 6th. 六 and 八 look alike: 六 has a dot on top.","bn":"যৌগে ろく: 六時 (ろくじ)। 六日 (むいか) ৬ তারিখ। 六 ও 八 দেখতে কাছাকাছি: 六-এর ওপরে বিন্দু আছে।","ne":"यौगिकमा ろく: 六時 (ろくじ)। 六日 (むいか) ६ गते। 六 र 八 मिल्दाजुल्दा छन्: 六 को माथि थोप्ला छ।"},"七":{"en":"Two readings: しち (七月) and なな (七時 ななじ / しちじ). 七日 is なのか, the 7th.","bn":"দুটি পাঠ: しち (七月) ও なな (七時 ななじ / しちじ)। 七日 なのか ৭ তারিখ।","ne":"दुई पाठ: しち (七月) र なな (七時 ななじ / しちじ)। 七日 なのか ७ गते।"},"八":{"en":"Read はち in 八月, 八時. 八日 is ようか, the 8th. The widening shape is thought lucky in Japan.","bn":"八月, 八時-এ はち। 八日 ようか ৮ তারিখ। নিচে প্রশস্ত আকারকে জাপানে শুভ ধরা হয়।","ne":"八月, 八時 मा はち। 八日 ようか ८ गते। तल फराकिलो आकारलाई जापानमा शुभ मानिन्छ।"},"九":{"en":"Two readings: きゅう (九分 きゅうふん) and く (九月 くがつ, 九時 くじ). 九日 is ここのか.","bn":"দুটি পাঠ: きゅう (九分) ও く (九月, 九時 くじ)। 九日 ここのか।","ne":"दुई पाठ: きゅう (九分) र く (九月, 九時 くじ)। 九日 ここのか।"},"十":{"en":"A plus-sign shape. Read じゅう: 十時 (じゅうじ). 十日 is とおか, the 10th. 二十 (にじゅう) is 20.","bn":"যোগ চিহ্নের আকার। じゅう: 十時 (じゅうじ)। 十日 とおか ১০ তারিখ। 二十 (にじゅう) মানে ২০।","ne":"जोड चिह्नको आकार। じゅう: 十時 (じゅうじ)। 十日 とおか १० गते। 二十 (にじゅう) = २०।"},"百":{"en":"Hundred. Sounds change: 三百 さんびゃく, 六百 ろっぴゃく, 八百 はっぴゃく.","bn":"একশো। ধ্বনি বদলায়: 三百 さんびゃく, 六百 ろっぴゃく, 八百 はっぴゃく।","ne":"सय। ध्वनि बदलिन्छ: 三百 さんびゃく, 六百 ろっぴゃく, 八百 はっぴゃく।"},"千":{"en":"Thousand. 三千 is さんぜん and 八千 is はっせん (sound changes).","bn":"হাজার। 三千 さんぜん ও 八千 はっせん (ধ্বনি বদলায়)।","ne":"हजार। 三千 さんぜん र 八千 はっせん (ध्वनि बदलिन्छ)।"},"万":{"en":"Japanese groups big numbers by 万 (10,000), so 100,000 is 十万 (ten 万). Always check the number system when shopping.","bn":"জাপানি বড় সংখ্যা 万 (১০,০০০) দিয়ে ভাগ করে, তাই ১,০০,০০০ হলো 十万। কেনাকাটায় সংখ্যা ব্যবস্থা খেয়াল রাখুন।","ne":"जापानी ठूला अङ्क 万 (१०,०००) ले समूह बनाउँछन्, त्यसैले १,००,००० = 十万। किनमेलमा अङ्कप्रणाली ध्यान दिनुहोस्।"},"円":{"en":"The Japanese currency, and the word for “circle”. Put it after the number: 千円, 百円.","bn":"জাপানি মুদ্রা, আবার “বৃত্ত”। সংখ্যার পরে বসে: 千円, 百円।","ne":"जापानी मुद्रा, र “गोलो” पनि। अङ्कपछि राखिन्छ: 千円, 百円।"},"半":{"en":"Put it after the hour to say “half past”: 二時半 (にじはん) = 2:30.","bn":"ঘণ্টার পরে বসিয়ে “সাড়ে” বোঝায়: 二時半 (にじはん) = ২:৩০।","ne":"घण्टापछि राखेर “साढे” जनाउँछ: 二時半 (にじはん) = २:३०।"},"週":{"en":"Use with 先 (last), 今 (this), 来 (next): 先週, 今週, 来週. Always read しゅう.","bn":"先 (গত), 今 (এই), 来 (আগামী)-এর সঙ্গে: 先週, 今週, 来週। সবসময় しゅう।","ne":"先 (गत), 今 (यो), 来 (आउँदो) सँग: 先週, 今週, 来週। सधैं しゅう।"},"朝":{"en":"Morning. 朝ご飯 (あさごはん) is breakfast. 今朝 (けさ) is a special reading.","bn":"সকাল। 朝ご飯 (あさごはん) সকালের নাস্তা। 今朝 (けさ) বিশেষ পাঠ।","ne":"बिहान। 朝ご飯 (あさごはん) बिहानको खाना। 今朝 (けさ) विशेष पाठ।"},"昼":{"en":"Midday. 昼休み (ひるやすみ) is the lunch break. 昼ご飯 is lunch.","bn":"মধ্যাহ্ন। 昼休み (ひるやすみ) মানে মধ্যাহ্ন-বিরতি। 昼ご飯 দুপুরের খাবার।","ne":"मध्यदिन। 昼休み (ひるやすみ) खाजा विश्राम। 昼ご飯 दिउँसोको खाना।"},"夜":{"en":"Night. 夜中 (よなか) is the middle of the night. 今夜 (こんや) is “tonight”.","bn":"রাত। 夜中 (よなか) মানে মধ্যরাত। 今夜 (こんや) মানে “আজ রাতে”।","ne":"रात। 夜中 (よなか) मध्यरात। 今夜 (こんや) “आज राति”।"},"男":{"en":"Male. 男の人 is “man”, 男の子 is “boy”. Read だん / なん in compounds like 男性 (だんせい).","bn":"পুরুষ। 男の人 “পুরুষ”, 男の子 “ছেলে”। 男性 (だんせい)-এর মতো যৌগে だん / なん।","ne":"पुरुष। 男の人 “पुरुष”, 男の子 “केटा”। 男性 (だんせい) जस्ता यौगिकमा だん / なん।"},"女":{"en":"Female. 女の人 is “woman”, 女の子 is “girl”. 彼女 (かのじょ) means “she” or “girlfriend”.","bn":"নারী। 女の人 “নারী”, 女の子 “মেয়ে”। 彼女 (かのじょ) মানে “সে (নারী)” বা “বান্ধবী”।","ne":"महिला। 女の人 “महिला”, 女の子 “केटी”। 彼女 (かのじょ) को अर्थ “उनी (महिला)” वा “प्रेमिका”।"},"子":{"en":"Child. 子供 (こども) is “child”. Often ends girls’ names (花子 はなこ).","bn":"শিশু। 子供 (こども) মানে “শিশু”। মেয়েদের নামের শেষে প্রায়ই থাকে (花子 はなこ)।","ne":"बच्चा। 子供 (こども) “बच्चा”। केटीको नामको अन्त्यमा प्रायः आउँछ (花子 はなこ)।"},"母":{"en":"Use 母 (はは) for your own mother and お母さん (おかあさん) for someone else’s or when speaking to her.","bn":"নিজের মায়ের জন্য 母 (はは), অন্যের মা বা সরাসরি ডাকতে お母さん (おかあさん)।","ne":"आफ्नी आमाका लागि 母 (はは), अरूको आमा वा सम्बोधनमा お母さん (おかあさん)।"},"父":{"en":"Use 父 (ちち) for your own father and お父さん (おとうさん) for someone else’s.","bn":"নিজের বাবার জন্য 父 (ちち), অন্যের বাবার জন্য お父さん (おとうさん)।","ne":"आफ्नो बुबाका लागि 父 (ちち), अरूको बुबाका लागि お父さん (おとうさん)।"},"友":{"en":"友達 (ともだち) is the everyday word. It is a special reading, with だち meaning “companions”.","bn":"友達 (ともだち) হলো প্রতিদিনের শব্দ। এটি বিশেষ পাঠ, だち মানে “সঙ্গী”।","ne":"友達 (ともだち) दैनिक शब्द हो। यो विशेष पाठ हो, だち को अर्थ “साथीहरू”।"},"先":{"en":"Before / earlier. 先生 literally means “one born before”. 先月 is last month.","bn":"আগের / পূর্ববর্তী। 先生 আক্ষরিক অর্থে “আগে জন্মানো”। 先月 গত মাস।","ne":"अघिको / पहिलेको। 先生 को शाब्दिक अर्थ “अघि जन्मिएको”। 先月 गत महिना।"},"名":{"en":"Name. 名前 is “name”; 有名 is “famous” (having a name).","bn":"নাম। 名前 মানে “নাম”; 有名 মানে “বিখ্যাত” (নাম আছে এমন)।","ne":"नाम। 名前 “नाम”; 有名 “प्रसिद्ध” (नाम भएको)।"},"北":{"en":"North. On station signs, 北口 is the north exit. 北海道 (ほっかいどう) is Hokkaido.","bn":"উত্তর। স্টেশনে 北口 উত্তর প্রস্থান। 北海道 (ほっかいどう) হোক্কাইদো।","ne":"उत्तर। स्टेशनमा 北口 उत्तर निकास। 北海道 (ほっかいどう) होक्काइदो।"},"南":{"en":"South. 南口 is the south exit. Remember the order: 東西南北 (とうざいなんぼく).","bn":"দক্ষিণ। 南口 দক্ষিণ প্রস্থান। ক্রম মনে রাখুন: 東西南北 (とうざいなんぼく)।","ne":"दक्षिण। 南口 दक्षिण निकास। क्रम सम्झनुहोस्: 東西南北 (とうざいなんぼく)।"},"東":{"en":"East. 東京 (とうきょう) means “eastern capital”. 東口 is the east exit.","bn":"পূর্ব। 東京 (とうきょう) মানে “পূর্বের রাজধানী”। 東口 পূর্ব প্রস্থান।","ne":"पूर्व। 東京 (とうきょう) को अर्थ “पूर्वी राजधानी”। 東口 पूर्व निकास।"},"西":{"en":"West. 西口 is the west exit. 関西 (かんさい) is the Kansai region (Osaka, Kyoto).","bn":"পশ্চিম। 西口 পশ্চিম প্রস্থান। 関西 (かんさい) কানসাই অঞ্চল (ওসাকা, কিয়োটো)।","ne":"पश्चिम। 西口 पश्चिम निकास। 関西 (かんさい) कान्साई क्षेत्र (ओसाका, क्योटो)।"},"外":{"en":"Outside. 外国 (がいこく) means “foreign country”; 外国人 (がいこくじん) is a foreigner. 外 is the opposite of 中 (inside).","bn":"বাইরে। 外国 (がいこく) “বিদেশ”; 外国人 (がいこくじん) বিদেশি। 外 হলো 中 (ভেতর)-এর বিপরীত।","ne":"बाहिर। 外国 (がいこく) “विदेश”; 外国人 (がいこくじん) विदेशी। 外 中 (भित्र) को उल्टो हो।"},"国":{"en":"Country. 国 (くに) alone; read こく in 中国 (ちゅうごく) and 外国 (がいこく). Names: 中国 China, 韓国 Korea.","bn":"দেশ। একা 国 (くに); 中国 (ちゅうごく), 外国 (がいこく)-এ こく। নাম: 中国 চীন, 韓国 কোরিয়া।","ne":"देश। एक्लै 国 (くに); 中国 (ちゅうごく), 外国 (がいこく) मा こく। नाम: 中国 चीन, 韓国 कोरिया।"},"店":{"en":"Shop / store. Many words end in 店: 本店 (main store), 喫茶店 (きっさてん, café).","bn":"দোকান। অনেক শব্দ 店-তে শেষ: 本店 (প্রধান শাখা), 喫茶店 (きっさてん, ক্যাফে)।","ne":"पसल। धेरै शब्द 店 मा टुंगिन्छन्: 本店 (मुख्य शाखा), 喫茶店 (きっさてん, क्याफे)।"},"駅":{"en":"Train station. 駅 (えき) is used in 駅員 (えきいん, station staff). It is a very useful kanji for travel.","bn":"ট্রেন স্টেশন। 駅員 (えきいん, স্টেশন কর্মী)-এ ব্যবহার হয়। ভ্রমণে খুব দরকারি কাঞ্জি।","ne":"रेल स्टेशन। 駅員 (えきいん, स्टेशन कर्मचारी) मा प्रयोग हुन्छ। यात्रामा धेरै उपयोगी कान्जी।"},"社":{"en":"Originally “shrine”. Today it mostly means “company”: 会社 (かいしゃ). 神社 (じんじゃ) is a Shinto shrine.","bn":"মূলত “মন্দির”। আজ মূলত “কোম্পানি”: 会社 (かいしゃ)। 神社 (じんじゃ) শিন্তো মন্দির।","ne":"मूल रूपमा “मन्दिर”। अहिले प्रायः “कम्पनी”: 会社 (かいしゃ)। 神社 (じんじゃ) शिन्तो मन्दिर।"},"院":{"en":"An institution. It appears in 病院 (hospital), 大学院 (graduate school), 美容院 (beauty salon). Read いん.","bn":"একটি প্রতিষ্ঠান। 病院 (হাসপাতাল), 大学院 (স্নাতকোত্তর), 美容院 (বিউটি সেলুন)-এ আছে। পাঠ いん।","ne":"एउटा संस्था। 病院 (अस्पताल), 大学院 (स्नातकोत्तर), 美容院 (ब्यूटी सैलुन) मा छ। पाठ いん।"},"町":{"en":"A town. 町 (まち) is a small city area, and also a unit of a ward. 町 is also read ちょう in addresses.","bn":"শহর। 町 (まち) ছোট শহর বা এলাকা। ঠিকানায় ちょう পড়া হয়।","ne":"सहर। 町 (まち) सानो सहर वा क्षेत्र। ठेगानामा ちょう पढिन्छ।"},"来":{"en":"The verb 来る is irregular: きます, こない, きた. As a prefix it means “next”: 来週, 来月, 来年.","bn":"ক্রিয়া 来る অনিয়মিত: きます, こない, きた। উপসর্গ হিসেবে মানে “আগামী”: 来週, 来月, 来年।","ne":"क्रिया 来る अनियमित छ: きます, こない, きた। उपसर्गको रूपमा अर्थ “आउँदो”: 来週, 来月, 来年।"},"行":{"en":"Go. 行く is a regular verb with an exception: the て-form is 行って. 東京行き (とうきょうゆき) means “bound for Tokyo”.","bn":"যাওয়া। 行く নিয়মিত ক্রিয়া, তবে て-রূপ 行って (ব্যতিক্রম)। 東京行き (とうきょうゆき) মানে “টোকিওগামী”।","ne":"जानु। 行く नियमित क्रिया हो, तर て-रूप 行って (अपवाद)। 東京行き (とうきょうゆき) को अर्थ “टोकियोतर्फ जाने”।"},"見":{"en":"See, look, watch. 見る (みる) is the basic verb; 見える (みえる) means “can be seen”; 見せる (みせる) means “to show”.","bn":"দেখা। 見る (みる) মূল ক্রিয়া; 見える (みえる) মানে “দেখা যায়”; 見せる (みせる) মানে “দেখানো”।","ne":"हेर्नु। 見る (みる) मूल क्रिया; 見える (みえる) “देखिन्छ”; 見せる (みせる) “देखाउनु”।"},"食":{"en":"Eat / food. 食べる (たべる) is “to eat”, 食べ物 is “food”, 朝食 (ちょうしょく) is breakfast.","bn":"খাওয়া / খাদ্য। 食べる (たべる) “খাওয়া”, 食べ物 “খাবার”, 朝食 (ちょうしょく) সকালের নাস্তা।","ne":"खानु / खाद्य। 食べる (たべる) “खानु”, 食べ物 “खाना”, 朝食 (ちょうしょく) बिहानको खाना।"},"飲":{"en":"Drink. 飲む (のむ) also covers taking medicine: くすりを飲む. 飲み物 means “beverage”.","bn":"পান করা। 飲む (のむ) ওষুধ খাওয়াও বোঝায়: くすりを飲む। 飲み物 মানে “পানীয়”।","ne":"पिउनु। 飲む (のむ) ले औषधि खानु पनि जनाउँछ: くすりを飲む। 飲み物 को अर्थ “पेय”।"},"読":{"en":"Read. 読む (よむ) takes を: ほんを読む. 読書 (どくしょ) means “reading as a hobby”.","bn":"পড়া। 読む (よむ)-এর সঙ্গে を: ほんを読む। 読書 (どくしょ) মানে “শখ হিসেবে পড়া”।","ne":"पढ्नु। 読む (よむ) सँग を: ほんを読む। 読書 (どくしょ) को अर्थ “रुचिको रूपमा पढ्नु”।"},"書":{"en":"Write. 書く (かく) is “to write”; 辞書 (じしょ) is “dictionary”; 図書館 (としょかん) is “library”.","bn":"লেখা। 書く (かく) “লেখা”; 辞書 (じしょ) “অভিধান”; 図書館 (としょかん) “লাইব্রেরি”।","ne":"लेख्नु। 書く (かく) “लेख्नु”; 辞書 (じしょ) “शब्दकोश”; 図書館 (としょかん) “पुस्तकालय”।"},"聞":{"en":"Hear, listen, ask. 聞く (きく) means both “to listen” and “to ask”: 先生に聞く. 新聞 is “newspaper”.","bn":"শোনা, জিজ্ঞাসা। 聞く (きく) “শোনা” ও “জিজ্ঞাসা করা” দুটোই: 先生に聞く। 新聞 মানে “সংবাদপত্র”।","ne":"सुन्नु, सोध्नु। 聞く (きく) ले “सुन्नु” र “सोध्नु” दुवै जनाउँछ: 先生に聞く। 新聞 “अखबार”।"},"買":{"en":"Buy. 買う (かう) is the opposite of 売る (うる, sell). 買い物 (かいもの) is “shopping”.","bn":"কেনা। 買う (かう) 売る (うる, বিক্রি)-এর বিপরীত। 買い物 (かいもの) মানে “কেনাকাটা”।","ne":"किन्नु। 買う (かう) 売る (うる, बेच्नु) को उल्टो। 買い物 (かいもの) “किनमेल”।"},"休":{"en":"Rest. 休む (やすむ) can mean rest or take a day off. 休み (やすみ) is a holiday: 夏休み (summer vacation).","bn":"বিশ্রাম। 休む (やすむ) মানে বিশ্রাম বা ছুটি নেওয়া। 休み (やすみ) ছুটি: 夏休み (গ্রীষ্মের ছুটি)।","ne":"आराम। 休む (やすむ) ले आराम वा बिदा लिनु जनाउँछ। 休み (やすみ) बिदा: 夏休み (गर्मी बिदा)।"},"入":{"en":"Enter. 入る (はいる) is “to enter”; 入れる (いれる) is “to put in”. 入口 is the entrance. Opposite of 出.","bn":"প্রবেশ। 入る (はいる) “ঢোকা”; 入れる (いれる) “ঢোকানো”। 入口 প্রবেশপথ। 出-এর বিপরীত।","ne":"प्रवेश। 入る (はいる) “पस्नु”; 入れる (いれる) “हाल्नु”। 入口 प्रवेशद्वार। 出 को उल्टो।"},"出":{"en":"Go out. 出る (でる) means “to leave”; 出す (だす) means “to take out / send”. 出口 (でぐち) is the exit.","bn":"বের হওয়া। 出る (でる) “ছাড়া”; 出す (だす) “বের করা / পাঠানো”। 出口 (でぐち) প্রস্থান।","ne":"निस्कनु। 出る (でる) “छोड्नु”; 出す (だす) “निकाल्नु / पठाउनु”। 出口 (でぐち) निकास।"},"会":{"en":"Meet. 会う takes に: ともだちに会う. 会社 (かいしゃ) is “company”, 会議 (かいぎ) is “meeting”.","bn":"দেখা করা। 会う-এর সঙ্গে に: ともだちに会う। 会社 (かいしゃ) “কোম্পানি”, 会議 (かいぎ) “সভা”।","ne":"भेट्नु। 会う सँग に: ともだちに会う। 会社 (かいしゃ) “कम्पनी”, 会議 (かいぎ) “बैठक”।"},"立":{"en":"Stand. 立つ (たつ) is “to stand”; 立てる (たてる) is “to set up”. 国立 is “national”, 立ち入り禁止 is “no entry”.","bn":"দাঁড়ানো। 立つ (たつ) “দাঁড়ানো”; 立てる (たてる) “দাঁড় করানো”। 国立 “জাতীয়”, 立ち入り禁止 “প্রবেশ নিষেধ”।","ne":"उभिनु। 立つ (たつ) “उभिनु”; 立てる (たてる) “उभ्याउनु”। 国立 “राष्ट्रिय”, 立ち入り禁止 “प्रवेश निषेध”।"},"教":{"en":"Teach. 教える (おしえる) is “to teach / tell”. 教室 is a classroom; 教科書 (きょうかしょ) is a textbook.","bn":"শেখানো। 教える (おしえる) “শেখানো / জানানো”। 教室 শ্রেণিকক্ষ; 教科書 (きょうかしょ) পাঠ্যবই।","ne":"सिकाउनु। 教える (おしえる) “सिकाउनु / जानकारी दिनु”। 教室 कक्षाकोठा; 教科書 (きょうかしょ) पाठ्यपुस्तक।"},"高":{"en":"Tall, high, expensive. 高い covers both height and price; the context shows which one.","bn":"উঁচু, দামি। 高い উচ্চতা ও দাম দুটোই বোঝায়; প্রসঙ্গে বোঝা যায়।","ne":"अग्लो, महँगो। 高い ले उचाइ र मूल्य दुवै जनाउँछ; सन्दर्भले छुट्याउँछ।"},"安":{"en":"Cheap and peaceful. 安い (やすい) is “cheap”; 安心 (あんしん) means “peace of mind”. Opposite of 高い for price.","bn":"সস্তা ও শান্ত। 安い (やすい) “সস্তা”; 安心 (あんしん) “মানসিক শান্তি”। দামে 高い-এর বিপরীত।","ne":"सस्तो र शान्त। 安い (やすい) “सस्तो”; 安心 (あんしん) “मनको शान्ति”। मूल्यमा 高い को उल्टो।"},"新":{"en":"New. 新しい (あたらしい) is an い-adjective. 新聞 (newspaper) literally means “new things heard”.","bn":"নতুন। 新しい (あたらしい) い-বিশেষণ। 新聞 (সংবাদপত্র) আক্ষরিক অর্থে “নতুন শোনা কথা”।","ne":"नयाँ। 新しい (あたらしい) い-विशेषण हो। 新聞 (अखबार) को शाब्दिक अर्थ “नयाँ सुनिएका कुरा”।"},"古":{"en":"Old (for things, not for a person’s age). 古い is the opposite of 新しい.","bn":"পুরনো (জিনিসের জন্য, মানুষের বয়সের জন্য নয়)। 古い হলো 新しい-এর বিপরীত।","ne":"पुरानो (वस्तुका लागि, मानिसको उमेरका लागि होइन)। 古い 新しい को उल्टो हो।"},"長":{"en":"Long, and also “chief”: 社長 (company head), 校長 (principal). Read ちょう for the “chief” meaning.","bn":"লম্বা, আবার “প্রধান”: 社長 (কোম্পানি প্রধান), 校長 (অধ্যক্ষ)। “প্রধান” অর্থে ちょう পড়া হয়।","ne":"लामो, र “प्रमुख” पनि: 社長 (कम्पनी प्रमुख), 校長 (प्रधानाध्यापक)। “प्रमुख” अर्थमा ちょう पढिन्छ।"},"白":{"en":"White. 白い is an い-adjective; 白 (しろ) is the noun. 白黒 (しろくろ) means black and white.","bn":"সাদা। 白い い-বিশেষণ; 白 (しろ) বিশেষ্য। 白黒 (しろくろ) মানে সাদা-কালো।","ne":"सेतो। 白い い-विशेषण; 白 (しろ) नाम। 白黒 (しろくろ) कालो-सेतो।"},"多":{"en":"Many, much. 多い (おおい) is an い-adjective but often goes after が: ひとが多い (many people). 多分 means “probably”.","bn":"অনেক। 多い (おおい) い-বিশেষণ, প্রায়ই が-এর পরে: ひとが多い (অনেক মানুষ)। 多分 মানে “সম্ভবত”।","ne":"धेरै। 多い (おおい) い-विशेषण हो, प्रायः が पछि: ひとが多い (धेरै मानिस)। 多分 को अर्थ “सायद”।"},"少":{"en":"Few, a little. 少し (すこし) is a useful word: すこし まってください (please wait a little).","bn":"অল্প, একটু। 少し (すこし) খুব কাজের শব্দ: すこし まってください (একটু অপেক্ষা করুন)।","ne":"थोरै, अलिकति। 少し (すこし) उपयोगी शब्द: すこし まってください (अलिकति पर्खनुहोस्)।"},"近":{"en":"Near. 近い is the opposite of 遠い (とおい, far). うちの近く means “near my house”.","bn":"কাছে। 近い হলো 遠い (とおい, দূরে)-এর বিপরীত। うちの近く মানে “আমার বাড়ির কাছে”।","ne":"नजिक। 近い 遠い (とおい, टाढा) को उल्टो। うちの近く को अर्थ “मेरो घर नजिक”।"},"早":{"en":"Early. 早い is for time; 速い (はやい) with a different kanji means “fast”. 早く (はやく) means “quickly / early”.","bn":"সময়ের “আগে”। 速い (はやい) অন্য কাঞ্জিতে মানে “দ্রুত”। 早く (はやく) মানে “তাড়াতাড়ি / আগে”।","ne":"समयको “चाँडो”। 速い (はやい) अर्को कान्जीमा “छिटो”। 早く (はやく) को अर्थ “चाँडै / छिटो”।"},"車":{"en":"Vehicle. 車 (くるま) is “car”; 電車 (でんしゃ) is “electric train”; 自転車 (じてんしゃ) is “bicycle”.","bn":"যানবাহন। 車 (くるま) “গাড়ি”; 電車 (でんしゃ) “বৈদ্যুতিক ট্রেন”; 自転車 (じてんしゃ) “সাইকেল”।","ne":"सवारी। 車 (くるま) “गाडी”; 電車 (でんしゃ) “विद्युतीय रेल”; 自転車 (じてんしゃ) “साइकल”।"},"電":{"en":"Electricity. Found in 電車 (train), 電話 (phone), 電気 (でんき, electric light) and 電気屋 (electronics shop).","bn":"বিদ্যুৎ। 電車 (ট্রেন), 電話 (ফোন), 電気 (でんき, বিদ্যুৎ বাতি)-তে।","ne":"बिजुली। 電車 (रेल), 電話 (फोन), 電気 (でんき, बिजुली बत्ती) मा।"},"肉":{"en":"Meat. Combine with animals: 牛肉 (beef), 豚肉 (ぶたにく, pork), 鳥肉 (とりにく, chicken).","bn":"মাংস। প্রাণীর সঙ্গে: 牛肉 (গরু), 豚肉 (ぶたにく, শূকর), 鳥肉 (とりにく, মুরগি)।","ne":"मासु। जनावरसँग: 牛肉 (गाई), 豚肉 (ぶたにく, सुँगुर), 鳥肉 (とりにく, कुखुरा)।"},"魚":{"en":"Fish. 魚 (さかな) is the food or animal; 魚屋 (さかなや) is a fish shop. 焼き魚 means grilled fish.","bn":"মাছ। 魚 (さかな) খাবার বা প্রাণী; 魚屋 (さかなや) মাছের দোকান। 焼き魚 ঝলসানো মাছ।","ne":"माछा। 魚 (さかな) खाना वा जनावर; 魚屋 (さかなや) माछा पसल। 焼き魚 पोलेको माछा।"},"茶":{"en":"Tea. お茶 (おちゃ) is Japanese tea, usually green. 茶色 (ちゃいろ) means the color brown (tea color).","bn":"চা। お茶 (おちゃ) জাপানি চা, সাধারণত সবুজ। 茶色 (ちゃいろ) মানে বাদামি রং (চা-রং)।","ne":"चिया। お茶 (おちゃ) जापानी चिया, प्रायः हरियो। 茶色 (ちゃいろ) को अर्थ खैरो रङ (चिया रङ)।"},"花":{"en":"Flower. 花見 (はなみ) is the spring custom of viewing cherry blossoms. 花火 (はなび) is fireworks (flower + fire).","bn":"ফুল। 花見 (はなみ) বসন্তে চেরি ফুল দেখার রীতি। 花火 (はなび) আতশবাজি (ফুল + আগুন)।","ne":"फूल। 花見 (はなみ) वसन्तमा चेरी फूल हेर्ने चलन। 花火 (はなび) आतिशबाजी (फूल + आगो)।"},"犬":{"en":"Dog. 犬 (いぬ). The dot is the ear. 犬 looks like 大 (big) and 太 (fat); look for the dot position.","bn":"কুকুর। 犬 (いぬ)। বিন্দুটি কান। 犬, 大 (বড়) ও 太 (মোটা) দেখতে কাছাকাছি; বিন্দুর অবস্থান দেখুন।","ne":"कुकुर। 犬 (いぬ)। थोप्ला कान हो। 犬, 大 (ठूलो) र 太 (मोटो) मिल्दाजुल्दा छन्; थोप्लाको स्थान हेर्नुहोस्।"},"色":{"en":"Color. 色 (いろ) is “color”; 何色 (なにいろ) asks “what color?”. Many colors end in 色: 黄色 (きいろ), 茶色 (ちゃいろ).","bn":"রং। 色 (いろ) “রং”; 何色 (なにいろ) জিজ্ঞাসা করে “কী রং?”। অনেক রং 色-তে শেষ: 黄色 (きいろ), 茶色 (ちゃいろ)।","ne":"रङ। 色 (いろ) “रङ”; 何色 (なにいろ) सोध्छ “कुन रङ?”। धेरै रङ 色 मा टुंगिन्छन्: 黄色 (きいろ), 茶色 (ちゃいろ)।"},"銀":{"en":"Silver. In 銀行 (bank), 行 is read こう, not いく. Silver was once the base of Japanese money.","bn":"রুপা। 銀行 (ব্যাংক)-এ 行 পড়া হয় こう, いく নয়। রুপা একসময় জাপানি মুদ্রার ভিত্তি ছিল।","ne":"चाँदी। 銀行 (बैंक) मा 行 लाई こう पढिन्छ, いく होइन। चाँदी कुनै समय जापानी मुद्राको आधार थियो।"},"話":{"en":"Talk. 話す (はなす) is the verb, 話 (はなし) is the noun “story”. 会話 (かいわ) means “conversation”.","bn":"কথা বলা। 話す (はなす) ক্রিয়া, 話 (はなし) বিশেষ্য “গল্প”। 会話 (かいわ) মানে “কথোপকথন”।","ne":"कुरा गर्नु। 話す (はなす) क्रिया, 話 (はなし) नाम “कथा”। 会話 (かいわ) को अर्थ “कुराकानी”।"},"病":{"en":"Illness. 病気 (びょうき) means “sick”: 病気です. 病院 (びょういん) is “hospital”.","bn":"অসুস্থতা। 病気 (びょうき) মানে “অসুস্থ”: 病気です। 病院 (びょういん) “হাসপাতাল”।","ne":"रोग। 病気 (びょうき) को अर्थ “बिरामी”: 病気です। 病院 (びょういん) “अस्पताल”।"},"室":{"en":"Room. 室 appears in 教室 (classroom), 会議室 (meeting room), 浴室 (よくしつ, bathroom). Usually read しつ.","bn":"কক্ষ। 教室 (শ্রেণিকক্ষ), 会議室 (সভা কক্ষ), 浴室 (よくしつ, স্নানঘর)-এ থাকে। সাধারণত しつ।","ne":"कोठा। 教室 (कक्षाकोठा), 会議室 (बैठक कक्ष), 浴室 (よくしつ, नुहाउने कोठा) मा। प्रायः しつ।"},"雨":{"en":"Rain. 雨 (あめ) is “rain”; 雨が降る (あめがふる) means “it rains”. 梅雨 (つゆ) is the rainy season.","bn":"বৃষ্টি। 雨 (あめ) “বৃষ্টি”; 雨が降る (あめがふる) “বৃষ্টি হয়”। 梅雨 (つゆ) বর্ষাকাল।","ne":"पानी। 雨 (あめ) “पानी”; 雨が降る (あめがふる) “पानी पर्छ”। 梅雨 (つゆ) वर्षा ऋतु।"},"空":{"en":"Sky and empty. 空 (そら) is the sky; 空く (あく) means “be empty / free”; 空港 (くうこう) is an airport.","bn":"আকাশ ও খালি। 空 (そら) আকাশ; 空く (あく) “ফাঁকা”; 空港 (くうこう) বিমানবন্দর।","ne":"आकाश र खाली। 空 (そら) आकाश; 空く (あく) “खाली”; 空港 (くうこう) विमानस्थल।"},"春":{"en":"Spring. 春 (はる) is when cherry blossoms bloom. The four seasons are 春夏秋冬 (しゅんかしゅうとう).","bn":"বসন্ত। 春 (はる) যখন চেরি ফুল ফোটে। চার ঋতু 春夏秋冬 (しゅんかしゅうとう)।","ne":"वसन्त। 春 (はる) जब चेरी फुल्छ। चार ऋतु 春夏秋冬 (しゅんかしゅうとう)।"},"夏":{"en":"Summer. 夏 (なつ) is hot and humid in Japan. 夏休み (なつやすみ) is the long school holiday.","bn":"গ্রীষ্ম। জাপানে 夏 (なつ) গরম ও আর্দ্র। 夏休み (なつやすみ) স্কুলের দীর্ঘ ছুটি।","ne":"गर्मी। जापानमा 夏 (なつ) तातो र चिसो हुन्छ। 夏休み (なつやすみ) विद्यालयको लामो बिदा।"},"秋":{"en":"Autumn. 秋 (あき) is the season of harvest and red leaves (紅葉 こうよう). Don’t confuse 秋 with 火 or 私 (わたし).","bn":"শরৎ। 秋 (あき) ফসল ও লাল পাতার (紅葉 こうよう) ঋতু। 秋-কে 火 বা 私 (わたし)-এর সঙ্গে গুলিয়ে ফেলবেন না।","ne":"शरद। 秋 (あき) बाली र रातो पातको (紅葉 こうよう) ऋतु। 秋 लाई 火 वा 私 (わたし) सँग नमिसाउनुहोस्।"},"冬":{"en":"Winter. 冬 (ふゆ) is cold and snowy in northern Japan. 冬休み (ふゆやすみ) is the winter holiday.","bn":"শীত। উত্তর জাপানে 冬 (ふゆ) ঠান্ডা ও তুষারপাতপূর্ণ। 冬休み (ふゆやすみ) শীতের ছুটি।","ne":"जाडो। उत्तरी जापानमा 冬 (ふゆ) चिसो र हिउँ पर्ने हुन्छ। 冬休み (ふゆやすみ) जाडो बिदा।"}};

  const CURATED_URLS_KEY = 'n5easy-curated-urls';
  function loadCuratedUrls(){try{return JSON.parse(localStorage.getItem(CURATED_URLS_KEY)||'{}');}catch{return{};}}
  let curatedUrls = loadCuratedUrls();
  function saveCuratedUrls(){try{localStorage.setItem(CURATED_URLS_KEY,JSON.stringify(curatedUrls));}catch{}}
  function getMaterialUrl(m){return curatedUrls[m.id]||m.url||'';}

  const MATERIALS_DB='n5easy-materials-db'; let materialsDb=null;
  function openMaterialsDB(){return new Promise((res,rej)=>{if(materialsDb)return res(materialsDb);if(!('indexedDB'in window))return rej(new Error('IndexedDB not supported'));const req=indexedDB.open(MATERIALS_DB,1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('pdfs'))db.createObjectStore('pdfs',{keyPath:'id'});};req.onsuccess=e=>{materialsDb=e.target.result;res(materialsDb);};req.onerror=e=>rej(e.target.error);});}
  function listUploads(){return openMaterialsDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('pdfs','readonly');const req=tx.objectStore('pdfs').getAll();req.onsuccess=()=>res(req.result||[]);req.onerror=e=>rej(e.target.error);}));}
  function saveUploadRecord(file){return openMaterialsDB().then(db=>new Promise((res,rej)=>{const r={id:'up-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:file.name,size:file.size,type:file.type||'application/pdf',uploadedAt:Date.now(),blob:file};const tx=db.transaction('pdfs','readwrite');const req=tx.objectStore('pdfs').add(r);req.onsuccess=()=>res(r);req.onerror=e=>rej(e.target.error);}));}
  function getUploadRecord(id){return openMaterialsDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('pdfs','readonly');const req=tx.objectStore('pdfs').get(id);req.onsuccess=()=>res(req.result);req.onerror=e=>rej(e.target.error);}));}
  function deleteUploadRecord(id){return openMaterialsDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('pdfs','readwrite');const req=tx.objectStore('pdfs').delete(id);req.onsuccess=()=>res();req.onerror=e=>rej(e.target.error);}));}

  const UNI_ADVICE={"title":{"en":"Before you apply","bn":"আবেদনের আগে জেনে নিন","ne":"आवेदन गर्नु अघि जान्नुहोस्"},"lang":{"en":"N5 is the beginner level. Degree programs taught in Japanese usually ask for N2 or N1. English-taught programs ask for proof of English instead. Check the exact rules of your program.","bn":"N5 হলো শুরুর স্তর। জাপানি ভাষায় পড়ানো ডিগ্রি প্রোগ্রামে সাধারণত N2 বা N1 লাগে। ইংরেজিতে পড়ানো প্রোগ্রামে ইংরেজি দক্ষতার প্রমাণ লাগে। আপনার প্রোগ্রামের নির্দিষ্ট শর্ত অফিসিয়াল সাইটে দেখুন।","ne":"N5 सुरुवाती तह हो। जापानी भाषामा पढाइने डिग्री कार्यक्रममा सामान्यतया N2 वा N1 चाहिन्छ। अंग्रेजीमा पढाइने कार्यक्रममा अंग्रेजी भाषाको प्रमाण चाहिन्छ। आफ्नो कार्यक्रमको सर्त आधिकारिक साइटमा हेर्नुहोस्।"},"cost":{"en":"National universities charge a standard ¥535,800 tuition per year plus a one-time ¥282,000 entrance fee. Private universities usually cost more and vary by faculty. Some fees are changing: the University of Tokyo raised undergraduate tuition for new students from 2025 (reported ≈¥642,960), and Tsukuba will revise tuition for international students from April 2027. Always confirm on the official site.","bn":"জাতীয় বিশ্ববিদ্যালয়ে সাধারণ বার্ষিক টিউশন ¥535,800 এবং একবারের ভর্তি ফি ¥282,000। বেসরকারি বিশ্ববিদ্যালয়ে খরচ সাধারণত বেশি এবং বিভাগভেদে আলাদা। কিছু ফি বদলাচ্ছে: টোকিও বিশ্ববিদ্যালয় ২০২৫ থেকে নতুন স্নাতক শিক্ষার্থীদের টিউশন বাড়িয়েছে (প্রকাশিত তথ্য অনুযায়ী ≈¥642,960), আর সুকুবা ২০২৭ সালের এপ্রিল থেকে আন্তর্জাতিক শিক্ষার্থীদের টিউশন সংশোধন করবে। সবসময় অফিসিয়াল সাইটে নিশ্চিত হয়ে নিন।","ne":"राष्ट्रिय विश्वविद्यालयमा सामान्य वार्षिक शुल्क ¥535,800 र एक पटकको भर्ना शुल्क ¥282,000 हो। निजी विश्वविद्यालयमा खर्च बढी र संकायअनुसार फरक हुन्छ। केही शुल्क परिवर्तन हुँदैछन्: टोकियो विश्वविद्यालयले २०२५ देखि नयाँ स्नातक विद्यार्थीको शुल्क बढायो (रिपोर्ट अनुसार ≈¥642,960) र सुकुबाले अप्रिल २०२७ देखि अन्तर्राष्ट्रिय विद्यार्थीको शुल्क संशोधन गर्नेछ। सधैं आधिकारिक साइटमा पुष्टि गर्नुहोस्।"}};

  /* ============ STATE ============ */
  const SAVE_KEY='n5easy-state-v9';
  const defaultState={lang:'en',theme:'light',lessonsCompleted:[],lessonsBookmarked:[],vocabLearned:{},vocabBookmarked:{},kanjiLearned:{},kanaMastered:{},quizHistory:[],flashcards:{},streak:{count:0,lastStudy:''},recentLessons:[],dailyGoal:20};
  let state=loadState();
  function loadState(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return{...defaultState};return{...defaultState,...JSON.parse(raw)};}catch{return{...defaultState};}}
  function saveState(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch{}}
  function t(obj){if(!obj)return '';if(typeof obj==='string')return obj;return obj[state.lang]||obj.en||'';}
  function tUi(key){return t(UI[key]||key);}
  function touchStreak(){const today=new Date().toISOString().slice(0,10);if(state.streak.lastStudy===today)return;const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);state.streak.count=state.streak.lastStudy===yesterday?state.streak.count+1:1;state.streak.lastStudy=today;saveState();}
  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400);}
  function toggleArray(arr,id){return arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];}
  function toggleMap(map,key){const next={...map};if(next[key])delete next[key];else next[key]=true;return next;}
  function reviewSRS(card,quality){let{ease=2.5,interval=0,repetitions=0}=card||{};if(quality===0){repetitions=0;interval=1;}else{if(repetitions===0)interval=1;else if(repetitions===1)interval=3;else interval=Math.max(1,Math.round(interval*ease));repetitions+=1;}const adj=[-0.2,-0.05,0.05,0.15][quality];ease=Math.max(1.3,Math.min(3.0,ease+adj));const due=Date.now()+interval*86400000;return{ease,interval,repetitions,due};}
  function isDue(card){return!card||card.due<=Date.now();}

  /* ============ AUDIO ============ */
  const speakState={ja:null,warned:false};
  function initVoices(){if(!('speechSynthesis'in window))return;const load=()=>{const voices=speechSynthesis.getVoices();speakState.ja=voices.find(v=>v.lang==='ja-JP')||voices.find(v=>v.lang.startsWith('ja'));};load();speechSynthesis.onvoiceschanged=load;}
  function speak(text,btn){if(!('speechSynthesis'in window)){toast('Audio not supported');return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=0.85;if(!speakState.ja){const vs=speechSynthesis.getVoices();speakState.ja=vs.find(v=>v.lang==='ja-JP')||vs.find(v=>v.lang.startsWith('ja'));}if(speakState.ja)u.voice=speakState.ja;else if(!speakState.warned){speakState.warned=true;toast('No Japanese voice');}if(btn){btn.classList.add('speaking');setTimeout(()=>btn.classList.remove('speaking'),650);}speechSynthesis.speak(u);}catch(e){toast('Audio error');}}
  function speakBtn(text){return `<button class="speak-btn" data-speak="${esc(text)}" aria-label="${esc(tUi('listen'))}">${ICONS.volume}</button>`;}

  const CONFIG={

    ADMIN_HASH:'19uy3p94y8y',

  function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
  const ADMIN_KEY='n5easy-admin-session', VID_KEY='n5easy-vid', LOG_KEY='n5easy-analytics-log';
  function isAdmin(){try{return localStorage.getItem(ADMIN_KEY)===CONFIG.ADMIN_HASH;}catch{return false;}}
  function adminLogin(pw){if(cyrb53(pw||'')===CONFIG.ADMIN_HASH){try{localStorage.setItem(ADMIN_KEY,CONFIG.ADMIN_HASH);}catch{}return true;}return false;}
  function adminLogout(){try{localStorage.removeItem(ADMIN_KEY);}catch{}}
  function getVid(){try{let v=localStorage.getItem(VID_KEY);if(!v){v='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem(VID_KEY,v);}return v;}catch{return 'anon';}}
  function localLog(){try{return JSON.parse(localStorage.getItem(LOG_KEY)||'[]');}catch{return [];}}
  function detectCountry(){
    try{const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||'');
      if(tz==='Asia/Dhaka')return 'BD';
      if(tz==='Asia/Kolkata'||tz==='Asia/Calcutta')return 'IN';
      if(tz==='Asia/Kathmandu'||tz==='Asia/Katmandu')return 'NP';
    }catch{}
    return 'OT';
  }
  function trackView(){
    if(isAdmin())return;
    const path=(location.hash.replace(/^#/,'')||'/').split('/').filter(Boolean)[0]||'home';
    let ref='direct';try{if(document.referrer){const h=new URL(document.referrer).hostname;if(h&&h!==location.hostname)ref=h;}}catch{}

  /* ============ SAKURA ============ */
  function sakuraPetals(n,minS,maxS,minD,maxD){
    let seed=n*7919+minS*31+maxS;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
    let out='';
    for(let i=0;i<n;i++){
      const sz=minS+rnd()*(maxS-minS),d=minD+rnd()*(maxD-minD);
      out+=`<i style="left:${(rnd()*100).toFixed(1)}%;width:${sz.toFixed(1)}px;height:${(sz*.8).toFixed(1)}px;animation-duration:${d.toFixed(1)}s;animation-delay:-${(rnd()*d).toFixed(1)}s;--sway:${(rnd()*40-20).toFixed(0)}px;--drift:${(rnd()*60-10).toFixed(0)}px;--o:${(.55+rnd()*.35).toFixed(2)}"></i>`;
    }
    return out;
  }
